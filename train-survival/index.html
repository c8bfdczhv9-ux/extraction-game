<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NIGHT TRAIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#140e1a;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:fixed}
#wrap{position:relative;width:100vw;height:100vh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;background:#1a1220;border-radius:8px;max-width:100vw;max-height:56vh;border:1px solid rgba(139,123,160,0.25)}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.hb{background:rgba(20,14,26,0.94);border:1px solid rgba(139,123,160,0.25);border-radius:5px;padding:5px 12px;font-size:12px;color:#8b7ba0;letter-spacing:1.5px;font-weight:300}
#inv{position:absolute;bottom:84px;left:10px;right:10px;display:flex;gap:4px;justify-content:center;pointer-events:none;z-index:10;flex-wrap:wrap}
.iv{background:rgba(20,14,26,0.94);border:1px solid rgba(139,123,160,0.2);border-radius:4px;padding:3px 8px;font-size:9px;color:#8b7ba0}
#ctrls{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;z-index:10}
#joy{width:96px;height:96px;background:rgba(42,26,58,0.45);border:1.5px solid rgba(196,168,224,0.2);border-radius:50%;position:relative;touch-action:none}
#stick{width:40px;height:40px;background:rgba(196,168,224,0.35);border:1px solid rgba(196,168,224,0.45);border-radius:50%;position:absolute;top:28px;left:28px;pointer-events:none}
#pick{width:60px;height:60px;background:rgba(122,144,200,0.18);border:1.5px solid rgba(122,144,200,0.35);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(196,168,224,0.7);margin-bottom:18px;touch-action:none}
#pick:active{background:rgba(122,144,200,0.35)}
#over{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(10,6,14,0.96);border-radius:8px}
#over.show{display:flex}
.ot{font-size:18px;color:#c4a8e0;letter-spacing:3px;margin-bottom:6px;font-weight:200}
.os{font-size:11px;color:#8b7ba0;margin-bottom:16px;font-weight:300}
.btn{background:rgba(122,144,200,0.12);border:1px solid rgba(122,144,200,0.3);color:#8b7ba0;padding:10px 26px;border-radius:6px;font-size:12px;letter-spacing:2px;cursor:pointer;margin:4px;font-weight:300}
.btn:active{background:rgba(122,144,200,0.25);color:#c4a8e0}
#hint{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);color:rgba(139,123,160,0.3);font-size:10px;letter-spacing:2px;pointer-events:none;z-index:5}
#warn{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);color:#c87080;font-size:12px;letter-spacing:2px;pointer-events:none;z-index:5;opacity:0;text-align:center;font-weight:300}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g"></canvas>
<div id="hud"><span class="hb" id="tm">60s</span><span class="hb">NIGHT TRAIN</span></div>
<div id="inv"></div>
<div id="hint">拖动摇杆 · 点击拾取</div>
<div id="warn"></div>
<div id="ctrls">
  <div id="joy"><div id="stick"></div></div>
  <div id="pick">✦</div>
</div>
<div id="over"><div class="ot" id="ot"></div><div class="os" id="os"></div><button class="btn" onclick="rst()">RETRY</button></div>
</div>
<script>
// ===== SETUP =====
var g=document.getElementById('g'), x=g.getContext('2d');
var W,H;
function resize(){
  W=Math.min(window.innerWidth-12,500);
  H=Math.min(window.innerHeight*0.54,600);
  g.width=W; g.height=H;
}

// ===== STATE =====
var cars=[], player={x:0,y:0}, cam=0, time=60, st='play';
var inv={food:0,coal:0,water:0,gear:0,comm:0,med:0};
var loot=[], pts=[], stars=[], inLast=false, dc=0;

// ===== COLORS =====
var CL={
  sky1:'#140e1a', sky2:'#2a1a3a', sky3:'#4a3040',
  va:'#c4a8e0', ga:'#7a90c8', pe:'#c8a878',
  lg:'#7ac8a0', dc:'#c87080', la:'#8b7ba0', cw:'#e8d8f0'
};

// ===== CAR DATA =====
var NC=6;
function carW(){return W/3.5}
function carH(){return H*0.65}

function makeCars(){
  cars=[];
  for(var i=0;i<NC;i++){
    var cw=carW(), ch=carH();
    cars.push({x:i*cw, y:H*0.2, w:cw, h:ch, last:i===NC-1});
  }
}

// ===== ITEMS =====
var IT=[  
  {k:'food',s:'◆',n:'FOOD',c:CL.pe},
  {k:'coal',s:'■',n:'COAL',c:'#4a3a50'},
  {k:'water',s:'●',n:'WATER',c:CL.ga},
  {k:'gear',s:'▲',n:'GEAR',c:CL.la},
  {k:'comm',s:'◈',n:'COMM',c:'#a89870'},
  {k:'med',s:'◇',n:'MED',c:CL.dc}
];

function spawnLoot(){
  loot=[];
  for(var i=0;i<NC;i++){
    var c=cars[i], n=3+Math.floor(Math.random()*4);
    for(var j=0;j<n;j++){
      var d=IT[Math.floor(Math.random()*IT.length)];
      loot.push({x:c.x+20+Math.random()*(c.w-60), y:c.y+c.h-30-Math.random()*18, ci:i, d:d, got:false});
    }
  }
}

// ===== STARS =====
function makeStars(){
  stars=[];
  for(var i=0;i<180;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H*0.78,
      r:0.4+Math.random()*1.3, a:0.2+Math.random()*0.5,
      tw:Math.random()*6.28, ts:1+Math.random()*3
    });
  }
}

// ===== UI =====
function updInv(){
  var h='';
  for(var i=0;i<IT.length;i++) h+='<span class=iv>'+IT[i].s+' '+inv[IT[i].k]+'</span>';
  document.getElementById('inv').innerHTML=h;
}

// ===== GAME FLOW =====
function rst(){
  time=60; st='play'; inv={food:0,coal:0,water:0,gear:0,comm:0,med:0};
  inLast=false; dc=0; pts=[]; loot=[];
  makeCars(); spawnLoot(); makeStars();
  player.x=carW()/2; cam=0;
  document.getElementById('over').classList.remove('show');
  document.getElementById('warn').style.opacity='0';
  document.getElementById('hint').style.opacity='1';
  document.getElementById('ctrls').style.display='flex';
  updInv();
}

function gameOver(win){
  st='end';
  document.getElementById('over').classList.add('show');
  var total=0; for(var k in inv) total+=inv[k];
  if(win){
    document.getElementById('ot').textContent='✦ DETACHED';
    document.getElementById('os').textContent='Collected '+total+' items';
  }else{
    document.getElementById('ot').textContent='✦ END';
    document.getElementById('os').textContent='Did not reach last car';
  }
  document.getElementById('ctrls').style.display='none';
}

function collect(it){
  if(it.got)return; it.got=true; inv[it.d.k]++; updInv();
  for(var i=0;i<8;i++) pts.push({x:it.x,y:it.y,vx:(Math.random()-0.5)*2.5,vy:-2-Math.random()*2.5,life:22,ml:22,c:it.d.c,s:1.5+Math.random()*2});
}

function pickup(){
  for(var i=0;i<loot.length;i++){
    var l=loot[i]; if(l.got)continue;
    if(Math.abs(player.x-l.x)<32&&Math.abs(player.y-l.y)<36) collect(l);
  }
}

// ===== UPDATE =====
function up(dt){
  if(st!=='play'){
    pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});
    return;
  }
  time-=dt; if(time<0)time=0;
  document.getElementById('tm').textContent=Math.ceil(time)+'s';
  if(time<15)document.getElementById('tm').style.color=CL.dc;
  else document.getElementById('tm').style.color=CL.la;
  if(time<8)document.getElementById('hint').style.opacity='0';
  if(time<=0){gameOver(false);return;}

  // Movement
  var dx=joyX;
  if(keys[37]||keys[65])dx=-1;
  if(keys[39]||keys[68])dx+=1;
  player.x+=dx*5*60*dt;
  player.x=Math.max(8,Math.min(cars[NC-1].x+cars[NC-1].w-8,player.x));
  var ci=Math.floor(player.x/carW());
  if(ci>=0&&ci<NC)player.y=cars[ci].y+cars[ci].h-36;
  cam=player.x-W/2;
  cam=Math.max(0,Math.min(cars[NC-1].x+cars[NC-1].w-W,cam));

  // Last car detach
  var inL=ci===NC-1;
  if(inL&&!inLast){inLast=true;dc=0;document.getElementById('warn').style.opacity='1';}
  if(inL&&inLast){dc+=dt;document.getElementById('warn').innerHTML='LAST CAR<br>'+Math.ceil(3-dc)+'s';if(dc>=3)gameOver(true);}
  if(!inL&&inLast){inLast=false;dc=0;document.getElementById('warn').style.opacity='0';}

  // Particles
  pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});
}

// ===== DRAW =====
function draw(){
  x.clearRect(0,0,W,H);

  // Sky
  var sky=x.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,CL.sky1); sky.addColorStop(0.25,CL.sky2);
  sky.addColorStop(0.55,'#3a2035'); sky.addColorStop(0.75,CL.sky3);
  sky.addColorStop(0.9,'#1a0c08'); sky.addColorStop(1,'#0e0804');
  x.fillStyle=sky; x.fillRect(0,0,W,H);

  // Stars
  var t=Date.now()/1000;
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    x.fillStyle=CL.va; x.globalAlpha=s.a*(0.5+0.5*Math.sin(t*s.ts+s.tw));
    x.beginPath(); x.arc(s.x-cam*0.02,s.y,s.r,0,6.28); x.fill();
  }
  x.globalAlpha=1;

  // Ground
  x.fillStyle='#1a1008'; x.fillRect(0,H*0.8,W,H*0.2);
  // Rails
  for(var rx=-(cam%36);rx<W;rx+=36){
    x.fillStyle='#1a1220'; x.fillRect(rx,H*0.8+3,5,9);
    x.fillStyle='rgba(139,123,160,0.15)'; x.fillRect(rx+2.5,H*0.8+3,1.5,9);
    x.fillStyle='rgba(200,168,120,0.07)'; x.fillRect(rx-7,H*0.8+7,20,1.5);
  }

  // Smoke
  for(var si=0;si<4;si++){
    var sx=cars[0].x-cam-14, sy=56+si*14+Math.sin(t*1.7+si)*7;
    x.fillStyle=CL.pe; x.globalAlpha=0.08+0.03*Math.sin(t*2+si);
    x.beginPath(); x.arc(sx-Math.sin(t+si)*5,sy,7+si*3,0,6.28); x.fill();
  }
  x.globalAlpha=1;

  // Cars
  for(var ci=0;ci<cars.length;ci++){
    var c=cars[ci], cx=c.x-cam, cy=c.y, cw=c.w, ch=c.h, uh=ch*0.45;

    // Upper
    var ug=x.createLinearGradient(cx,cy,cx,cy+uh);
    ug.addColorStop(0,'#241a30'); ug.addColorStop(0.6,'#1e1430'); ug.addColorStop(1,'#2a1c38');
    x.fillStyle=ug; x.fillRect(cx,cy,cw,uh);

    // Lower
    var lg=x.createLinearGradient(cx,cy+uh,cx,cy+ch);
    lg.addColorStop(0,'#3a2a50'); lg.addColorStop(0.5,'#342248'); lg.addColorStop(1,'#2a1a3a');
    x.fillStyle=lg; x.fillRect(cx,cy+uh,cw,ch-uh);

    // Stripe
    x.strokeStyle=CL.va; x.globalAlpha=0.3; x.lineWidth=1;
    x.beginPath(); x.moveTo(cx+4,cy+uh); x.lineTo(cx+cw-4,cy+uh); x.stroke();
    x.globalAlpha=1;

    // Highlight
    var hl=x.createLinearGradient(cx,cy,cx,cy+8);
    hl.addColorStop(0,'rgba(232,216,240,0.16)'); hl.addColorStop(1,'transparent');
    x.fillStyle=hl; x.fillRect(cx,cy,cw,8);

    // Windows
    var wx=cx+cw*0.08, ww=cw*0.22, wy=cy+7, wh=uh-14;
    for(var wi=0;wi<3;wi++){
      var wxi=wx+wi*(ww+5);
      x.fillStyle='rgba(200,168,120,0.13)'; x.fillRect(wxi,wy,ww,wh);
      x.strokeStyle='rgba(196,168,224,0.18)'; x.lineWidth=0.5; x.strokeRect(wxi,wy,ww,wh);
    }

    // Roof
    x.fillStyle='#1a1220'; x.fillRect(cx,cy-4,cw,5);

    // Chassis
    x.fillStyle='#0e0a14'; x.fillRect(cx,cy+ch-6,cw,7);

    // Coupler
    if(ci<NC-1){x.fillStyle='#1a1220'; x.fillRect(cx+cw-5,cy+ch*0.4,5,ch*0.2);}

    // Detach zone
    if(c.last){
      var a=0.15+0.1*Math.sin(t*2.5);
      x.strokeStyle='rgba(200,112,128,'+(0.25+a)+')'; x.lineWidth=1.5;
      x.strokeRect(cx+2,cy+2,cw-4,ch-4);
      var dz=x.createLinearGradient(cx,cy+ch-28,cx,cy+ch);
      dz.addColorStop(0,'transparent'); dz.addColorStop(1,'rgba(200,112,128,0.15)');
      x.fillStyle=dz; x.fillRect(cx,cy+ch-28,cw,28);
      x.fillStyle='rgba(200,112,128,'+(0.45+a*0.4)+')'; x.font='8px system-ui';
      x.textAlign='center'; x.fillText('DETACH',cx+cw/2,cy+ch-8);
    }

    // Label
    x.fillStyle='rgba(139,123,160,0.3)'; x.font='7px system-ui'; x.textAlign='left';
    x.fillText('CAR '+(ci+1),cx+6,cy+16);
  }

  // Loot
  for(var li=0;li<loot.length;li++){
    var l=loot[li]; if(l.got)continue;
    var lx=l.x-cam; if(lx<-30||lx>W+30)continue;
    x.fillStyle=l.d.c; x.font='12px system-ui'; x.textAlign='center';
    x.fillText(l.d.s,lx,l.y);
    x.globalAlpha=0.4; x.fillStyle=l.d.c; x.font='6px system-ui';
    x.fillText(l.d.n,lx,l.y+10);
  }
  x.globalAlpha=1;

  // Player
  var px=player.x-cam, py=player.y;
  x.fillStyle='rgba(10,6,14,0.4)'; x.beginPath(); x.ellipse(px,py+12,7,1.8,0,0,6.28); x.fill();
  x.fillStyle=CL.cw; x.beginPath(); x.arc(px,py-11,7,0,6.28); x.fill();
  x.fillStyle=CL.va; x.globalAlpha=0.3; x.beginPath(); x.arc(px-2,py-13,2.2,0,6.28); x.fill();
  x.globalAlpha=1;
  x.fillStyle='#3a2a50'; x.fillRect(px-4,py-3,8,14);
  x.fillStyle=CL.va; x.globalAlpha=0.35; x.fillRect(px-3,py+3,6,0.8);
  x.globalAlpha=1;
  x.fillStyle='#241a30'; x.fillRect(px-3,py+11,3.5,8); x.fillRect(px+0.5,py+11,3.5,8);

  // Particles
  for(var pi=0;pi<pts.length;pi++){
    var p=pts[pi];
    x.globalAlpha=p.life/p.ml; x.fillStyle=p.c;
    x.beginPath(); x.moveTo(p.x-cam,p.y-p.s); x.lineTo(p.x-cam+p.s,p.y);
    x.lineTo(p.x-cam,p.y+p.s); x.lineTo(p.x-cam-p.s,p.y); x.closePath(); x.fill();
  }
  x.globalAlpha=1;

  // Vignette
  var vig=x.createRadialGradient(W/2,H*0.4,W*0.2,W/2,H*0.4,W*0.85);
  vig.addColorStop(0,'transparent'); vig.addColorStop(0.6,'rgba(10,6,14,0.15)');
  vig.addColorStop(1,'rgba(10,6,14,0.65)');
  x.fillStyle=vig; x.fillRect(0,0,W,H);
}

// ===== LOOP =====
var lt=0;
function loop(ts){
  var dt=lt?Math.min((ts-lt)/1000,0.1):0.016; lt=ts;
  try{up(dt);}catch(e){}
  try{draw();}catch(e){}
  requestAnimationFrame(loop);
}

// ===== INPUT =====
var joyX=0, joyActive=false, joyOX=0, joyOY=0;
var keys={};
var joy=document.getElementById('joy'), stick=document.getElementById('stick');

function joyMove(cx,cy){
  var r=joy.getBoundingClientRect();
  var dx=cx-r.left, dy=cy-r.top;
  if(!joyActive){joyOX=dx; joyOY=dy; joyActive=true;}
  var mx=dx-joyOX, my=dy-joyOY;
  var d=Math.sqrt(mx*mx+my*my);
  if(d>30){mx=mx/d*30; my=my/d*30;}
  stick.style.left=(28+mx)+'px'; stick.style.top=(28+my)+'px';
  joyX=mx/30;
}

function joyEnd(){
  joyActive=false; joyX=0;
  stick.style.left='28px'; stick.style.top='28px';
}

joy.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY);});
joy.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY);});
joy.addEventListener('touchend',function(e){e.preventDefault();joyEnd();});
joy.addEventListener('touchcancel',function(e){e.preventDefault();joyEnd();});
joy.addEventListener('mousedown',function(e){e.preventDefault();joyMove(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){if(joyActive)joyMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',function(){if(joyActive)joyEnd();});

var pick=document.getElementById('pick');
pick.addEventListener('touchstart',function(e){e.preventDefault();if(st==='play')pickup();});
pick.addEventListener('mousedown',function(e){e.preventDefault();if(st==='play')pickup();});

window.addEventListener('keydown',function(e){
  keys[e.keyCode]=true;
  if(e.keyCode===32&&st==='play'){e.preventDefault();pickup();}
});
window.addEventListener('keyup',function(e){keys[e.keyCode]=false;});

// ===== START =====
resize();
makeCars();
spawnLoot();
makeStars();
updInv();
player.x=carW()/2;
requestAnimationFrame(loop);
</script>
</body>
</html>
