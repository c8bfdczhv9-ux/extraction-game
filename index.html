<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>撤离 · Extraction</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#121016;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;position:fixed}
#wrap{position:relative;width:100vw;height:100vh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;background:#1a1622;border-radius:8px;max-width:100vw;max-height:68vh;box-shadow:0 0 60px rgba(107,63,160,0.15)}
#hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10;gap:8px}
.h{border-radius:6px;padding:5px 10px;font-size:12px;letter-spacing:1px;background:rgba(26,22,34,0.9);border:1px solid rgba(107,63,160,0.25)}
#sc{color:#c4a8e0}#tm{color:#c8a878}#st{color:#8b7ba0;font-size:10px;letter-spacing:2px;text-transform:uppercase}
#st.warn{color:#c8a878;animation:pulse .8s infinite}#st.ok{color:#7ac8a0}#st.dead{color:#c87080}
#touch{position:absolute;bottom:24px;left:0;right:0;display:none;justify-content:center;gap:6px;z-index:10;pointer-events:none}
.tb{width:48px;height:48px;background:rgba(38,30,52,0.65);border:1px solid rgba(107,63,160,0.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(180,150,220,0.6);pointer-events:auto}
.tb:active{background:rgba(107,63,160,0.4)}
#overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(16,12,24,0.94);border-radius:8px}
#overlay.show{display:flex}
#lvl{font-size:13px;color:#8b7ba0;letter-spacing:3px;margin-bottom:6px}
.gr{font-size:64px;font-weight:900;letter-spacing:4px;margin-bottom:4px}
.gS{color:#c8a878;text-shadow:0 0 40px rgba(200,168,120,0.5)}
.gA{color:#7ac8a0;text-shadow:0 0 30px rgba(122,200,160,0.4)}
.gB{color:#7a90c8;text-shadow:0 0 25px rgba(122,144,200,0.4)}
.gC{color:#a0a0c0}
.gD{color:#c87080}
.lb{font-size:13px;color:#8b7ba0;letter-spacing:2px;margin-bottom:14px}
.sts{display:flex;gap:20px;margin-bottom:18px}
.stv{font-size:22px;font-weight:700;color:#c4a8e0;text-align:center}
.stl{font-size:9px;color:#6b5b7a;letter-spacing:1px;margin-top:2px}
.btn{background:rgba(107,63,160,0.2);border:1px solid rgba(130,100,200,0.4);color:#c4a8e0;padding:10px 20px;border-radius:8px;font-size:12px;letter-spacing:1px;margin:4px;pointer-events:auto;cursor:pointer}
.btn:active{background:rgba(130,100,200,0.35)}
.btn2{color:#6b5b7a;font-size:11px;letter-spacing:1px;pointer-events:auto;cursor:pointer;margin-top:4px}
#ready{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#c4a8e0;font-size:18px;letter-spacing:4px;pointer-events:none;z-index:5;transition:opacity .5s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g"></canvas>
<div id="hud"><span class="h" id="sc">✦ 0</span><span class="h" id="lv">Lv.1</span><span class="h" id="tm">5:00</span><span id="st">READY</span></div>
<div id="touch"></div>
<div id="ready">LEVEL 1 · 准备</div>
<div id="overlay">
<div id="lvl"></div><div class="gr" id="gr">S</div><div class="lb" id="lb"></div>
<div class="sts"><div><div class="stv" id="es">0</div><div class="stl">SCORE</div></div><div><div class="stv" id="ei">0</div><div class="stl">LOOT</div></div><div><div class="stv" id="et">0s</div><div class="stl">TIME</div></div></div>
<button class="btn" onclick="shareR()">📋 COPY</button>
<div class="btn2" onclick="nextLvl()" id="nx">▶ NEXT LEVEL</div>
<div class="btn2" onclick="rst()" style="margin-top:2px">↻ RETRY</div>
</div>
</div>

<script>
const C=document.getElementById('g'),X=C.getContext('2d');
function rs(){const mw=Math.min(window.innerWidth-16,500),mh=Math.min(window.innerHeight*.62,680),r=4/3;let w,h;if(mw/mh>r){h=mh;w=h*r}else{w=mw;h=w/r}C.width=w;C.height=h}
rs();window.addEventListener('resize',rs);
const W=()=>C.width,H=()=>C.height;
const T='ontouchstart' in window||navigator.maxTouchPoints>0;
if(T)document.getElementById('touch').style.display='flex';

// Shuai Feng Corpus Color Palette
const CP={
  bg:'#1a1622',grid:'rgba(45,35,60,0.5)',
  player:'#c4a8e0',playerGlow:'rgba(180,140,220,0.25)',
  extract:'#7ac8a0',extractGlow:'rgba(122,200,160,0.2)',
  timer:'#c8a878',warn:'#c8a878',
  common:{c:'#a8a0b8',g:'rgba(168,160,184,0.3)',p:5,l:'COMMON'},
  uncommon:{c:'#8bc8a8',g:'rgba(139,200,168,0.3)',p:15,l:'UNCOMMON'},
  rare:{c:'#7a90c8',g:'rgba(122,144,200,0.35)',p:30,l:'RARE'},
  legendary:{c:'#c8a878',g:'rgba(200,168,120,0.4)',p:60,l:'LEGENDARY'},
};

// Level definitions
const LVLS=[
  {n:1,en:2,sp:.35,al:160,lt:18,ti:300,lb:'LEVEL 1 · FIRST RUN 初来乍到'},
  {n:2,en:3,sp:.5,al:170,lt:16,ti:270,lb:'LEVEL 2 · WARMING UP 渐入佳境'},
  {n:3,en:3,sp:.65,al:180,lt:15,ti:240,lb:'LEVEL 3 · GETTING SERIOUS 认真起来'},
  {n:4,en:4,sp:.7,al:190,lt:14,ti:210,lb:'LEVEL 4 · DANGER ZONE 危险地带'},
  {n:5,en:4,sp:.85,al:200,lt:12,ti:180,lb:'LEVEL 5 · HIGH STAKES 高风险'},
  {n:6,en:5,sp:1.0,al:210,lt:10,ti:150,lb:'LEVEL 6 · LEGEND 传说'},
];
let LV=0,cfg=LVLS[0];

let st='collecting',sc=0,px,py,ps=3.0,pr=9,prng=26;
let ens=[],loot=[],ex,ey,er=24,gti,items=0,rc={common:0,uncommon:0,rare:0,legendary:0};
let pts=[],startT,ready=true,rdTimer=0;

const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '&&st!=='collecting')rst()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
document.querySelectorAll('.tb').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.key]=true});b.addEventListener('pointerup',e=>{e.preventDefault();keys[b.dataset.key]=false});b.addEventListener('pointerleave',e=>{keys[b.dataset.key]=false})});

function rR(){const r=Math.random()*100;let c=0;for(const[k,d]of Object.entries({common:55,uncommon:25,rare:14,legendary:6})){c+=d;if(r<=c)return k}return'common'}

function spP(x,y,n,color,life){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=.3+Math.random()*2.5;pts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life||25,ml:life||25,color,size:1+Math.random()*2})}}

function spL(){loot.length=0;for(let i=0;i<cfg.lt;i++){let lx,ly,tc,a=0;do{tc=false;a++;lx=40+Math.random()*(W()-80);ly=60+Math.random()*(H()-100);if(Math.hypot(lx-px,ly-py)<110)tc=true;if(Math.hypot(lx-ex,ly-ey)<130)tc=true;for(const l of loot)if(Math.hypot(lx-l.x,ly-l.y)<28){tc=true;break}}while(tc&&a<30);loot.push({x:lx,y:ly,co:false,ra:rR(),pu:Math.random()*Math.PI*2})}}

function spE(){ens.length=0;const cr=[[W()-60,H()-60],[W()-60,60],[W()/2,H()-60],[W()-60,H()/2],[W()/3,H()-60]];for(let i=0;i<cfg.en;i++){let sx=cr[i][0],sy=cr[i][1];if(Math.hypot(sx-px,sy-py)<150){sx=W()-60;sy=60+(i*80)}ens.push({x:sx,y:sy,tx:sx,ty:sy,pt:100+Math.random()*250,px:60+Math.random()*(W()-120),py:60+Math.random()*(H()-120),al:0})}}

function stLvl(l){LV=l;cfg=LVLS[l];sc=0;items=0;rc={common:0,uncommon:0,rare:0,legendary:0};st='collecting';gti=cfg.ti;startT=Date.now();ready=true;rdTimer=1.5;px=60;py=H()/2;ex=W()-50;ey=H()-50;ens.length=0;pts.length=0;spE();spL();upH();document.getElementById('ready').style.opacity='1';document.getElementById('ready').textContent=cfg.lb;document.getElementById('lv').textContent='Lv.'+(LV+1);document.getElementById('overlay').classList.remove('show')}

function rst(){stLvl(LV)}

function nextLvl(){if(LV<5)stLvl(LV+1);else stLvl(0)}

function upH(){const m=Math.floor(gti/60),s=Math.floor(gti%60);document.getElementById('sc').textContent='✦ '+sc;document.getElementById('tm').textContent=m+':'+String(s).padStart(2,'0');const se=document.getElementById('st');if(gti<60){se.textContent='⏰ HURRY!';se.className='warn'}else if(st==='extracted'){se.textContent='EXTRACTED';se.className='ok'}else if(st==='dead'){se.textContent='KIA';se.className='dead'}else if(st==='timeout'){se.textContent='MIA';se.className='dead'}else{se.textContent='SEARCHING';se.className=''}}

function grd(){if(sc>=180)return'S';if(sc>=100)return'A';if(sc>=50)return'B';if(sc>=15)return'C';return'D'}

function gLbl(g){return({'S':'LEGENDARY EXTRACTION','A':'CLEAN EXTRACTION','B':'SAFE EXTRACTION','C':'MADE IT','D':'BARELY'})[g]||''}

function shwEnd(){const g=grd(),el=Math.floor((Date.now()-startT)/1000);document.getElementById('gr').textContent=g;document.getElementById('gr').className='gr g'+g;document.getElementById('lb').textContent=gLbl(g);document.getElementById('lvl').textContent=cfg.lb;document.getElementById('es').textContent=sc;document.getElementById('ei').textContent=items;document.getElementById('et').textContent=el+'s';document.getElementById('nx').style.display=st==='extracted'?'block':'none';document.getElementById('overlay').classList.add('show')}

function shareR(){const g=grd(),rc=rt.rare+rt.legendary,t='🚁 撤离 Lv.'+(LV+1)+'\n⭐ '+g+' · '+sc+'pts · '+items+' loot\n💎 '+rc+' rare · ⏱ '+Math.floor((Date.now()-startT)/1000)+'s\n\nCan you beat this?';if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('.btn');b.textContent='✅ COPIED!';setTimeout(()=>b.textContent='📋 COPY',2000)})}}

function die(){if(st!=='collecting')return;st='dead';spP(px,py,40,'#c87080',45);sc=0;upH();shwEnd()}

function ext(){if(st!=='collecting')return;st='extracted';spP(px,py,70,CP.extract,55);const tb=Math.floor(gti/4);sc+=tb;upH();shwEnd()}

function to(){if(st!=='collecting')return;st='timeout';sc=0;upH();shwEnd()}

function up(dt){
  if(st!=='collecting'){pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return}
  // Ready delay
  if(ready){rdTimer-=dt;if(rdTimer<=0){ready=false;document.getElementById('ready').style.opacity='0'}return}
  gti-=dt;if(gti<=0){gti=0;to();return}
  upH();
  let dx=0,dy=0;
  if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
  const sp=ps*60*dt;if(dx||dy){const l=Math.hypot(dx,dy);px+=dx/l*sp;py+=dy/l*sp}
  px=Math.max(pr,Math.min(W()-pr,px));py=Math.max(pr,Math.min(H()-pr,py));
  for(const l of loot){if(l.co)continue;if(Math.hypot(px-l.x,py-l.y)<prng){l.co=true;const r=CP[l.ra];sc+=r.p;items++;rc[l.ra]++;spP(l.x,l.y,r.p>20?12:5,r.c,22)}}
  if(Math.hypot(px-ex,py-ey)<er)ext();
  const edt=60*dt;
  for(const en of ens){
    const dp=Math.hypot(en.x-px,en.y-py);
    if(dp<cfg.al)en.al=Math.min(1,en.al+.04*edt);else en.al=Math.max(0,en.al-.01*edt);
    if(en.al>.3){en.tx+=(px-en.tx)*.05;en.ty+=(py-en.ty)*.05;const sd=cfg.sp+en.al*2.2;const tx=en.tx-en.x,ty=en.ty-en.y;const td=Math.hypot(tx,ty);if(td>1){en.x+=tx/td*sd*edt;en.y+=ty/td*sd*edt}}
    else{en.pt-=edt;if(en.pt<=0){en.px=60+Math.random()*(W()-120);en.py=60+Math.random()*(H()-120);en.pt=150+Math.random()*350}const pdx=en.px-en.x,pdy=en.py-en.y;const pd=Math.hypot(pdx,pdy);if(pd>1){en.x+=pdx/pd*cfg.sp*.3*edt;en.y+=pdy/pd*cfg.sp*.3*edt}}
    if(dp<pr+13)die()
  }
  pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0})
}

function dGrid(){X.strokeStyle=CP.grid;X.lineWidth=.5;const gs=Math.floor(W()/20);for(let x=0;x<W();x+=gs){X.beginPath();X.moveTo(x,0);X.lineTo(x,H());X.stroke()}for(let y=0;y<H();y+=gs){X.beginPath();X.moveTo(0,y);X.lineTo(W(),y);X.stroke()}}

function dEx(){const p=Math.sin(Date.now()/700)*.3+.7;
  for(let i=2;i>=0;i--){X.strokeStyle='rgba(122,200,160,'+(p*.12*(i+1))+')';X.lineWidth=i+1;X.beginPath();X.arc(ex,ey,er+8+i*5+Math.sin(Date.now()/500+i)*2,0,Math.PI*2);X.stroke()}
  const gd=X.createRadialGradient(ex,ey,0,ex,ey,er+12);gd.addColorStop(0,'rgba(122,200,160,'+(p*.18)+')');gd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=gd;X.beginPath();X.arc(ex,ey,er+12,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(122,200,160,'+(p*.85)+')';X.font=Math.floor(W()/38)+'px monospace';X.textAlign='center';X.textBaseline='middle';X.fillText('▣',ex,ey);
  X.fillStyle='rgba(140,210,175,'+(p*.65)+')';X.font=Math.floor(W()/58)+'px sans-serif';X.fillText('EXTRACT',ex,ey-er-13)}

function dLoot(){for(const l of loot){if(l.co)continue;l.pu+=.03;const gl=Math.sin(l.pu)*.3+.7,r=CP[l.ra],sz=l.ra==='legendary'?7:l.ra==='rare'?6:5;
  const gd=X.createRadialGradient(l.x,l.y,0,l.x,l.y,sz+7);gd.addColorStop(0,r.g.replace('0.3',String(gl*.3)));gd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=gd;X.beginPath();X.arc(l.x,l.y,sz+7,0,Math.PI*2);X.fill();
  X.fillStyle=r.c.replace(')','')+','+String(gl*.85)+')';X.beginPath();X.arc(l.x,l.y,sz,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,255,255,'+(gl*.5)+')';X.beginPath();X.arc(l.x-1,l.y-1,sz-3,0,Math.PI*2);X.fill()}}

function dEn(en){const a=.35+en.al*.55,r=12;
  const gd=X.createRadialGradient(en.x,en.y,0,en.x,en.y,r+7);gd.addColorStop(0,'rgba(200,130,140,'+(a*.25)+')');gd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=gd;X.beginPath();X.arc(en.x,en.y,r+7,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(200,130,140,'+a+')';X.beginPath();X.arc(en.x,en.y,r,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(220,150,160,'+(a*.45)+')';X.beginPath();X.arc(en.x,en.y,r-4,0,Math.PI*2);X.fill();
  if(en.al>.25){X.fillStyle='rgba(255,180,190,'+((en.al-.25)*.8)+')';X.font=Math.floor(W()/55)+'px monospace';X.textAlign='center';X.textBaseline='middle';X.fillText('!',en.x,en.y)}}

function dPl(){const gd=X.createRadialGradient(px,py,0,px,py,pr+10);gd.addColorStop(0,CP.playerGlow);gd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=gd;X.beginPath();X.arc(px,py,pr+10,0,Math.PI*2);X.fill();
  X.fillStyle=CP.player;X.beginPath();X.arc(px,py,pr,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(220,200,245,0.55)';X.beginPath();X.arc(px-2,py-2,pr-4,0,Math.PI*2);X.fill()}

function dPts(){for(const p of pts){X.globalAlpha=p.life/p.ml;X.fillStyle=p.color;X.beginPath();X.arc(p.x,p.y,p.size*p.life/p.ml,0,Math.PI*2);X.fill()}X.globalAlpha=1}

function dVig(){const v=X.createRadialGradient(W()/2,H()/2,W()*.28,W()/2,H()/2,W()*.78);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(12,8,20,0.55)');X.fillStyle=v;X.fillRect(0,0,W(),H())}

let lt=0;
function rn(ts){const dt=lt?Math.min((ts-lt)/1000,.1):.016;lt=ts;up(dt);
  X.clearRect(0,0,W(),H());X.fillStyle=CP.bg;X.fillRect(0,0,W(),H());dGrid();dEx();dLoot();for(const e of ens)dEn(e);if(st!=='dead')dPl();dPts();dVig();
  X.strokeStyle='rgba(55,40,75,0.35)';X.lineWidth=1;X.strokeRect(.5,.5,W()-1,H()-1);
  requestAnimationFrame(rn)}

stLvl(0);requestAnimationFrame(rn);
</script>
</body>
</html>
