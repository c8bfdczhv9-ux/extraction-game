<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>风格选择 · NIGHT TRAIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0418;color:#C0B0D0;font-family:system-ui;padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px}
h2{font-size:13px;letter-spacing:3px;color:#A090C0;font-weight:300;margin-top:6px}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px}
.card{background:#140A24;border:1px solid rgba(107,63,160,0.15);border-radius:6px;padding:6px;text-align:center;width:146px}
.card canvas{display:block;border-radius:3px;width:100%}
.label{font-size:9px;color:#9B8BB0;letter-spacing:1.5px;margin-top:4px;font-weight:200}
.desc{font-size:7px;color:#605080;margin-top:1px;line-height:1.4}
.pick{background:rgba(125,155,139,0.1);border:1px solid rgba(125,155,139,0.25);color:#B496D2;padding:6px 16px;font-size:10px;letter-spacing:2px;border-radius:4px;cursor:pointer;margin-top:5px}
.pick:active{background:rgba(125,155,139,0.22)}
.note{font-size:9px;color:#605080;margin-top:6px;text-align:center;max-width:600px;line-height:1.5}
</style></head><body>
<h2>🎨 十种渲染引擎 · 全部纯 Canvas 2D</h2>
<div class="grid" id="grid"></div>
<p class="note">同一场景（夜空+火车+人物）· 十种不同纹理引擎 · 全部零外部依赖<br>点击下方按钮记录偏好，选好后告诉我字母编号</p>
<script>
// ===== PERLIN NOISE (shared) =====
var perm=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
for(var i=0;i<256;i++)perm[256+i]=perm[i];
function pn(x,y){var X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);var u=x*x*x*(x*(x*6-15)+10),v=y*y*y*(y*(y*6-15)+10);var a=perm[perm[X]+Y],b=perm[perm[X+1]+Y],c=perm[perm[X]+Y+1],d=perm[perm[X+1]+Y+1];return((a&1?-1:1)*x*(1-x)+(a&2?-1:1)*y*(1-y))+(((b&1?-1:1)*(x-1)*(2-x)+(b&2?-1:1)*y*(1-y))-((a&1?-1:1)*x*(1-x)+(a&2?-1:1)*y*(1-y)))*u+(((c&1?-1:1)*x*(1-x)+(c&2?-1:1)*(y-1)*(2-y))-((a&1?-1:1)*x*(1-x)+(a&2?-1:1)*y*(1-y)))*v+(((a&1?-1:1)*x*(1-x)+(a&2?-1:1)*y*(1-y))+((d&1?-1:1)*(x-1)*(2-x)+(d&2?-1:1)*(y-1)*(2-y))-((b&1?-1:1)*(x-1)*(2-x)+(b&2?-1:1)*y*(1-y))-((c&1?-1:1)*x*(1-x)+(c&2?-1:1)*(y-1)*(2-y)))*u*v;}
function pk(a){return a[Math.floor(Math.random()*a.length)]}
// Colors
var PURP=['#0A0418','#120820','#1E0C32','#2A1048','#180C28'];
var GREEN=['#1A3A28','#244A34','#183020','#225036','#1E3E2A','#2A5A3E'];
var DKGREEN=['#0E1E14','#122418','#0C1A10'];
var WHITE=['#F5F0F8','#E8E0F0','#EAE2F0'];
var GOLD=['#D4B830','#C8A828','#D8BC38'];

// ===== SCENE LAYOUT CONSTANTS =====
var W=140,H=110;
var tx=8,ty=H*0.26,tw=W-16,th=H*0.46; // train rect
var fx=W/2,fy=ty+th*0.72; // figure center

// ===== D: 蜡笔叠色 CRAYON OVERLAY =====
function drawD(cx){
  cx.fillStyle='#0A0418';cx.fillRect(0,0,W,H);
  // 3 heavy opaque color passes
  var passes=[[PURP,0.35,3,4],[['#1A1030','#2A1848'],0.3,5,3],[['#2A1048','#3A1850'],0.25,7,2]];
  for(var p=0;p<passes.length;p++){
    var cols=passes[p][0],alpha=passes[p][1],step=passes[p][2],w=passes[p][3];
    for(var y=0;y<H*0.72;y+=step){
      for(var x=0;x<W;x+=step*2){
        if(Math.random()>0.4)continue;
        cx.fillStyle=pk(cols);cx.globalAlpha=alpha;
        cx.fillRect(x,y,w+Math.random()*3,step*0.7);
      }
    }
  }cx.globalAlpha=1;
  // Train — thick green strokes
  for(var p=0;p<2;p++){for(var i=0;i<200;i++){cx.fillStyle=pk(GREEN);cx.globalAlpha=0.45;cx.fillRect(tx+Math.random()*tw,ty+Math.random()*th,2+Math.random()*5,2+Math.random()*4)}}cx.globalAlpha=1;
  cx.strokeStyle=GOLD[0];cx.globalAlpha=0.5;cx.lineWidth=1;
  cx.beginPath();cx.moveTo(tx+3,ty+th*0.5);cx.lineTo(tx+tw-3,ty+th*0.5);cx.stroke();cx.globalAlpha=1;
  // Ground
  for(var i=0;i<100;i++){cx.fillStyle='#180828';cx.globalAlpha=0.3;cx.fillRect(Math.random()*W,H*0.72+Math.random()*H*0.28,2+Math.random()*4,1+Math.random()*2)}cx.globalAlpha=1;
  // Figure — white crayon
  for(var i=0;i<80;i++){var a=Math.random()*6.28,d=Math.random()*8;cx.fillStyle='#F5F0F8';cx.globalAlpha=0.5;cx.fillRect(fx+Math.cos(a)*d,fy-12+Math.sin(a)*d*0.6,1.5+Math.random()*2.5,1.5+Math.random()*2.5)}cx.globalAlpha=1;
  // Heart
  for(var i=0;i<20;i++){cx.fillStyle='#6B3FA0';cx.globalAlpha=0.55;cx.fillRect(fx+8+Math.random()*6-3,fy-32+Math.random()*5-2,1+Math.random()*2,1+Math.random()*2)}cx.globalAlpha=1;
}

// ===== E: 碳笔擦痕 CHARCOAL RUB =====
function drawE(cx){
  cx.fillStyle='#F5F0F8';cx.fillRect(0,0,W,H); // white paper base
  // Dark charcoal strokes
  for(var i=0;i<600;i++){cx.fillStyle='rgba(20,10,40,'+(0.1+Math.random()*0.4)+')';cx.fillRect(Math.random()*W,Math.random()*H,0.5+Math.random()*4,0.3+Math.random()*2)}
  // Eraser highlights — white subtractive marks
  for(var i=0;i<150;i++){cx.fillStyle='rgba(245,240,248,'+(0.3+Math.random()*0.5)+')';cx.fillRect(Math.random()*W,Math.random()*H,1+Math.random()*6,1+Math.random()*4)}
  // Train — dark dense block with eraser windows
  for(var i=0;i<300;i++){cx.fillStyle='rgba(10,5,25,'+(0.3+Math.random()*0.5)+')';cx.fillRect(tx+Math.random()*tw,ty+Math.random()*th,1+Math.random()*3,0.5+Math.random()*2)}
  // Windows — eraser
  for(var wi=0;wi<3;wi++){var wx=tx+tw*0.12+wi*tw*0.3;cx.fillStyle='rgba(245,240,248,0.6)';cx.fillRect(wx,ty+th*0.2,tw*0.12,th*0.25)}
  cx.strokeStyle=GOLD[0];cx.globalAlpha=0.4;cx.lineWidth=0.8;
  cx.beginPath();cx.moveTo(tx+3,ty+th*0.5);cx.lineTo(tx+tw-3,ty+th*0.5);cx.stroke();cx.globalAlpha=1;
  // Figure — smeared charcoal
  for(var i=0;i<60;i++){cx.fillStyle='rgba(15,5,30,0.5)';cx.fillRect(fx-6+Math.random()*12,fy-16+Math.random()*12,1+Math.random()*2,1+Math.random()*2)}}

// ===== F: 水彩晕染 WATERCOLOR WASH =====
function drawF(cx){
  cx.fillStyle='#F5F0E8';cx.fillRect(0,0,W,H); // warm paper
  // Large translucent overlapping circles
  var washes=[{x:W*0.3,y:H*0.2,r:40,c:'rgba(40,15,70,0.12)'},{x:W*0.7,y:H*0.15,r:35,c:'rgba(30,20,60,0.1)'},{x:W*0.5,y:H*0.25,r:50,c:'rgba(20,10,50,0.08)'},{x:W*0.3,y:H*0.45,r:45,c:'rgba(20,40,30,0.1)'},{x:W*0.7,y:H*0.5,r:40,c:'rgba(15,35,25,0.09)'},{x:W*0.5,y:H*0.6,r:55,c:'rgba(10,25,20,0.08)'},{x:W*0.4,y:H*0.8,r:30,c:'rgba(15,10,25,0.07)'}];
  for(var w=0;w<washes.length;w++){var wa=washes[w];cx.fillStyle=wa.c;cx.beginPath();cx.arc(wa.x,wa.y,wa.r,0,6.28);cx.fill()}
  // Dark ink accents — train outline
  cx.strokeStyle='rgba(10,5,20,0.3)';cx.lineWidth=0.5;
  cx.strokeRect(tx+1,ty+1,tw-2,th-2);
  // Windows
  for(var wi=0;wi<3;wi++){var wx=tx+tw*0.1+wi*tw*0.3;cx.fillStyle='rgba(30,40,50,0.25)';cx.fillRect(wx,ty+th*0.2,tw*0.13,th*0.22)}
  // Figure — dark ink silhouette
  cx.fillStyle='rgba(15,5,25,0.25)';cx.beginPath();cx.ellipse(fx,fy-6,5,8,0,0,6.28);cx.fill();
  cx.fillStyle='rgba(60,25,80,0.2)';cx.beginPath();cx.arc(fx+6,fy-22,3.5,0,6.28);cx.fill();
  // Ground
  cx.fillStyle='rgba(20,10,30,0.06)';cx.fillRect(0,H*0.72,W,H*0.28);
}

// ===== G: 铜版蚀刻 ETCHING =====
function drawG(cx){
  cx.fillStyle='#F5F0E8';cx.fillRect(0,0,W,H); // cream copper plate
  // Dense parallel hatch lines — sky
  for(var a=0;a<3;a++){var angle=(a*0.6+0.3);cx.strokeStyle='rgba(20,10,40,'+(0.06+a*0.04)+')';cx.lineWidth=0.3;
    for(var i=-H;i<W+H;i+=1.2){cx.beginPath();cx.moveTo(i,0);cx.lineTo(i-H*Math.tan(angle),H*0.72);cx.stroke()}}
  // Train — cross-hatch
  cx.lineWidth=0.4;
  for(var a=0;a<2;a++){var angle2=(a*0.8+0.2);cx.strokeStyle='rgba(10,25,15,'+(0.1+a*0.08)+')';
    for(var i=0;i<tw+th;i+=1.0){cx.beginPath();cx.moveTo(tx+i,ty);cx.lineTo(tx+i-th*Math.tan(angle2),ty+th);cx.stroke()}}
  // Coachline
  cx.strokeStyle='rgba(180,150,50,0.3)';cx.lineWidth=0.6;
  cx.beginPath();cx.moveTo(tx+3,ty+th*0.5);cx.lineTo(tx+tw-3,ty+th*0.5);cx.stroke();
  // Ground — horizontal lines
  cx.strokeStyle='rgba(20,10,30,0.08)';
  for(var y=H*0.72;y<H;y+=1.5){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
  // Figure — dense hatch silhouette
  cx.strokeStyle='rgba(15,5,25,0.15)';cx.lineWidth=0.3;
  for(var i=-10;i<10;i+=0.8){cx.beginPath();cx.moveTo(fx+i,fy-16);cx.lineTo(fx+i+3,fy+2);cx.stroke()}
}

// ===== H: 模板喷漆 STENCIL SPRAY =====
function drawH(cx){
  cx.fillStyle='#0A0418';cx.fillRect(0,0,W,H);
  // Radial spray from cluster centers
  var centers=[];for(var ci=0;ci<8;ci++)centers.push({x:Math.random()*W,y:Math.random()*H*0.72});
  for(var ci=0;ci<centers.length;ci++){var c=centers[ci];
    for(var si=0;si<120;si++){var a=Math.random()*6.28,d=Math.pow(Math.random(),0.5)*30;var sx=c.x+Math.cos(a)*d,sy=c.y+Math.sin(a)*d;if(sy<0||sy>H*0.75)continue;
      cx.fillStyle=pk(PURP);cx.globalAlpha=0.12+Math.random()*0.3;cx.beginPath();cx.arc(sx,sy,0.3+Math.random()*1.5,0,6.28);cx.fill()}}cx.globalAlpha=1;
  // Stars — crisp dots
  for(var i=0;i<40;i++){cx.fillStyle='#F5F0F8';cx.globalAlpha=0.5+Math.random()*0.5;cx.beginPath();cx.arc(Math.random()*W,Math.random()*H*0.5,0.3+Math.random()*0.8,0,6.28);cx.fill()}cx.globalAlpha=1;
  // Train — spray block
  for(var i=0;i<400;i++){var sx2=tx+Math.random()*tw,sy=ty+Math.random()*th;
    var dist=1;if(sx2<tx+4)dist=(sx2-tx)/4;if(sx2>tx+tw-4)dist=(tx+tw-sx2)/4;
    cx.fillStyle=pk(GREEN);cx.globalAlpha=(0.15+Math.random()*0.3)*Math.max(0.2,dist);
    cx.beginPath();cx.arc(sx2,sy,0.3+Math.random()*2,0,6.28);cx.fill()}cx.globalAlpha=1;
  // Crisp golden coachline
  cx.strokeStyle=GOLD[0];cx.globalAlpha=0.6;cx.lineWidth=1;
  cx.beginPath();cx.moveTo(tx+3,ty+th*0.5);cx.lineTo(tx+tw-3,ty+th*0.5);cx.stroke();cx.globalAlpha=1;
  // Ground spray
  for(var i=0;i<200;i++){cx.fillStyle='#180828';cx.globalAlpha=0.15;cx.beginPath();cx.arc(Math.random()*W,H*0.72+Math.random()*H*0.28,0.3+Math.random()*1,0,6.28);cx.fill()}cx.globalAlpha=1;
  // Figure — spray silhouette
  for(var ci=0;ci<3;ci++){var cx2=fx-4+Math.random()*8,cy=fy-14+Math.random()*6;for(var si=0;si<40;si++){var a=Math.random()*6.28,d=Math.pow(Math.random(),0.5)*8;cx.fillStyle='#F5F0F8';cx.globalAlpha=0.35;cx.beginPath();cx.arc(cx2+Math.cos(a)*d,cy+Math.sin(a)*d*0.5,0.3+Math.random()*1,0,6.28);cx.fill()}}cx.globalAlpha=1;
  // Heart
  for(var i=0;i<30;i++){var a=Math.random()*6.28,d=Math.random()*5;cx.fillStyle='#6B3FA0';cx.globalAlpha=0.45;cx.beginPath();cx.arc(fx+8+Math.cos(a)*d,fy-22+Math.sin(a)*d*0.6,0.3+Math.random()*1,0,6.28);cx.fill()}cx.globalAlpha=1;
}

// ===== I: 像素噪波 PIXEL NOISE =====
function drawI(cx){
  var img=cx.createImageData(W,H),d=img.data;
  for(var y=0;y<H;y++){
    for(var x=0;x<W;x++){
      var i=(y*W+x)*4;
      // Sky region
      if(y<H*0.72){
        var t=y/(H*0.72),r=8+Math.random()*20,g=2+Math.random()*10,b=18+Math.random()*35;
        // Train region
        if(x>tx&&x<tx+tw&&y>ty&&y<ty+th){r=10+Math.random()*30;g=25+Math.random()*45;b=15+Math.random()*28}
        // Figure region
        var dx2=x-fx,dy=y-fy+6;if(Math.sqrt(dx2*dx2+dy*dy*2)<8){r=220+Math.random()*35;g=215+Math.random()*40;b=230+Math.random()*25}
        d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;
      }else{var r2=15+Math.random()*25;d[i]=r2;d[i+1]=5+Math.random()*10;d[i+2]=20+Math.random()*30;d[i+3]=255}
    }
  }cx.putImageData(img,0,0);
  // Coachline
  cx.strokeStyle=GOLD[0];cx.globalAlpha=0.5;cx.lineWidth=1;
  cx.beginPath();cx.moveTo(tx+3,ty+th*0.5);cx.lineTo(tx+tw-3,ty+th*0.5);cx.stroke();cx.globalAlpha=1;
  // Heart
  for(var i=0;i<20;i++){cx.fillStyle='#6B3FA0';cx.globalAlpha=0.5;cx.beginPath();cx.arc(fx+8+Math.random()*5-2.5,fy-22+Math.random()*4-2,0.5+Math.random()*1,0,6.28);cx.fill()}cx.globalAlpha=1;
}

// ===== J: 刮刀厚涂 PALETTE KNIFE =====
function drawJ(cx){
  cx.fillStyle='#0A0418';cx.fillRect(0,0,W,H);
  // Thick directional rectangular strokes
  for(var p=0;p<3;p++){var step=3+p*3;for(var y=0;y<H*0.72;y+=step){
    for(var x=0;x<W;x+=step*1.5){
      if(Math.random()>0.45)continue;var nv=pn(x*0.05+p,y*0.04)*0.5+0.5;
      cx.fillStyle=pk(p===0?PURP:(p===1?['#1A1030','#2A1848']:['#2A1048','#301850']));
      cx.globalAlpha=0.25+p*0.15;
      cx.fillRect(x+nv*6,y,3+Math.random()*(5+p*2),step*0.7+Math.random()*2);
    }
  }}cx.globalAlpha=1;
  // Train — thick green knife strokes
  for(var p=0;p<2;p++){var step=3+p*2;for(var x=tx;x<tx+tw;x+=step){
    if(Math.random()>0.5)continue;cx.fillStyle=pk(GREEN);cx.globalAlpha=0.4;
    cx.fillRect(x+pn(x*0.06,0)*4,ty+Math.random()*th*0.1,1.5+Math.random()*3.5,th*0.6+Math.random()*th*0.3);
  }}cx.globalAlpha=1;
  cx.strokeStyle=GOLD[0];cx.globalAlpha=0.5;cx.lineWidth=1.2;
  cx.beginPath();cx.moveTo(tx+3,ty+th*0.5);cx.lineTo(tx+tw-3,ty+th*0.5);cx.stroke();cx.globalAlpha=1;
  // Figure
  for(var i=0;i<60;i++){cx.fillStyle='#F5F0F8';cx.globalAlpha=0.5;cx.fillRect(fx-6+Math.random()*12,fy-14+Math.random()*10,1+Math.random()*3,2+Math.random()*4)}cx.globalAlpha=1;
  // Heart
  for(var i=0;i<20;i++){cx.fillStyle='#6B3FA0';cx.globalAlpha=0.5;cx.fillRect(fx+7+Math.random()*5,fy-24+Math.random()*4,1+Math.random()*2,1+Math.random()*2)}cx.globalAlpha=1;
}

// ===== K: 枯笔飞白 DRY BRUSH =====
function drawK(cx){
  cx.fillStyle='#F5F0E8';cx.fillRect(0,0,W,H); // raw paper
  // Sparse broken strokes that thin and fade
  for(var p=0;p<2;p++){var n=p===0?200:100;
    for(var i=0;i<n;i++){
      var sx=Math.random()*W,sy=Math.random()*H*0.72,len=5+Math.random()*20;
      var nv=pn(sx*0.04+p*3,sy*0.04)*0.5+0.5;
      if(Math.random()>nv*0.6)continue;
      cx.strokeStyle=p===0?'rgba(20,10,40,'+(0.1+Math.random()*0.3)+')':'rgba(30,15,50,'+(0.08+Math.random()*0.2)+')';
      cx.lineWidth=0.3+Math.random()*1.5;
      cx.beginPath();cx.moveTo(sx,sy);
      for(var j=1;j<8;j++){var t=j/7,alpha2=1-t*t;if(alpha2<0.1)break;cx.lineTo(sx+Math.cos(nv*6)*len*t+Math.sin(j*2)*2,sy+Math.sin(nv*5)*len*t*0.5+Math.cos(j)*1.5)}
      cx.stroke();
    }
  }
  // Train — dry brush strokes
  for(var i=0;i<150;i++){
    cx.strokeStyle='rgba(15,35,25,'+(0.1+Math.random()*0.25)+')';cx.lineWidth=0.5+Math.random()*2;
    cx.beginPath();cx.moveTo(tx+Math.random()*tw,ty+Math.random()*th);
    cx.lineTo(tx+Math.random()*tw,ty+Math.random()*th);cx.stroke();
  }
  cx.strokeStyle=GOLD[0];cx.globalAlpha=0.35;cx.lineWidth=0.8;
  cx.beginPath();cx.moveTo(tx+3,ty+th*0.5);cx.lineTo(tx+tw-3,ty+th*0.5);cx.stroke();cx.globalAlpha=1;
  // Figure
  for(var i=0;i<40;i++){cx.fillStyle='rgba(10,5,20,'+(0.2+Math.random()*0.3)+')';cx.fillRect(fx-5+Math.random()*10,fy-14+Math.random()*10,0.5+Math.random()*1,0.5+Math.random()*1.5)}}

// ===== L: 丝网漏印 SCREEN PRINT =====
function drawL(cx){
  cx.fillStyle='#F5F0E8';cx.fillRect(0,0,W,H);
  // Flat color blocks with deliberate misregistration offset
  var off=2; // registration offset
  // Layer 1: purple (shifted right)
  cx.fillStyle='rgba(40,15,65,0.15)';cx.fillRect(off,0,W,20);
  cx.fillStyle='rgba(50,25,75,0.12)';cx.fillRect(off,15,W,25);
  // Layer 2: dark sky (shifted left)
  cx.fillStyle='rgba(8,3,20,0.2)';cx.fillRect(-off,0,W,H*0.72);
  // Layer 3: green train (shifted down)
  cx.fillStyle='rgba(20,50,35,0.2)';cx.fillRect(tx-off,ty+off,tw,th);
  // Layer 4: window blocks (shifted up)
  for(var wi=0;wi<3;wi++){var wx=tx+tw*0.1+wi*tw*0.3;cx.fillStyle='rgba(30,40,50,0.3)';cx.fillRect(wx-off,ty+th*0.2-off,tw*0.13,th*0.22)}
  // Layer 5: gold coachline (precise)
  cx.strokeStyle=GOLD[0];cx.globalAlpha=0.5;cx.lineWidth=1.2;
  cx.beginPath();cx.moveTo(tx+3,ty+th*0.5);cx.lineTo(tx+tw-3,ty+th*0.5);cx.stroke();cx.globalAlpha=1;
  // Layer 6: ground
  cx.fillStyle='rgba(15,8,25,0.15)';cx.fillRect(0,H*0.72,W,H*0.28);
  // Figure — flat silhouette blocks
  cx.fillStyle='rgba(15,5,25,0.3)';cx.fillRect(fx-5,fy-14,10,14);
  cx.fillStyle='rgba(10,3,20,0.25)';cx.beginPath();cx.arc(fx,fy-8,5.5,0,6.28);cx.fill();
  cx.fillStyle='rgba(60,25,80,0.25)';cx.fillRect(fx+5,fy-24,5,5);
}

// ===== M: 网格点彩 GRID STIPPLE =====
function drawM(cx){
  cx.fillStyle='#0A0418';cx.fillRect(0,0,W,H);
  // Regular grid with large dots, color varies by noise
  var grid=3; // grid spacing
  for(var y=0;y<H;y+=grid){
    for(var x=0;x<W;x+=grid){
      var nv=pn(x*0.03,y*0.03)*0.5+0.5;
      if(nv<0.2)continue;
      var col,r=0.6+nv*2.5;
      if(y<H*0.72){
        if(x>tx&&x<tx+tw&&y>ty&&y<ty+th){col=pk(GREEN)}
        else if(Math.abs(x-fx)<8&&Math.abs(y-(fy-6))<10){col='#F5F0F8'}
        else{col=pk(PURP)}
      }else{col='#180828';r=0.4+nv*1.2}
      cx.fillStyle=col;cx.globalAlpha=0.3+nv*0.5;
      cx.beginPath();cx.arc(x,y,r,0,6.28);cx.fill();
    }
  }cx.globalAlpha=1;
  // Coachline
  cx.strokeStyle=GOLD[0];cx.globalAlpha=0.5;cx.lineWidth=1;
  cx.beginPath();cx.moveTo(tx+3,ty+th*0.5);cx.lineTo(tx+tw-3,ty+th*0.5);cx.stroke();cx.globalAlpha=1;
  // Heart
  for(var i=0;i<25;i++){cx.fillStyle='#6B3FA0';cx.globalAlpha=0.5;cx.beginPath();cx.arc(fx+7+Math.random()*5-2.5,fy-22+Math.random()*4-2,1+Math.random()*1.5,0,6.28);cx.fill()}cx.globalAlpha=1;
}

// ===== BUILD GALLERY =====
var styles=[
  {id:'D',name:'蜡笔叠色',desc:'多色层叠 · 厚重蜡质',fn:drawD},
  {id:'E',name:'碳笔擦痕',desc:'深色涂抹 · 橡皮减法',fn:drawE},
  {id:'F',name:'水彩晕染',desc:'半透明大圆 · 湿叠',fn:drawF},
  {id:'G',name:'铜版蚀刻',desc:'平行密线 · 交叉排线',fn:drawG},
  {id:'H',name:'模板喷漆',desc:'辐射飞溅 · 边缘过喷',fn:drawH},
  {id:'I',name:'像素噪波',desc:'逐像素噪声 · TV雪花',fn:drawI},
  {id:'J',name:'刮刀厚涂',desc:'厚矩形笔触 · 方向性',fn:drawJ},
  {id:'K',name:'枯笔飞白',desc:'稀疏断续 · 笔锋渐隐',fn:drawK},
  {id:'L',name:'丝网漏印',desc:'平色块 · 错版偏移',fn:drawL},
  {id:'M',name:'网格点彩',desc:'规则网格 · 大点变异',fn:drawM}
];

var grid=document.getElementById('grid');
for(var si=0;si<styles.length;si++){
  var s=styles[si];
  var card=document.createElement('div');card.className='card';
  var c=document.createElement('canvas');c.width=W;c.height=H;
  s.fn(c.getContext('2d'));
  card.innerHTML='<div class="label">'+s.id+' · '+s.name+'</div><div class="desc">'+s.desc+'</div>';
  card.insertBefore(c,card.firstChild);
  var btn=document.createElement('button');btn.className='pick';btn.textContent='选 '+s.id;
  btn.onclick=(function(st){return function(){alert('✓ 已选: '+st.id+' · '+st.name+'\n\n告诉 Agent: \"选 '+st.id+'\" 即可')}})(s);
  card.appendChild(btn);
  grid.appendChild(card);
}
</script>
