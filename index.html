<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>撤离 · Extraction</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0c0a14;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;position:fixed}
#w{position:relative;width:100vw;height:100vh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;background:#120e1c;border-radius:8px;max-width:100vw;max-height:70vh;box-shadow:0 0 80px rgba(90,180,120,0.1),0 0 40px rgba(120,60,200,0.12)}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10}
.hu{border-radius:6px;padding:4px 10px;font-size:11px;letter-spacing:1px;background:rgba(18,14,28,0.9);border:1px solid rgba(100,160,130,0.2)}
#sc{color:#a0d8b8}#tm{color:#c8a878}#st{color:#709880;font-size:10px}
#st.warn{color:#c8a878;animation:pulse .8s infinite}#st.ok{color:#80d0a0}#st.dead{color:#c87080}
#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(160,216,184,0.4);font-size:11px;letter-spacing:2px;pointer-events:none;z-index:5;transition:opacity 1s}
#overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(10,6,18,0.95);border-radius:8px}
#overlay.show{display:flex}
#lvl{font-size:12px;color:#709880;letter-spacing:3px;margin-bottom:6px}
.gr{font-size:60px;font-weight:900;letter-spacing:4px;margin-bottom:2px}
.gS{color:#c8a878;text-shadow:0 0 40px rgba(200,168,120,0.5)}
.gA{color:#80d0a0;text-shadow:0 0 30px rgba(128,208,160,0.4)}
.gB{color:#80a0c8;text-shadow:0 0 25px rgba(128,160,200,0.4)}
.gC{color:#a0a0b8}
.gD{color:#c87080}
.lb{font-size:12px;color:#709880;letter-spacing:2px;margin-bottom:12px}
.sts{display:flex;gap:18px;margin-bottom:16px}
.stv{font-size:20px;font-weight:700;color:#a0d8b8;text-align:center}
.stl{font-size:9px;color:#588070;letter-spacing:1px;margin-top:2px}
.btn{background:rgba(80,160,120,0.15);border:1px solid rgba(100,180,140,0.35);color:#a0d8b8;padding:10px 20px;border-radius:8px;font-size:12px;letter-spacing:1px;margin:4px;pointer-events:auto;cursor:pointer}
.btn:active{background:rgba(100,180,140,0.3)}
.btn2{color:#588070;font-size:11px;letter-spacing:1px;pointer-events:auto;cursor:pointer;margin-top:3px}
#ready{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#a0d8b8;font-size:16px;letter-spacing:3px;pointer-events:none;z-index:5;transition:opacity .8s;text-align:center;line-height:1.8}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div id="w">
<canvas id="g"></canvas>
<div id="hud"><span class="hu" id="sc">✦ 0</span><span class="hu" id="lv">Lv.1</span><span class="hu" id="tm">5:00</span><span id="st">READY</span></div>
<div id="hint">按住拖动移动 · HOLD & DRAG TO MOVE</div>
<div id="ready"></div>
<div id="overlay">
<div id="lvl"></div><div class="gr" id="gr">S</div><div class="lb" id="lb"></div>
<div class="sts"><div><div class="stv" id="es">0</div><div class="stl">SCORE</div></div><div><div class="stv" id="ei">0</div><div class="stl">LOOT</div></div><div><div class="stv" id="et">0s</div><div class="stl">TIME</div></div></div>
<button class="btn" onclick="sh()">📋 COPY</button>
<div class="btn2" onclick="nx()" id="nx">▶ NEXT</div>
<div class="btn2" onclick="rst()">↻ RETRY</div>
</div>
</div>

<script>
const C=document.getElementById('g'),X=C.getContext('2d');
function rs(){const mw=Math.min(window.innerWidth-12,500),mh=Math.min(window.innerHeight*.65,700),r=4/3;let w,h;if(mw/mh>r){h=mh;w=h*r}else{w=mw;h=w/r}C.width=w;C.height=h}
rs();window.addEventListener('resize',rs);
const W=()=>C.width,H=()=>C.height;

// Palette: Purple + Green artistic
const P={
  bg:'#120e1c',grid:'rgba(60,40,80,0.35)',
  player:'#a0d8b8',playerGlow:'rgba(130,210,160,0.3)',
  enemy:'#c88090',enemyGlow:'rgba(200,128,144,0.25)',
  extract:'#60c890',extractGlow:'rgba(96,200,144,0.2)',
  common:{c:'#8898a0',g:'rgba(136,152,160,0.3)',p:5,l:'COMMON'},
  uncommon:{c:'#80c898',g:'rgba(128,200,152,0.3)',p:15,l:'UNCOMMON'},
  rare:{c:'#8098c8',g:'rgba(128,152,200,0.35)',p:30,l:'RARE'},
  legendary:{c:'#d0c080',g:'rgba(208,192,128,0.4)',p:60,l:'LEGENDARY'},
};

const LVLS=[
  {n:1,en:2,sp:.5,al:150,lt:16,ti:300,lb:'LEVEL 1 — FIRST RUN'},
  {n:2,en:2,sp:.65,al:160,lt:15,ti:270,lb:'LEVEL 2 — WARMING UP'},
  {n:3,en:3,sp:.75,al:170,lt:14,ti:240,lb:'LEVEL 3 — GETTING SERIOUS'},
  {n:4,en:3,sp:.85,al:180,lt:12,ti:210,lb:'LEVEL 4 — DANGER ZONE'},
  {n:5,en:4,sp:.95,al:190,lt:10,ti:180,lb:'LEVEL 5 — HIGH STAKES'},
  {n:6,en:5,sp:1.1,al:200,lt:8,ti:150,lb:'LEVEL 6 — LEGEND'},
];
let LV=0,cfg=LVLS[0];

let st='collecting',sc=0,px,py,ps=3.8,pr=10,prng=28;
let ens=[],loot=[],ex,ey,er=26,gti,items=0,rc={common:0,uncommon:0,rare:0,legendary:0};
let pts=[],startT,ready=true,rdTimer=2.0;
let dragOn=false,dragX=0,dragY=0,dragOX=0,dragOY=0;

// Keyboard
const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '&&st!=='collecting')rst()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

// Drag-to-move
C.addEventListener('pointerdown',e=>{e.preventDefault();dragOn=true;dragX=e.clientX;dragY=e.clientY;dragOX=px;dragOY=py});
C.addEventListener('pointermove',e=>{e.preventDefault();if(!dragOn)return;const dx=e.clientX-dragX,dy=e.clientY-dragY;px=Math.max(pr,Math.min(W()-pr,dragOX+dx*1.5));py=Math.max(pr,Math.min(H()-pr,dragOY+dy*1.5))});
C.addEventListener('pointerup',e=>{dragOn=false});
C.addEventListener('pointerleave',e=>{dragOn=false});

function rR(){const r=Math.random()*100;let c=0;for(const[k,d]of Object.entries({common:55,uncommon:25,rare:14,legendary:6})){c+=d;if(r<=c)return k}return'common'}

function spP(x,y,n,color,life){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=.4+Math.random()*2.8;pts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life||28,ml:life||28,color,size:1+Math.random()*2.5})}}

function spL(){loot.length=0;for(let i=0;i<cfg.lt;i++){let lx,ly,tc,a=0;do{tc=false;a++;lx=40+Math.random()*(W()-80);ly=60+Math.random()*(H()-100);if(Math.hypot(lx-px,ly-py)<110)tc=true;if(Math.hypot(lx-ex,ly-ey)<130)tc=true;for(const l of loot)if(Math.hypot(lx-l.x,ly-l.y)<28){tc=true;break}}while(tc&&a<30);loot.push({x:lx,y:ly,co:false,ra:rR(),pu:Math.random()*Math.PI*2})}}

function spE(){ens.length=0;const cr=[[W()-60,H()-60],[W()-60,60],[W()/2,H()-60],[W()-60,H()/2],[W()/3,H()-60]];for(let i=0;i<cfg.en;i++){let sx=cr[i][0],sy=cr[i][1];if(Math.hypot(sx-px,sy-py)<160){sx=W()-60;sy=60+(i*90)}ens.push({x:sx,y:sy,tx:sx,ty:sy,pt:120+Math.random()*280,px:60+Math.random()*(W()-120),py:60+Math.random()*(H()-120),al:0})}}

function stLvl(l){LV=l;cfg=LVLS[l];sc=0;items=0;rc={common:0,uncommon:0,rare:0,legendary:0};st='collecting';gti=cfg.ti;startT=Date.now();ready=true;rdTimer=2.0;px=60;py=H()/2;ex=W()-50;ey=H()-50;ens.length=0;pts.length=0;spE();spL();upH();document.getElementById('ready').style.opacity='1';document.getElementById('ready').innerHTML='LEVEL '+(LV+1)+'<br><span style=font-size:11px;color:#588070>按住拖动移动</span>';document.getElementById('lv').textContent='Lv.'+(LV+1);document.getElementById('hint').style.opacity='1';document.getElementById('overlay').classList.remove('show')}

function rst(){stLvl(LV)}
function nx(){if(LV<5)stLvl(LV+1);else stLvl(0)}

function upH(){const m=Math.floor(gti/60),s=Math.floor(gti%60);document.getElementById('sc').textContent='✦ '+sc;document.getElementById('tm').textContent=m+':'+String(s).padStart(2,'0');const se=document.getElementById('st');if(gti<60){se.textContent='⏰ HURRY!';se.className='warn'}else if(st==='extracted'){se.textContent='EXTRACTED';se.className='ok'}else if(st==='dead'){se.textContent='KIA';se.className='dead'}else if(st==='timeout'){se.textContent='MIA';se.className='dead'}else{se.textContent='SEARCHING';se.className=''}}

function grd(){if(sc>=180)return'S';if(sc>=100)return'A';if(sc>=50)return'B';if(sc>=15)return'C';return'D'}
function gLbl(g){return({'S':'LEGENDARY','A':'CLEAN RUN','B':'SAFE','C':'MADE IT','D':'BARELY'})[g]||''}

function shwEnd(){const g=grd(),el=Math.floor((Date.now()-startT)/1000);document.getElementById('gr').textContent=g;document.getElementById('gr').className='gr g'+g;document.getElementById('lb').textContent=gLbl(g);document.getElementById('lvl').textContent=cfg.lb;document.getElementById('es').textContent=sc;document.getElementById('ei').textContent=items;document.getElementById('et').textContent=el+'s';document.getElementById('nx').style.display=st==='extracted'?'block':'none';document.getElementById('overlay').classList.add('show')}

function sh(){const g=grd(),rc=rt.rare+rt.legendary,t='🚁 撤离 Lv.'+(LV+1)+'\n⭐ '+g+' · '+sc+'pts\n💎 '+rc+' rare · ⏱ '+Math.floor((Date.now()-startT)/1000)+'s';if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('.btn');b.textContent='✅ COPIED!';setTimeout(()=>b.textContent='📋 COPY',2000)})}}

function die(){if(st!=='collecting')return;st='dead';spP(px,py,35,'#c87080',45);sc=0;upH();shwEnd()}
function ext(){if(st!=='collecting')return;st='extracted';spP(px,py,60,P.extract,55);const tb=Math.floor(gti/3);sc+=tb;upH();shwEnd()}
function to(){if(st!=='collecting')return;st='timeout';sc=0;upH();shwEnd()}

function up(dt){
  if(st!=='collecting'){pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return}
  if(ready){rdTimer-=dt;if(rdTimer<=0){ready=false;document.getElementById('ready').style.opacity='0';document.getElementById('hint').style.opacity='0'}return}
  gti-=dt;if(gti<=0){gti=0;to();return}
  upH();

  // Keyboard movement
  if(!dragOn){let dx=0,dy=0;if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;if(dx||dy){const l=Math.hypot(dx,dy);px+=dx/l*ps*60*dt;py+=dy/l*ps*60*dt}}
  px=Math.max(pr,Math.min(W()-pr,px));py=Math.max(pr,Math.min(H()-pr,py));

  for(const l of loot){if(l.co)continue;if(Math.hypot(px-l.x,py-l.y)<prng){l.co=true;const r=P[l.ra];sc+=r.p;items++;rc[l.ra]++;spP(l.x,l.y,r.p>20?12:5,r.c,22)}}
  if(Math.hypot(px-ex,py-ey)<er)ext();

  const edt=60*dt;
  for(const en of ens){
    const dp=Math.hypot(en.x-px,en.y-py);
    if(dp<cfg.al)en.al=Math.min(1,en.al+.04*edt);else en.al=Math.max(0,en.al-.01*edt);
    if(en.al>.3){en.tx+=(px-en.tx)*.04;en.ty+=(py-en.ty)*.04;const sd=cfg.sp+en.al*2.0;const tx=en.tx-en.x,ty=en.ty-en.y;const td=Math.hypot(tx,ty);if(td>1){en.x+=tx/td*sd*edt;en.y+=ty/td*sd*edt}}
    else{en.pt-=edt;if(en.pt<=0){en.px=60+Math.random()*(W()-120);en.py=60+Math.random()*(H()-120);en.pt=180+Math.random()*350}const pdx=en.px-en.x,pdy=en.py-en.y;const pd=Math.hypot(pdx,pdy);if(pd>1){en.x+=pdx/pd*cfg.sp*.25*edt;en.y+=pdy/pd*cfg.sp*.25*edt}}
    if(dp<pr+13)die()
  }
  pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0})
}

function dGrid(){X.strokeStyle=P.grid;X.lineWidth=.5;const gs=Math.floor(W()/22);for(let x=0;x<W();x+=gs){X.beginPath();X.moveTo(x,0);X.lineTo(x,H());X.stroke()}for(let y=0;y<H();y+=gs){X.beginPath();X.moveTo(0,y);X.lineTo(W(),y);X.stroke()}}
function dEx(){const p=Math.sin(Date.now()/600)*.3+.7;
  for(let i=3;i>=0;i--){X.strokeStyle='rgba(96,200,144,'+(p*.1*(i+1))+')';X.lineWidth=i+1;X.beginPath();X.arc(ex,ey,er+10+i*6+Math.sin(Date.now()/450+i)*3,0,Math.PI*2);X.stroke()}
  const gd=X.createRadialGradient(ex,ey,0,ex,ey,er+14);gd.addColorStop(0,'rgba(96,200,144,'+(p*.22)+')');gd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=gd;X.beginPath();X.arc(ex,ey,er+14,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(96,200,144,'+(p*.9)+')';X.font=Math.floor(W()/35)+'px monospace';X.textAlign='center';X.textBaseline='middle';X.fillText('▣',ex,ey);X.fillStyle='rgba(140,210,170,'+(p*.7)+')';X.font=Math.floor(W()/60)+'px sans-serif';X.fillText('EXTRACT',ex,ey-er-14)}
function dLoot(){for(const l of loot){if(l.co)continue;l.pu+=.03;const gl=Math.sin(l.pu)*.3+.7,r=P[l.ra],sz=l.ra==='legendary'?8:l.ra==='rare'?6:5;
  const gd=X.createRadialGradient(l.x,l.y,0,l.x,l.y,sz+8);gd.addColorStop(0,r.g.replace('0.3',String(gl*.35)));gd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=gd;X.beginPath();X.arc(l.x,l.y,sz+8,0,Math.PI*2);X.fill();
  X.fillStyle=r.c;X.globalAlpha=gl*.9;X.beginPath();X.arc(l.x,l.y,sz,0,Math.PI*2);X.fill();X.globalAlpha=1;
  X.fillStyle='rgba(255,255,255,'+(gl*.55)+')';X.beginPath();X.arc(l.x-1,l.y-1,sz-3,0,Math.PI*2);X.fill()}}
function dEn(en){const a=.3+en.al*.55,r=12;
  const gd=X.createRadialGradient(en.x,en.y,0,en.x,en.y,r+8);gd.addColorStop(0,P.enemyGlow.replace('0.25',String(a*.25)));gd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=gd;X.beginPath();X.arc(en.x,en.y,r+8,0,Math.PI*2);X.fill();
  X.fillStyle=P.enemy;X.globalAlpha=a;X.beginPath();X.arc(en.x,en.y,r,0,Math.PI*2);X.fill();X.globalAlpha=1;
  X.fillStyle='rgba(220,150,160,'+(a*.45)+')';X.beginPath();X.arc(en.x,en.y,r-4,0,Math.PI*2);X.fill();
  if(en.al>.25){X.fillStyle='rgba(255,190,200,'+((en.al-.25)*.85)+')';X.font=Math.floor(W()/55)+'px monospace';X.textAlign='center';X.textBaseline='middle';X.fillText('!',en.x,en.y)}}
function dPl(){const gd=X.createRadialGradient(px,py,0,px,py,pr+12);gd.addColorStop(0,P.playerGlow);gd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=gd;X.beginPath();X.arc(px,py,pr+12,0,Math.PI*2);X.fill();
  X.fillStyle=P.player;X.beginPath();X.arc(px,py,pr,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(190,240,210,0.5)';X.beginPath();X.arc(px-2,py-2,pr-5,0,Math.PI*2);X.fill()}
function dPts(){for(const p of pts){X.globalAlpha=p.life/p.ml;X.fillStyle=p.color;X.beginPath();X.arc(p.x,p.y,p.size*p.life/p.ml,0,Math.PI*2);X.fill()}X.globalAlpha=1}
function dVig(){const v=X.createRadialGradient(W()/2,H()/2,W()*.28,W()/2,H()/2,W()*.82);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(8,4,18,0.6)');X.fillStyle=v;X.fillRect(0,0,W(),H())}

let lt=0;
function rn(ts){const dt=lt?Math.min((ts-lt)/1000,.1):.016;lt=ts;up(dt);
  X.clearRect(0,0,W(),H());X.fillStyle=P.bg;X.fillRect(0,0,W(),H());dGrid();dEx();dLoot();for(const e of ens)dEn(e);if(st!=='dead')dPl();dPts();dVig();
  X.strokeStyle='rgba(70,50,100,0.3)';X.lineWidth=1;X.strokeRect(.5,.5,W()-1,H()-1);
  requestAnimationFrame(rn)}

stLvl(0);requestAnimationFrame(rn);
</script>
</body>
</html>
