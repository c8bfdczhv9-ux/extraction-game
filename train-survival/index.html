<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NIGHT TRAIN · Last Car</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#1A0C28;overflow:hidden;font-family:'Segoe UI',-apple-system,system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:fixed}
#wrap{position:relative;width:100vw;height:100vh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;background:#1A0C28;border-radius:6px;max-width:100vw;max-height:56vh}
/* Black PVD border — watchmaking finish */
canvas{border:1.5px solid rgba(58,48,64,0.5);box-shadow:0 0 20px rgba(75,30,110,0.15),inset 0 0 0 1px rgba(42,37,53,0.3)}
/* Crystal Over shimmer on canvas edge */
canvas::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(200,180,240,0.08),transparent)}

/* HUD — corpus typography */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.hb{background:rgba(18,6,30,0.92);border:1px solid rgba(107,48,160,0.2);border-radius:3px;padding:5px 12px;font-size:11px;color:#B496D2;letter-spacing:1.8px;font-weight:300;font-variant-numeric:tabular-nums}
/* Inventory — Crystal Over pills */
#inv{position:absolute;bottom:84px;left:10px;right:10px;display:flex;gap:5px;justify-content:center;pointer-events:none;z-index:10;flex-wrap:wrap}
.iv{background:rgba(18,6,30,0.9);border:1px solid rgba(155,139,176,0.15);border-radius:3px;padding:3px 8px;font-size:8.5px;color:#9B8BB0;letter-spacing:0.5px;font-weight:300}

/* Controls — Black PVD + Crystal Over */
#ctrls{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;z-index:10}
#joy{width:96px;height:96px;background:rgba(26,10,40,0.5);border:1.5px solid rgba(107,48,160,0.18);border-radius:50%;position:relative;touch-action:none;
  background:radial-gradient(circle at 35% 35%,rgba(42,37,53,0.4),rgba(18,6,30,0.6))}
#stick{width:40px;height:40px;background:rgba(155,139,176,0.28);border:1px solid rgba(155,139,176,0.35);border-radius:50%;position:absolute;top:28px;left:28px;pointer-events:none;
  background:radial-gradient(circle at 40% 40%,rgba(196,168,224,0.3),rgba(110,95,133,0.15))}
#pick{width:60px;height:60px;background:rgba(125,155,139,0.1);border:1.5px solid rgba(125,155,139,0.25);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(155,184,168,0.6);margin-bottom:18px;touch-action:none;
  background:linear-gradient(135deg,rgba(155,184,168,0.12),rgba(90,110,100,0.06))}
#pick:active{background:rgba(125,155,139,0.22);color:rgba(200,215,205,0.8)}
#hint{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);color:rgba(155,139,176,0.25);font-size:9px;letter-spacing:2.5px;pointer-events:none;z-index:5;font-weight:200}
#warn{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);color:#E898A8;font-size:12px;letter-spacing:2px;pointer-events:none;z-index:5;opacity:0;text-align:center;font-weight:300}

/* === LOGBOOK — Black PVD panel === */
#logbook{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:30;
  background:linear-gradient(180deg,rgba(10,2,20,0.97),rgba(20,5,35,0.95));
  border-radius:6px;padding:20px 16px;
  border:1px solid rgba(58,48,64,0.3)}
#logbook.show{display:flex}
.lb-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lb-day{font-size:12px;color:#C4A8E0;letter-spacing:2px;font-weight:200;font-variant-numeric:tabular-nums}
.lb-page-dots{display:flex;gap:7px}
.lb-dot{width:6px;height:6px;border-radius:50%;background:rgba(155,139,176,0.12);border:1px solid rgba(155,139,176,0.1)}
.lb-dot.active{background:#C4A8E0;border-color:rgba(196,168,224,0.3)}
.lb-content{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.lb-title{font-size:11px;color:#8B7BA0;letter-spacing:3px;margin-bottom:10px;font-weight:300;text-transform:uppercase}
.lb-text{font-size:10.5px;color:#9B8BB0;line-height:1.8;margin-bottom:14px;max-width:280px;font-weight:300}
.lb-res{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.lb-ri{font-size:9.5px;color:#7D9B8B;background:rgba(125,155,139,0.06);border:1px solid rgba(125,155,139,0.15);border-radius:3px;padding:4px 10px;letter-spacing:1px}
.lb-ri.low{color:#E898A8;border-color:rgba(232,152,168,0.2)}
/* Crystal Over button */
.lb-btn{background:linear-gradient(180deg,rgba(125,155,139,0.1),rgba(90,110,100,0.04));
  border:1px solid rgba(125,155,139,0.22);color:#B496D2;padding:11px 28px;border-radius:4px;font-size:11px;letter-spacing:2px;cursor:pointer;font-weight:300;margin:4px;
  transition:background 0.15s}
.lb-btn:active{background:rgba(125,155,139,0.2);color:#D4C0E8}
.lb-btn.warn{background:linear-gradient(180deg,rgba(232,152,168,0.08),rgba(180,100,120,0.03));
  border-color:rgba(232,152,168,0.22);color:#E898A8}
.lb-btn.warn:active{background:rgba(232,152,168,0.18)}
.lb-nav{display:flex;justify-content:center;gap:12px;margin-top:8px}
.lb-small{font-size:8px;color:rgba(155,139,176,0.2);text-align:center;margin-top:8px;letter-spacing:2px;font-weight:200}
#explore-hint{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:#D4C0E8;font-size:12px;letter-spacing:3px;pointer-events:none;z-index:5;display:none;font-weight:200}
/* Game Over — Black PVD */
#over{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;
  background:linear-gradient(180deg,rgba(8,2,18,0.98),rgba(18,6,32,0.96));border-radius:6px}
#over.show{display:flex}
.ot{font-size:16px;color:#C4A8E0;letter-spacing:4px;margin-bottom:6px;font-weight:200}
.os{font-size:10px;color:#9B8BB0;margin-bottom:16px;font-weight:300;line-height:1.7;text-align:center}
.btn{background:linear-gradient(180deg,rgba(125,155,139,0.1),rgba(90,110,100,0.04));
  border:1px solid rgba(125,155,139,0.2);color:#B496D2;padding:10px 26px;border-radius:4px;font-size:11px;letter-spacing:2px;cursor:pointer;margin:4px;font-weight:300}
.btn:active{background:rgba(125,155,139,0.2);color:#D4C0E8}
/* Style toggle */
#styletog{position:absolute;top:9px;right:14px;z-index:12;
  background:rgba(18,6,30,0.85);border:1px solid rgba(232,152,168,0.25);border-radius:3px;
  color:#E898A8;font-size:9px;padding:4px 10px;letter-spacing:1.5px;cursor:pointer;font-weight:300}
#styletog:active{background:rgba(232,152,168,0.12)}
#styletog.stencil{color:#F0EBF5;border-color:rgba(240,235,245,0.6)}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g"></canvas>
<button id="styletog" onclick="toggleStyle()">◈ 晶层</button>
<div id="hud"><span class="hb" id="tm">60s</span><span class="hb" id="lv">第1关 · 夜行</span></div>
<div id="inv"></div>
<div id="hint">拖动摇杆 · 点击拾取</div>
<div id="warn"></div>
<div id="explore-hint">探索中…</div>
<div id="ctrls">
  <div id="joy"><div id="stick"></div></div>
  <div id="pick">◈</div>
</div>
<!-- LOGBOOK -->
<div id="logbook">
  <div class="lb-header">
    <span class="lb-day" id="lb-day">DAY 1</span>
    <div class="lb-page-dots" id="lb-dots"></div>
  </div>
  <div class="lb-content" id="lb-content"></div>
  <div class="lb-nav" id="lb-nav"></div>
  <div class="lb-small">拾程 · 十关 · 抵达</div>
</div>
<div id="over"><div class="ot" id="ot"></div><div class="os" id="os"></div><button class="btn" onclick="rst()">重返</button></div>
</div>
<script>
// ===================================================================
// SETUP
// ===================================================================
var g=document.getElementById('g'), cx=g.getContext('2d');
var W,H;
function resize(){W=Math.min(window.innerWidth-12,500);H=Math.min(window.innerHeight*0.54,600);g.width=W;g.height=H;}

// ===================================================================
// CORPUS COLOR SYSTEM — 42 Commission DNA
// ===================================================================
var C={
  // 凝夜紫 family
  nightDeep:'#12061E', nightBase:'#2A1048', tucana:'#4E1D73', tucanaLight:'#6B30A0',
  twilight:'#3A2050', horizon:'#1A0C28',
  // Fame Green family
  fameGreen:'#7D9B8B', fameDark:'#5C7A6C', fameLight:'#9BB8A8', fameDeep:'#4A6B5A',
  // Banksy neutrals
  bw:'#F0EBF5', bg:'#9B8BB0', bgDark:'#6E5F85',
  // Accents
  dustyCoral:'#E898A8', petraGold:'#C0A060', vapourViolet:'#C4A8E0',
  // Black PVD
  pvdDark:'#1A1622', pvdMid:'#2A2535', pvdEdge:'#3A3040',
  // Coachline
  coach:'#D4B830',
  // Additional corpus colors
  muscariBlue:'#7A90C8', colCBlue:'#4A6A9A',
  limeGreen:'#7A9A70', sunset:'#C87868',
  calaLuna:'#C8B898', sagano:'#8A9B80',
  milori:'#2A3A6A', cobalto:'#3A5588',
  danfanPink:'#D4A0A8', forgeYellow:'#D4B860',
  // UI tones
  uiText:'#B496D2', uiDim:'#8B7BA0', uiBorder:'rgba(155,139,176,0.15)',
  deepBg:'#1A0A30', groundBase:'#180828'
};

// ===================================================================
// LEVEL VISUAL DATA — Each level has unique sky, weather, atmosphere
// ===================================================================
var LEVELS=[
  {n:1,name:'夜行',eng:'Night Run', desc:'在暗夜列车上奔跑收集物资',
   sky:[
     [0,'#12061E'],[0.12,'#1A0830'],[0.28,'#2A1048'],
     [0.5,'#4E1D73'],[0.7,'#6B30A0'],[0.85,'#3A2050'],[1,'#1A0C28']
   ],ground:C.groundBase,weather:'stars',starBoost:1.0,starColors:[C.bw,C.bw,C.bw,C.bw,C.bw,C.vapourViolet,C.petraGold,'#8AB8D0'],
   crystalAlpha:0.04,mistAlpha:0,rainAlpha:0,lightningChance:0},
  {n:2,name:'拂晓',eng:'First Light', desc:'熟悉营地生活·轻松开局',
   sky:[
     [0,'#1A0C28'],[0.18,'#2A1840'],[0.45,'#4A2868'],
     [0.65,'#7A5088'],[0.8,'#B090A0'],[0.9,'#C8B0A8'],[1,'#A09088']
   ],ground:'#2A1830',weather:'mist',starBoost:0.25,starColors:[C.bw,C.vapourViolet],
   crystalAlpha:0.03,mistAlpha:0.06,rainAlpha:0,lightningChance:0},
  {n:3,name:'探索',eng:'Expedition', desc:'外出搜索资源·晨光熹微',
   sky:[
     [0,'#1E1230'],[0.2,'#3A2850'],[0.5,'#6A5080'],
     [0.7,'#9B7BA0'],[0.85,'#B8A0B0'],[0.93,'#C8B8B8'],[1,'#A89890']
   ],ground:'#302038',weather:'mist',starBoost:0.15,starColors:[C.bw],
   crystalAlpha:0.035,mistAlpha:0.04,rainAlpha:0,lightningChance:0},
  {n:4,name:'采集',eng:'Gathering', desc:'储备食物和水·午后暖阳',
   sky:[
     [0,'#2A1A30'],[0.25,'#5A3850'],[0.5,'#8B6070'],
     [0.7,''#C8A878'],[0.85,'#D4B888'],[0.93,'#C0A070'],[1,'#908068']
   ],ground:'#3A2840',weather:'none',starBoost:0,starColors:[],
   crystalAlpha:0.03,mistAlpha:0,rainAlpha:0,lightningChance:0},
  {n:5,name:'维护',eng:'Maintenance', desc:'火车头需要更多照料·阴云',
   sky:[
     [0,'#1E1428'],[0.3,'#3A2848'],[0.55,'#5A4070'],
     [0.75,'#7A6088'],[0.88,'#8B7898'],[0.94,'#7A6888'],[1,'#504058']
   ],ground:'#221830',weather:'overcast',starBoost:0.05,starColors:[C.bw],
   crystalAlpha:0.02,mistAlpha:0.03,rainAlpha:0,lightningChance:0},
  {n:6,name:'危机',eng:'Crisis', desc:'危险事件增加·风暴将至',
   sky:[
     [0,'#100818'],[0.2,'#1E1030'],[0.45,'#3A2050'],
     [0.65,'#5A3080'],[0.8,'#7A40A0'],[0.9,'#603878'],[1,'#301840']
   ],ground:'#1A1028',weather:'storm',starBoost:0.1,starColors:[C.bw],
   crystalAlpha:0.04,mistAlpha:0.02,rainAlpha:0.08,lightningChance:0.004},
  {n:7,name:'坚守',eng:'Hold Fast', desc:'资源紧缺·坚持住·尘暴',
   sky:[
     [0,'#1C1420'],[0.3,'#382838'],[0.55,'#584050'],
     [0.75,'#786058'],[0.88,'#908070'],[0.94,'#706858'],[1,'#403830']
   ],ground:'#2A2030',weather:'dust',starBoost:0,starColors:[],
   crystalAlpha:0.01,mistAlpha:0.05,rainAlpha:0,lightningChance:0},
  {n:8,name:'暴雨',eng:'Monsoon', desc:'雨季来临·难以外出·倾盆',
   sky:[
     [0,'#0A1020'],[0.2,'#122038'],[0.45,'#183050'],
     [0.65,'#284868'],[0.82,'#305878'],[0.92,'#284868'],[1,'#182838']
   ],ground:'#101828',weather:'rain',starBoost:0,starColors:[],
   crystalAlpha:0.02,mistAlpha:0,rainAlpha:0.25,lightningChance:0.003},
  {n:9,name:'冲刺',eng:'Final Push', desc:'最后冲刺·放手一搏·流星雨',
   sky:[
     [0,'#12061E'],[0.15,'#1E0C32'],[0.38,'#2A1048'],
     [0.6,'#4E1D73'],[0.78,'#6B30A0'],[0.9,'#3A2050'],[1,'#1A0C28']
   ],ground:C.groundBase,weather:'meteor',starBoost:1.5,starColors:[C.bw,C.bw,C.vapourViolet,C.vapourViolet,C.petraGold,C.muscariBlue],
   crystalAlpha:0.05,mistAlpha:0,rainAlpha:0,lightningChance:0},
  {n:10,name:'终点',eng:'Arrival', desc:'最后的5天·抵达远方·金色黎明',
   sky:[
     [0,'#1A0C28'],[0.2,'#3A1850'],[0.45,'#7A4080'],
     [0.65,'#C8A878'],[0.82,'#D4B888'],[0.92,'#E8D0A0'],[1,'#B8A878']
   ],ground:'#3A2840',weather:'dawn',starBoost:0.1,starColors:[C.petraGold,C.bw],
   crystalAlpha:0.06,mistAlpha:0,rainAlpha:0,lightningChance:0}
];

// ===================================================================
// SHARED HELPERS
// ===================================================================
function fr(x,y,w,h){cx.fillRect(x,y,w,h);}
function fa(x,y,r){cx.beginPath();cx.arc(x,y,r,0,6.28);cx.fill();}
function fs(c){cx.fillStyle=c;}
function ss(c,w){cx.strokeStyle=c;cx.lineWidth=w||0.8;}

// ===================================================================
// ITEM SPRITES — Corpus Crystal Over finish on each
// ===================================================================
function coDot(x,y,s,c){fs(c||C.vapourViolet);cx.globalAlpha=0.18;cx.beginPath();cx.arc(x,y,s,0,6.28);cx.fill();cx.globalAlpha=1;}

function drawFood(x,y){
  var s=1.2;cx.save();cx.translate(x-5*s,y-7*s);
  fs('rgba(30,10,50,0.35)');fa(5*s,10*s,5*s);
  fs('rgba(160,130,90,0.3)');fr(1*s,1*s,8*s,8*s);
  ss(C.petraGold,1*s);cx.strokeRect(1*s,1*s,8*s,8*s);
  fs('rgba(180,150,110,0.5)');fr(0,0,10*s,2*s);fr(0,8*s,10*s,2*s);
  ss(C.petraGold,0.6*s);cx.strokeRect(0,0,10*s,2*s);cx.strokeRect(0,8*s,10*s,2*s);
  fs('rgba(180,150,110,0.2)');fr(1.5*s,3*s,7*s,4*s);
  fs('rgba(240,230,245,0.15)');fr(2*s,1.5*s,1.5*s,7*s);
  fs('rgba(160,130,90,0.4)');fr(3*s,-1*s,4*s,2.5*s);
  ss(C.petraGold,0.5*s);cx.strokeRect(3*s,-1*s,4*s,2.5*s);
  coDot(5*s,5*s,1.5*s,C.petraGold);
  cx.restore();
}
function drawCoal(x,y){
  var s=1.3;cx.save();cx.translate(x-4*s,y-6*s);
  fs('rgba(30,10,50,0.3)');fa(5*s,9*s,5*s);
  fs('rgba(70,60,80,0.4)');cx.beginPath();
  cx.moveTo(5*s,0);cx.lineTo(9*s,2*s);cx.lineTo(10*s,5*s);
  cx.lineTo(8*s,9*s);cx.lineTo(4*s,10*s);cx.lineTo(0,7*s);
  cx.lineTo(1*s,3*s);cx.closePath();cx.fill();
  ss('rgba(155,139,176,0.5)',1*s);cx.stroke();
  ss('rgba(170,150,195,0.3)',0.6*s);
  cx.beginPath();cx.moveTo(5*s,1*s);cx.lineTo(8*s,3*s);cx.lineTo(5*s,6*s);cx.closePath();cx.stroke();
  ss('rgba(190,170,215,0.2)',0.4*s);
  cx.beginPath();cx.moveTo(3*s,2*s);cx.lineTo(5*s,1*s);cx.lineTo(5*s,4*s);cx.closePath();cx.stroke();
  coDot(5*s,5*s,1.2*s);
  cx.restore();
}
function drawWater(x,y){
  var s=1.2;cx.save();cx.translate(x-5*s,y-7*s);
  fs('rgba(30,10,50,0.3)');fa(5*s,10*s,5*s);
  fs('rgba(100,135,160,0.22)');cx.beginPath();cx.arc(5*s,5*s,5*s,0,6.28);cx.fill();
  ss(C.fameGreen,1*s);cx.stroke();
  fs('rgba(125,155,139,0.18)');cx.beginPath();cx.arc(5*s,5.5*s,4*s,0,Math.PI);cx.fill();
  fs('rgba(125,155,139,0.3)');fr(3.5*s,-1*s,3*s,3*s);
  ss(C.fameGreen,0.6*s);cx.strokeRect(3.5*s,-1*s,3*s,3*s);
  fs('rgba(155,180,165,0.45)');fr(3*s,-2.5*s,4*s,2*s);
  ss(C.fameGreen,0.5*s);cx.strokeRect(3*s,-2.5*s,4*s,2*s);
  fs('rgba(240,230,245,0.1)');fa(3.5*s,3.5*s,2*s);
  ss(C.fameGreen,0.5*s);cx.beginPath();cx.arc(8*s,0,1.5*s,0,6.28);cx.stroke();
  coDot(5*s,4*s,1.4*s,C.fameLight);
  cx.restore();
}
function drawGun(x,y){
  var s=1.3;cx.save();cx.translate(x-6*s,y-5*s);
  fs('rgba(30,10,50,0.3)');fa(6*s,9*s,5*s);
  fs('rgba(110,100,130,0.4)');fr(2*s,1*s,8*s,3*s);
  ss(C.bgDark,0.8*s);cx.strokeRect(2*s,1*s,8*s,3*s);
  fs('rgba(70,60,90,0.5)');fr(10*s,1.5*s,1.5*s,2*s);
  fs('rgba(100,90,120,0.38)');fr(1*s,3.5*s,5*s,5*s);
  ss(C.bgDark,0.8*s);cx.strokeRect(1*s,3.5*s,5*s,5*s);
  fs('rgba(90,80,110,0.32)');fr(2.5*s,7.5*s,4*s,3*s);
  ss(C.bgDark,0.6*s);cx.strokeRect(2.5*s,7.5*s,4*s,3*s);
  fs('rgba(155,139,176,0.38)');fr(3.5*s,7*s,1.5*s,1.5*s);
  fs('rgba(80,70,100,0.38)');fr(1*s,7*s,3.5*s,4*s);
  ss(C.bgDark,0.6*s);cx.strokeRect(1*s,7*s,3.5*s,4*s);
  fs('rgba(40,20,60,0.4)');fr(5*s,1.5*s,2.5*s,1.5*s);
  fs('rgba(170,160,195,0.35)');fr(8*s,0.5*s,2*s,0.8*s);
  // Black PVD barrel
  fs(C.pvdMid);fr(8.5*s,0,2.5*s,0.6*s);
  ss(C.pvdEdge,0.4*s);cx.strokeRect(8.5*s,0,2.5*s,0.6*s);
  coDot(6*s,5*s,1.3*s,C.bg);
  cx.restore();
}
function drawRadio(x,y){
  var s=1.2;cx.save();cx.translate(x-7*s,y-6*s);

// ===================================================================
// PLAYER — Giacometti figure, corpus color outfit per context
// ===================================================================
function drawPlayer(px,py,t,clv){
  var s=2.2;cx.save();cx.translate(px,py-28*s);
  // Shadow — ellipse
  fs('rgba(20,5,30,0.45)');cx.beginPath();cx.ellipse(0,28*s,7*s,2*s,0,0,6.28);cx.fill();
  // Balloon string — Banksy Grey
  var blowY=28*s-22*s,bstrTop=-30*s;
  ss(C.bg,1.2*s);cx.lineCap='round';
  cx.beginPath();cx.moveTo(5*s,blowY-7*s);
  cx.quadraticCurveTo(7*s+Math.sin(t*1.7)*0.6*s,blowY-16*s,6*s,bstrTop);cx.stroke();
  // Heart balloon — Dusty Coral with Crystal Over highlight
  var bx2=6*s,by2=bstrTop-6*s;
  cx.save();cx.translate(bx2,by2);
  fs(C.dustyCoral);cx.globalAlpha=0.88;cx.beginPath();
  cx.moveTo(0,2.5*s);cx.bezierCurveTo(-4.5*s,-3.5*s,-9*s,1*s,0,7*s);
  cx.bezierCurveTo(9*s,1*s,4.5*s,-3.5*s,0,2.5*s);cx.fill();
  // Crystal Over dot on balloon
  fs(C.bw);cx.globalAlpha=0.25;cx.beginPath();cx.arc(-2*s,-1.5*s,1.8*s,0,6.28);cx.fill();
  cx.globalAlpha=1;cx.restore();

  // Legs — Giacometti thin, elongated
  var legPhase=t*6;
  ss(C.bgDark,2.5*s);cx.lineCap='round';
  cx.beginPath();cx.moveTo(-2*s,11*s);cx.lineTo(-3.5*s+Math.sin(legPhase)*5*s,24*s);cx.stroke();
  cx.beginPath();cx.moveTo(2*s,11*s);cx.lineTo(3.5*s+Math.sin(legPhase+Math.PI)*5*s,24*s);cx.stroke();
  // Feet — tiny Black PVD ovals
  var flx=-3.5*s+Math.sin(legPhase)*5*s,fly=24*s,frx=3.5*s+Math.sin(legPhase+Math.PI)*5*s;
  fs(C.pvdDark);cx.globalAlpha=0.5;cx.beginPath();cx.ellipse(flx,fly+1.2*s,3*s,0.8*s,0,0,6.28);cx.fill();
  cx.beginPath();cx.ellipse(frx,fly+1.2*s,3*s,0.8*s,0,0,6.28);cx.fill();cx.globalAlpha=1;

  // Skirt — Banksy White with wave animation
  var skirtWave=Math.sin(t*4)*1*s;
  fs(C.bw);cx.globalAlpha=0.92;cx.beginPath();
  cx.moveTo(-5*s+skirtWave,7*s);cx.lineTo(-6.5*s+skirtWave*1.3,13*s);
  cx.quadraticCurveTo(-7*s,15.5*s,-2.5*s,15.5*s+skirtWave*0.5);
  cx.quadraticCurveTo(7*s,14*s,6*s+skirtWave*0.8,13*s);
  cx.lineTo(4.5*s+skirtWave*0.5,7*s);cx.closePath();cx.fill();cx.globalAlpha=1;
  // Skirt hem line — Vapour Violet
  ss(C.vapourViolet,0.8*s);cx.globalAlpha=0.6;
  cx.beginPath();cx.moveTo(-6*s+skirtWave*1.2,13*s);
  cx.quadraticCurveTo(-2.5*s,16*s+skirtWave*0.5,5.8*s+skirtWave*0.7,13*s);cx.stroke();cx.globalAlpha=1;
  // Skirt lower hem — Dusty Coral accent line (corpus: color echo)
  ss(C.dustyCoral,0.5*s);cx.globalAlpha=0.3;
  cx.beginPath();cx.moveTo(-5*s+skirtWave*1.2,14.5*s);
  cx.quadraticCurveTo(-2*s,16.8*s+skirtWave*0.5,5*s+skirtWave*0.7,14.5*s);cx.stroke();cx.globalAlpha=1;

  // Body / Torso — Banksy White, elongated, narrow
  fs(C.bw);cx.globalAlpha=0.94;cx.beginPath();
  cx.moveTo(-3.5*s,-5*s);cx.lineTo(-4.5*s,7*s);cx.lineTo(4.5*s,7*s);cx.lineTo(3.5*s,-5*s);cx.closePath();cx.fill();cx.globalAlpha=1;
  ss(C.bg,0.5*s);cx.stroke();

  // Arms — thin Giacometti lines
  ss(C.bgDark,1.8*s);cx.lineCap='round';
  cx.beginPath();cx.moveTo(-3.5*s,-2*s);cx.quadraticCurveTo(-1.5*s,-9*s,5*s,blowY-8*s);cx.stroke();
  cx.beginPath();cx.moveTo(3.5*s,-2*s);cx.quadraticCurveTo(8*s+Math.sin(t*5)*2*s,-0.5*s,7*s+Math.sin(t*5)*2.5*s,5*s);cx.stroke();

  // Head — larger, more sculptural
  fs(C.bw);cx.globalAlpha=0.96;cx.beginPath();cx.arc(0,-9*s,4.5*s,0,6.28);cx.fill();cx.globalAlpha=1;
  ss(C.bg,0.7*s);cx.beginPath();cx.arc(0,-9*s,4.5*s,0,6.28);cx.stroke();
  // Crystal Over head highlight
  fs(C.bw);cx.globalAlpha=0.15;cx.beginPath();cx.arc(-1.5*s,-11.5*s,1.5*s,0,6.28);cx.fill();cx.globalAlpha=1;
  // Hair — flowing, corpus color based on level
  var hairClr=clv===10?C.petraGold:(clv>=8?'#D4A0A8':C.bgDark);
  fs(hairClr);cx.globalAlpha=0.72;cx.beginPath();
  var hf=Math.sin(t*3.5)*1.4*s;
  cx.moveTo(-4*s,-11.5*s);cx.quadraticCurveTo(-5.5*s+hf,-12.5*s,-8*s+hf*2,-9*s);
  cx.quadraticCurveTo(-9.5*s+hf*2.5,-6*s,-7.5*s+hf*3,-2*s);
  cx.lineTo(-4.5*s+hf,-5*s);cx.quadraticCurveTo(-4*s+hf,-8*s,-2.5*s,-12.5*s);cx.closePath();cx.fill();cx.globalAlpha=1;
  // Eyes — dark, expressive
  fs(C.nightDeep);cx.globalAlpha=0.8;
  cx.beginPath();cx.arc(-1.6*s,-10*s,0.6*s,0,6.28);cx.fill();
  cx.beginPath();cx.arc(1.6*s,-10*s,0.6*s,0,6.28);cx.fill();cx.globalAlpha=1;
  cx.restore();
}

// ===================================================================
function drawCar(ca,c,t){
  var cx2=ca.x-c,cy=ca.y,cw=ca.w,ch=ca.h,uh=ch*0.40;
  // Roof shadow
  fs(C.nightDeep);fr(cx2,cy-7,cw,8);
  var roof=cx.createLinearGradient(cx2,cy-7,cx2,cy+2);
  roof.addColorStop(0,'rgba(125,155,139,0.08)');roof.addColorStop(1,'transparent');fs(roof);fr(cx2,cy-7,cw,9);
  // Upper body — Fame Green gradient
  var ug=cx.createLinearGradient(cx2,cy,cx2,cy+uh);
  ug.addColorStop(0,C.fameLight);ug.addColorStop(0.4,C.fameGreen);ug.addColorStop(1,C.fameDark);fs(ug);fr(cx2,cy,cw,uh);
  // Lower body
  var lg2=cx.createLinearGradient(cx2,cy+uh,cx2,cy+ch);
  lg2.addColorStop(0,C.fameGreen);lg2.addColorStop(1,C.fameDeep);fs(lg2);fr(cx2,cy+uh,cw,ch-uh);
  // Coachline — YELLOW (绿皮火车 signature)
  ss(C.coach,1.7);cx.globalAlpha=0.65;
  cx.beginPath();cx.moveTo(cx2+10,cy+uh);cx.lineTo(cx2+cw-10,cy+uh);cx.stroke();
  cx.globalAlpha=1;
  // Thin bottom yellow stripe
  ss(C.coach,0.8);cx.globalAlpha=0.4;
  cx.beginPath();cx.moveTo(cx2+6,cy+ch-14);cx.lineTo(cx2+cw-6,cy+ch-14);cx.stroke();
  cx.globalAlpha=1;
  // Crystal Over top highlight
  var hl=cx.createLinearGradient(cx2,cy,cx2,cy+14);
  hl.addColorStop(0,'rgba(200,220,210,0.2)');hl.addColorStop(0.5,'rgba(180,200,190,0.1)');hl.addColorStop(1,'transparent');
  fs(hl);fr(cx2,cy,cw,14);
  // Crystal Over body veil
  var cov=cx.createLinearGradient(cx2,cy,cx2,cy+uh*0.6);
  cov.addColorStop(0,'rgba(220,240,230,0.035)');cov.addColorStop(1,'transparent');
  fs(cov);fr(cx2,cy,cw,uh*0.6);

  // === CREW MEMBER in car 1/3/5 ===
  var crewCars=[0,2,4];
  if(crewCars.indexOf(ca.ci)>=0&&!crewFound[ca.ci]){
    var ppBaseY2=cy+uh*0.45,ppX2=cx2+cw*0.5;
    fs('rgba(20,5,25,0.3)');cx.beginPath();cx.ellipse(ppX2,ppBaseY2+14,6,1.5,0,0,6.28);cx.fill();
    // Giacometti legs
    ss(C.bgDark,2.2);cx.lineCap='round';
    cx.beginPath();cx.moveTo(ppX2-2.5,ppBaseY2+3);cx.lineTo(ppX2-3.5,ppBaseY2+14);cx.stroke();
    cx.beginPath();cx.moveTo(ppX2+2.5,ppBaseY2+3);cx.lineTo(ppX2+3.5,ppBaseY2+14);cx.stroke();
    // Body — narrow
    fs('rgba(40,30,50,0.6)');fr(ppX2-5,ppBaseY2-7,10,12);
    // Head
    fs('rgba(40,30,50,0.65)');cx.beginPath();cx.arc(ppX2,ppBaseY2-10,4.5,0,6.28);cx.fill();
    fs(C.bw);cx.globalAlpha=0.2;cx.beginPath();cx.arc(ppX2-1.4,ppBaseY2-11,0.9,0,6.28);cx.fill();
    cx.beginPath();cx.arc(ppX2+1.4,ppBaseY2-11,0.9,0,6.28);cx.fill();cx.globalAlpha=1;
    fs('rgba(192,160,96,0.18)');fr(ppX2-3.5,cy+ch-46,7,7);
  }

  // === LUGGAGE RACK ===
  fs('rgba(250,248,245,0.38)');fr(cx2+8,cy+uh*0.02,cw-16,5);
  ss('rgba(255,252,250,0.5)',1);cx.strokeRect(cx2+8,cy+uh*0.02,cw-16,5);
  for(var bx4=cx2+14;bx4<cx2+cw-14;bx4+=cw*0.28){
    fs('rgba(200,195,190,0.28)');fr(bx4,cy+uh*0.02-5,2,12);
  }
  // Vintage suitcases — corpus leather tones
  var sc=[{x:0.14,c:'#5A3A2A',w:12},{x:0.3,c:'#6B2020',w:10},{x:0.46,c:'#3A3A30',w:13},{x:0.62,c:'#4A3020',w:11},{x:0.79,c:'#2A2020',w:10}];
  for(var si=0;si<sc.length;si++){
    var s=sc[si],sx=cx2+cw*s.x,sy=cy+uh*0.02-3;
    fs(s.c);fr(sx,sy,s.w,5);
    ss('rgba(0,0,0,0.28)',0.4);cx.strokeRect(sx,sy,s.w,5);
    ss('rgba(200,180,160,0.35)',0.5);cx.beginPath();cx.moveTo(sx+3,sy-1);cx.lineTo(sx+s.w-3,sy-1);cx.stroke();
  }

  // 绿皮火车 windows — horizontal rectangle
  var ww=cw*0.28,wh=ww*0.72,wy3=cy+uh*0.12;
  var wGap=(cw-ww*3)/4;
  for(var wi=0;wi<3;wi++){
    var wxi=cx2+wGap+wi*(ww+wGap);
    // Dining car interior
    var wallGrad=cx.createLinearGradient(wxi,wy3,wxi,wy3+wh);
    wallGrad.addColorStop(0,'#5A4030');wallGrad.addColorStop(0.5,'#4A3025');wallGrad.addColorStop(1,'#3A2018');
    fs(wallGrad);fr(wxi,wy3,ww,wh);
    // Warm light glow
    var glow=cx.createRadialGradient(wxi+ww/2,wy3+wh*0.15,0,wxi+ww/2,wy3+wh*0.15,ww*0.5);
    glow.addColorStop(0,'rgba(220,180,100,0.14)');glow.addColorStop(1,'transparent');
    fs(glow);fr(wxi,wy3,ww,wh);
    // Round table
    fs('rgba(100,70,40,0.5)');cx.beginPath();cx.arc(wxi+ww/2,wy3+wh*0.52,ww*0.1,0,6.28);cx.fill();
    ss('rgba(140,100,60,0.35)',0.5);cx.stroke();
    // Newspaper pattern
    ss('rgba(180,150,120,0.08)',0.3);
    for(var tl=0;tl<3;tl++){cx.beginPath();cx.moveTo(wxi+ww*0.35,wy3+wh*0.48+tl*ww*0.02);cx.lineTo(wxi+ww*0.65,wy3+wh*0.48+tl*ww*0.02);cx.stroke();}
    // Left booth — emerald green
    fs('#3A7D5A');fr(wxi+ww*0.02,wy3+wh*0.14,ww*0.24,wh*0.72);
    ss('rgba(30,90,60,0.35)',0.6);cx.strokeRect(wxi+ww*0.02,wy3+wh*0.14,ww*0.24,wh*0.72);
    fs('#4A8D6A');fr(wxi+ww*0.02,wy3+wh*0.55,ww*0.24,wh*0.18);
    // Right booth
    fs('#3A7D5A');fr(wxi+ww*0.74,wy3+wh*0.14,ww*0.24,wh*0.72);
    ss('rgba(30,90,60,0.35)',0.6);cx.strokeRect(wxi+ww*0.74,wy3+wh*0.14,ww*0.24,wh*0.72);
    fs('#4A8D6A');fr(wxi+ww*0.74,wy3+wh*0.55,ww*0.24,wh*0.18);
    // Wood trim
    fs('rgba(160,120,70,0.5)');fr(wxi+ww*0.02,wy3+wh*0.14,ww*0.24,wh*0.04);
    fs('rgba(160,120,70,0.5)');fr(wxi+ww*0.74,wy3+wh*0.14,ww*0.24,wh*0.04);
    // White window frame
    ss(C.bw,1.5);cx.globalAlpha=0.35;cx.strokeRect(wxi,wy3,ww,wh);cx.globalAlpha=1;
    // Sheer curtain
    fs('rgba(240,235,245,0.05)');fr(wxi+ww*0.03,wy3+wh*0.02,ww*0.06,wh*0.6);
    fs('rgba(240,235,245,0.05)');fr(wxi+ww*0.91,wy3+wh*0.02,ww*0.06,wh*0.6);
  }
  // Chassis
  fs(C.nightDeep);fr(cx2,cy+ch-10,cw,12);
  ss('rgba(155,139,176,0.12)',0.5);cx.strokeRect(cx2,cy+ch-10,cw,12);
  // Wheels — Black PVD
  for(var bi=0;bi<2;bi++){
    var bx3=cx2+cw*0.2+bi*cw*0.55,by4=cy+ch-4;
    // Bogie frame
    fs(C.deepBg);fr(bx3-18,by4-2,36,10);
    ss('rgba(155,139,176,0.18)',0.6);cx.strokeRect(bx3-18,by4-2,36,10);
    // Bogie springs
    ss('rgba(155,139,176,0.15)',1);
    cx.beginPath();cx.moveTo(bx3-15,by4+1);cx.lineTo(bx3-10,by4-3);
    cx.lineTo(bx3-2,by4-3);cx.lineTo(bx3+6,by4-3);cx.lineTo(bx3+10,by4-1);
    cx.lineTo(bx3+15,by4+1);cx.stroke();
    for(var wi2=0;wi2<2;wi2++){
      var wx4=bx3-5+wi2*14,wy4=by4+9;
      // Black PVD wheel body
      var pvd=cx.createRadialGradient(wx4-1,wy4-1,7,wx4,wy4,9);
      pvd.addColorStop(0,C.pvdMid);pvd.addColorStop(0.85,C.pvdDark);pvd.addColorStop(1,C.pvdEdge);
      fs(pvd);cx.beginPath();cx.arc(wx4,wy4,9,0,6.28);cx.fill();
      // Fame Green thin edge
      ss(C.fameGreen,1.2);cx.globalAlpha=0.35;cx.beginPath();cx.arc(wx4,wy4,9,0,6.28);cx.stroke();cx.globalAlpha=1;
      // Inner ring
      ss('rgba(60,50,70,0.5)',0.6);cx.beginPath();cx.arc(wx4,wy4,7,0,6.28);cx.stroke();
      // Hub — Black PVD
      fs(C.pvdMid);cx.beginPath();cx.arc(wx4,wy4,2.5,0,6.28);cx.fill();
      ss(C.pvdEdge,0.8);cx.beginPath();cx.arc(wx4,wy4,2.5,0,6.28);cx.stroke();
      // Petra Gold center dot
      fs(C.petraGold);cx.globalAlpha=0.35;cx.beginPath();cx.arc(wx4,wy4,1,0,6.28);cx.fill();cx.globalAlpha=1;
      // Spokes
      ss('rgba(125,155,139,0.35)',1);
      for(var sp=0;sp<6;sp++){
        var ang=sp*Math.PI/3+t*3;
        cx.beginPath();cx.moveTo(wx4+Math.cos(ang)*3.3,wy4+Math.sin(ang)*3.3);
        cx.lineTo(wx4+Math.cos(ang)*7.5,wy4+Math.sin(ang)*7.5);cx.stroke();
      }
    }
  }
  // Coupler
  if(!ca.last){
    fs(C.deepBg);fr(cx2+cw-6,cy+ch*0.36,7,ch*0.16);
    ss('rgba(155,139,176,0.22)',0.5);cx.strokeRect(cx2+cw-6,cy+ch*0.36,7,ch*0.16);
    ss('rgba(180,150,210,0.16)',0.5);
    cx.beginPath();cx.moveTo(cx2+cw-2,cy+ch*0.44);cx.lineTo(cx2+cw+10,cy+ch*0.44);cx.stroke();

  vig.addColorStop(0,'transparent');vig.addColorStop(0.55,'rgba(20,5,30,0.06)');
  vig.addColorStop(1,'rgba(10,2,20,0.68)');fs(vig);fr(0,0,W,H);
}

// ===================================================================
// STENCIL: Balloon-only redraw (for post-filter accent)
// ===================================================================
function drawBalloonOnly(px,py,t){
  var s=2.2;cx.save();cx.translate(px,py-28*s);
  var blowY=28*s-22*s,bstrTop=-30*s;
  ss(C.bg,1.2*s);cx.lineCap='round';
  cx.beginPath();cx.moveTo(5*s,blowY-7*s);
  cx.quadraticCurveTo(7*s+Math.sin(t*1.7)*0.6*s,blowY-16*s,6*s,bstrTop);cx.stroke();
  var bx2=6*s,by2=bstrTop-6*s;
  cx.save();cx.translate(bx2,by2);
  fs(C.dustyCoral);cx.globalAlpha=0.92;cx.beginPath();
  cx.moveTo(0,2.5*s);cx.bezierCurveTo(-4.5*s,-3.5*s,-9*s,1*s,0,7*s);
  cx.bezierCurveTo(9*s,1*s,4.5*s,-3.5*s,0,2.5*s);cx.fill();
  fs(C.bw);cx.globalAlpha=0.28;cx.beginPath();cx.arc(-2*s,-1.5*s,1.8*s,0,6.28);cx.fill();
  cx.globalAlpha=1;cx.restore();cx.restore();
}
function drawStencilOverlay(t){
  // Copy canvas to offscreen with stencil filter (high-contrast monochrome)
  if(!stencilBuf){stencilBuf=document.createElement('canvas');}
  stencilBuf.width=W;stencilBuf.height=H;
  var octx=stencilBuf.getContext('2d');
  octx.filter='contrast(2.6) grayscale(0.94) brightness(0.85)';
  octx.drawImage(g,0,0);
  cx.clearRect(0,0,W,H);cx.drawImage(stencilBuf,0,0);
  // Spray-paint texture — Banksy stencil overspray (stable per-frame seed)
  var seed=t*1000%100000;
  for(var i=0;i<60;i++){
    seed=(seed*16807)%2147483647;
    var sx=(seed%10000)/10000*W;
    seed=(seed*16807)%2147483647;
    var sy=(seed%10000)/10000*H;
    var sr=0.3+(seed%100)/100*1.2;
    fs(seed%2===0?'#000':'#FFF');cx.globalAlpha=0.06+(seed%8)/100;
    cx.beginPath();cx.arc(sx,sy,sr,0,6.28);cx.fill();
  }cx.globalAlpha=1;
  // Redraw Dusty Coral balloon — the ONLY color in the scene
  if(balloonSaved)drawBalloonOnly(balloonPX,balloonPY,t);
}
// ===================================================================
// MAIN DRAW
// ===================================================================
function draw(){
  cx.clearRect(0,0,W,H);
  if(phase===2){
    drawCamp(Date.now()/1000,level);
    // Save camp balloon for stencil redraw
    balloonSaved=true;balloonPX=W-65+5;balloonPY=H*0.68-46;
    drawVignette();
    if(styleMode==='stencil')drawStencilOverlay(Date.now()/1000);
    return;
  }
  drawSky(level);
  drawGround(level);
  drawSmoke();
  var t=Date.now()/1000;
  for(var ci=0;ci<cars.length;ci++){cars[ci].ci=ci;drawCar(cars[ci],cam,t);}
  for(var li=0;li<loot.length;li++){
    var l=loot[li];if(l.got)continue;
    var lx=l.x-cam;if(lx<-40||lx>W+40)continue;
    l.d.draw(lx,l.y);
  }
  var dpx=player.x-cam,dpy=player.y;drawPlayer(dpx,dpy,t,level);
  // Save balloon pos for stencil redraw
  balloonSaved=true;balloonPX=dpx;balloonPY=dpy;
  for(var pi=0;pi<pts.length;pi++){
    var p=pts[pi];cx.globalAlpha=p.life/p.ml;fs(p.c);
    cx.beginPath();cx.moveTo(p.x-cam,p.y-p.s);cx.lineTo(p.x-cam+p.s,p.y);
    cx.lineTo(p.x-cam,p.y+p.s);cx.lineTo(p.x-cam-p.s,p.y);cx.closePath();cx.fill();
  }cx.globalAlpha=1;
  drawVignette();
  if(styleMode==='stencil')drawStencilOverlay(t);
}

function skipRation(){
  rationFood=0;rationWater=0;
  var availCrew4=crewHealth-(explorerAway?1:0);
  if(availCrew4>0&&Math.random()<0.3){crewHealth--;}
  if(crewHealth<=0){endGamePhase2(false,'全员饥渴而亡');return;}
  rationFood=0;rationWater=0;
  logPage=2;showLogPage();
}
function doConsume(){
  var availCrew=crewHealth-(explorerAway?1:0);
  var needF=rationFood||availCrew,needW=rationWater||availCrew;
  var ate=Math.min(res.food,needF),drank=Math.min(res.water,needW);
  res.food-=ate;res.water-=drank;
  if(ate<availCrew||drank<availCrew){if(Math.random()<0.3){crewHealth--;}}
  if(crewHealth<=0){endGamePhase2(false,'配给不足，全员饥饿而亡');return;}
  rationFood=0;rationWater=0;
  logPage=2;showLogPage();
}
function startExplore(){
  explorerAway=true;
  explorerReturnDay=day+1+Math.floor(Math.random()*6);
  explorerFound=[];
  var btn=document.getElementById('explore-btn');if(btn)btn.disabled=true;
  logPage=3;showLogPage();
}
function tendEngine(n){
  if(n>0&&res.coal>=1&&res.water>=1){res.coal-=1;res.water-=1;distance+=22+Math.floor(Math.random()*6);}
  else if(n>0){if(Math.random()<0.3){crewHealth--;if(crewHealth<=0){endGamePhase2(false,'锅炉熄火，冻死了');return;}}distance+=8+Math.floor(Math.random()*5);}
  else{distance+=8+Math.floor(Math.random()*5);}
  logPage=4;rollEvent();showLogPage();
}
function rollEvent(){
  var r=Math.random(),lv=level;
  if(lv===2){if(r<0.15)eventToday={type:'luck'};else if(r<0.25)eventToday={type:'choice',subtype:'supplies'};else if(r<0.32)eventToday={type:'mice',loss:1};else eventToday=null;return;}
  if(lv===3){if(r<0.1)eventToday={type:'luck'};else if(r<0.18)eventToday={type:'mice',loss:1+Math.floor(Math.random()*2)};else if(r<0.22)eventToday={type:'sick'};else eventToday=null;return;}
  if(lv===8){if(r<0.45)eventToday={type:'rain'};else if(r<0.6)eventToday={type:'breakdown'};else if(r<0.72)eventToday={type:'bandit'};else if(r<0.82)eventToday={type:'mice',loss:2+Math.floor(Math.random()*2)};else if(r<0.9)eventToday={type:'sick'};else eventToday=null;return;}
  if(lv===9){if(r<0.2)eventToday={type:'breakdown'};else if(r<0.35)eventToday={type:'bandit'};else if(r<0.5)eventToday={type:'mice',loss:2+Math.floor(Math.random()*3)};else if(r<0.65)eventToday={type:'sick'};else if(r<0.72)eventToday={type:'rain'};else eventToday=null;return;}
  if(lv===10){if(r<0.25)eventToday={type:'breakdown'};else if(r<0.45)eventToday={type:'bandit'};else if(r<0.6)eventToday={type:'sick'};else if(r<0.72)eventToday={type:'mice',loss:3+Math.floor(Math.random()*3)};else if(r<0.8)eventToday={type:'rain'};else eventToday={type:'luck'};return;}
  if(r<0.12)eventToday={type:'breakdown'};else if(r<0.22)eventToday={type:'choice',subtype:Math.random()<0.5?'supplies':'stranger'};else if(r<0.34)eventToday={type:'bandit'};else if(r<0.44)eventToday={type:'mice',loss:1+Math.floor(Math.random()*3)};else if(r<0.52)eventToday={type:'sick'};else if(r<0.6)eventToday={type:'rain'};else if(r<0.7)eventToday={type:'luck'};else eventToday=null;
}
function fixBreakdown(){if(res.iron>=1){res.iron-=1;eventToday=null;endDay();}else skipEvent();}
function healSick(){if(res.meds>=1){res.meds-=1;eventToday=null;endDay();}else skipEvent();}
function skipEvent(){
  if(eventToday&&eventToday.type==='sick'){crewHealth--;if(crewHealth<=0){endGamePhase2(false,'病重不治');return;}}
  eventToday=null;endDay();
}
function fightBandit(){
  res.ammo--;eventToday=null;
  if(Math.random()<0.7){
    var loot2=[];if(Math.random()<0.6){res.iron+=2;loot2.push('🪨铁片×2');}if(Math.random()<0.6){res.water+=3;loot2.push('💧水×3');}if(loot2.length===0){res.food+=2;loot2.push('🍞食物×2');}
    explorerFound=loot2.map(function(s){var p=s.split('×');return{name:p[0].slice(2),icon:p[0].slice(0,2),amt:parseInt(p[1])};});
    endDay();return;
  }else{res.food=Math.max(0,res.food-2);res.water=Math.max(0,res.water-2);endDay();return;}
}
function cureMice(){res.meds--;eventToday=null;endDay();}
function doChoice(take){
  var sub=eventToday?eventToday.subtype:'supplies';eventToday=null;
  if(take){
    if(Math.random()<0.65){if(sub==='supplies'){res.food+=3;res.water+=2;res.coal+=2;}else{res.food+=2;res.water+=2;res.iron+=1;}endDay();return;}
    else{res.food=Math.max(0,res.food-3);res.water=Math.max(0,res.water-2);if(Math.random()<0.3){crewHealth--;}endDay();return;}
  }else{endDay();return;}
}
function calcScore(){score=Math.floor(distance*0.5+res.food*10+res.water*8+res.coal*5+res.iron*15+res.wood*8+crewHealth*200+res.gear*30+res.ammo*20);return score>800?'S':score>600?'A':score>400?'B':score>200?'C':'D';}
function resolveEvent(){
  if(eventToday&&eventToday.type==='mice')res.food=Math.max(0,res.food-eventToday.loss);
  if(eventToday&&eventToday.type==='luck'){res.food+=2;res.water+=1;res.coal+=1;}
  if(eventToday&&eventToday.type==='bandit'&&eventToday.stolen){res.food=Math.max(0,res.food-eventToday.stolen.food);res.water=Math.max(0,res.water-eventToday.stolen.water);}
  eventToday=null;endDay();
}
function endDay(){
  day++;
  if(explorerAway&&day>=explorerReturnDay){
    explorerAway=false;
    if(Math.random()<0.15){crewHealth--;explorerFound=[{name:'未归',icon:'💀',amt:0}];}
    else{
      var types2=[{n:'铁片',icon:'🪨',k:'iron'},{n:'煤炭',icon:'🔥',k:'coal'},{n:'水',icon:'💧',k:'water'},{n:'木材',icon:'🪵',k:'wood'},{n:'食物',icon:'🍞',k:'food'},{n:'子弹',icon:'🔫',k:'ammo2'},{n:'猎枪',icon:'🔫',k:'gear2'},{n:'收音机',icon:'📻',k:'comm2'},{n:'棋盘',icon:'♟️',k:'chess2'}];
      explorerFound=[];
      var fcount=2+Math.floor(Math.random()*3);
      for(var fi3=0;fi3<fcount;fi3++){var t2=types2[Math.floor(Math.random()*types2.length)];var amt2=1+Math.floor(Math.random()*3);if(!t2.k.endsWith('2'))res[t2.k]=(res[t2.k]||0)+amt2;else if(t2.k==='gear2')res.gear=(res.gear||0)+amt2;else if(t2.k==='ammo2')res.ammo=(res.ammo||0)+amt2;explorerFound.push({name:t2.n,icon:t2.icon,amt:amt2});}
    }
    if(crewHealth<=0){endGamePhase2(false,'探索者未归，全员覆没');return;}
  }
  if(distance>=goalDistance){endGamePhase2(true,'提前抵达远方！');return;}
  if(level>=2&&(day-(level-2)*daysPerLevel)>daysPerLevel){level++;if(level>10){endGamePhase2(true,'抵达远方！50天旅程结束');return;}showLevelIntro=true;}
  logPage=1;eventToday=null;exploreFinds=[];showLogPage();
}
function endGamePhase2(win,msg){
  phase=3;hideLogbook();
  var rating=calcScore();
  document.getElementById('over').classList.add('show');
  document.getElementById('ot').textContent=win?'✦ 抵达':'✧ 中断';
  document.getElementById('os').innerHTML=msg+'<br/>评分: '+rating+' ('+score+'分)<br/>距离: '+Math.floor(distance)+'km · 存活: '+crewHealth+'人';
  document.getElementById('ctrls').style.display='none';
}
// ===================================================================
// PHASE 1 → PHASE 2 TRANSITION
// ===================================================================
function startPhase2(){
  phase=2;st='play';level=2;showLevelIntro=true;
  res.food=inv.food;res.water=inv.water;res.coal=inv.coal;
  res.meds=inv.med;res.wood=0;res.iron=0;res.gear=inv.gear||0;res.ammo=inv.ammo||0;
  crewHealth=crewCount;
  day=1;logPage=1;distance=0;
  exploreFinds=[];eventToday=null;
  showLogbook();
}

// ===================================================================
// PHASE 1 LOGIC
// ===================================================================
function updInv(){var h='';for(var i=0;i<ITEMS.length;i++)h+='<span class=iv>'+inv[ITEMS[i].k]+' '+ITEMS[i].n+'</span>';document.getElementById('inv').innerHTML=h;}
function rst(){
  phase=1;level=1;showLevelIntro=false;time=60;st='play';
  var lv=LEVELS[0];
  document.getElementById('lv').textContent=lv.name+' · '+lv.eng;
  inv={food:0,coal:0,water:0,gear:0,ammo:0,comm:0,chess:0,med:0};
  inLast=false;dc=0;pts=[];loot=[];crewFound=[false,false,false,false,false,false];crewCount=0;balloonSaved=false;
  makeCars();spawnLoot();makeStars();
  player.x=carW()/2;cam=0;
  document.getElementById('over').classList.remove('show');
  document.getElementById('warn').style.opacity='0';document.getElementById('hint').style.opacity='1';
  ctrlsDiv.style.display='flex';
  document.getElementById('hud').style.display='flex';document.getElementById('inv').style.display='flex';
  document.getElementById('hint').style.display='block';
  hideLogbook();updInv();
}
function gameOverP1(win){st='end';document.getElementById('over').classList.add('show');
  if(win){startPhase2();return;}
  document.getElementById('ot').textContent='未抵达';document.getElementById('os').textContent='未能抵达最后一节车厢';ctrlsDiv.style.display='none';
}
function collect(it){if(it.got)return;it.got=true;inv[it.d.k]++;updInv();
  for(var i=0;i<8;i++)pts.push({x:it.x,y:it.y,vx:(Math.random()-0.5)*2.5,vy:-2-Math.random()*2.5,life:22,ml:22,c:it.d.c,s:1.5+Math.random()*2});}
function pickup(){for(var i=0;i<loot.length;i++){var l=loot[i];if(l.got)continue;if(Math.abs(player.x-l.x)<38&&Math.abs(player.y-l.y)<44)collect(l);}}
function up(dt){
  rainOffset+=dt*20;
  if(phase===2){pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0;});return;}
  if(st!=='play'){pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return;}
  time-=dt;if(time<0)time=0;
  document.getElementById('tm').textContent=Math.ceil(time)+'s';
  document.getElementById('tm').style.color=time<15?C.dustyCoral:C.fameGreen;
  if(time<8)document.getElementById('hint').style.opacity='0';
  if(time<=0){gameOverP1(false);return;}
  var dx=joyX;if(keys[37]||keys[65])dx=-1;if(keys[39]||keys[68])dx+=1;
  player.x+=dx*5*60*dt;player.x=Math.max(8,Math.min(cars[NC-1].x+cars[NC-1].w-8,player.x));
  var ci=Math.floor(player.x/carW());if(ci>=0&&ci<NC)player.y=cars[ci].y+cars[ci].h-42;
  var crewCars2=[0,2,4];
  if(crewCars2.indexOf(ci)>=0&&!crewFound[ci]){
    crewFound[ci]=true;crewCount++;
    var c2=cars[ci];
    var et=[ITEMS[0],ITEMS[2],ITEMS[4]];
    loot.push({x:c2.x+c2.w*0.3,y:c2.y+c2.h-38,ci:ci,d:et[0],got:false});
    loot.push({x:c2.x+c2.w*0.6,y:c2.y+c2.h-38,ci:ci,d:et[1],got:false});
    document.getElementById('warn').style.opacity='1';
    document.getElementById('warn').innerHTML='找到同伴！（'+crewCount+'/3）';
    setTimeout(function(){document.getElementById('warn').style.opacity='0';},1500);
  }
  cam=player.x-W/2;cam=Math.max(0,Math.min(cars[NC-1].x+cars[NC-1].w-W,cam));
  var inL=ci===NC-1;
  if(inL&&!inLast){inLast=true;dc=0;document.getElementById('warn').style.opacity='1';}
  if(inL&&inLast){dc+=dt;document.getElementById('warn').innerHTML='最后一节<br>停留3秒过关';if(dc>=3)gameOverP1(true);}
  if(!inL&&inLast){inLast=false;dc=0;document.getElementById('warn').style.opacity='0';}
  pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});
}

// Loop
var lt=0;
function loop(ts){var dt=lt?Math.min((ts-lt)/1000,0.1):0.016;lt=ts;try{up(dt);}catch(e){}try{draw();}catch(e){}requestAnimationFrame(loop);}

// Input
var joyX=0,joyActive=false,joyOX=0,joyOY=0,keys={};
var joy=document.getElementById('joy'),stick=document.getElementById('stick');
function joyMove(cx2,cy){var r=joy.getBoundingClientRect();var dx=cx2-r.left,dy=cy-r.top;if(!joyActive){joyOX=dx;joyOY=dy;joyActive=true;}var mx=dx-joyOX,my=dy-joyOY;var d=Math.sqrt(mx*mx+my*my);if(d>30){mx=mx/d*30;my=my/d*30;}stick.style.left=(28+mx)+'px';stick.style.top=(28+my)+'px';joyX=mx/30;}
function joyEnd(){joyActive=false;joyX=0;stick.style.left='28px';stick.style.top='28px';}
joy.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY);});
joy.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY);});
joy.addEventListener('touchend',function(e){e.preventDefault();joyEnd();});
joy.addEventListener('touchcancel',function(e){e.preventDefault();joyEnd();});
joy.addEventListener('mousedown',function(e){e.preventDefault();joyMove(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){if(joyActive)joyMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',function(){if(joyActive)joyEnd();});
document.getElementById('pick').addEventListener('touchstart',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup();});
document.getElementById('pick').addEventListener('mousedown',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup();});
window.addEventListener('keydown',function(e){keys[e.keyCode]=true;if(e.keyCode===32&&st==='play'&&phase===1){e.preventDefault();pickup();}});
window.addEventListener('keyup',function(e){keys[e.keyCode]=false;});

// Start
resize();makeCars();spawnLoot();makeStars();updInv();player.x=carW()/2;requestAnimationFrame(loop);
</script>
</body>
</html>
