<style>

<script>
// ===== SETUP =====
var g=document.getElementById('g'), cx=g.getContext('2d');
var W,H;
function resize(){W=Math.min(window.innerWidth-12,500);H=Math.min(window.innerHeight*0.54,600);g.width=W;g.height=H}
resize();

// ===== PERLIN NOISE =====
var perm=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
for(var i=0;i<256;i++)perm[256+i]=perm[i];
function pn(x,y){var X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);var u=x*x*x*(x*(x*6-15)+10),v=y*y*y*(y*(y*6-15)+10);var a=perm[perm[X]+Y],b=perm[perm[X+1]+Y],c=perm[perm[X]+Y+1],d=perm[perm[X+1]+Y+1];return((a&1?-1:1)*x*(1-x)+(a&2?-1:1)*y*(1-y))+(((b&1?-1:1)*(x-1)*(2-x)+(b&2?-1:1)*y*(1-y))-((a&1?-1:1)*x*(1-x)+(a&2?-1:1)*y*(1-y)))*u+(((c&1?-1:1)*x*(1-x)+(c&2?-1:1)*(y-1)*(2-y))-((a&1?-1:1)*x*(1-x)+(a&2?-1:1)*y*(1-y)))*v+(((a&1?-1:1)*x*(1-x)+(a&2?-1:1)*y*(1-y))+((d&1?-1:1)*(x-1)*(2-x)+(d&2?-1:1)*(y-1)*(2-y))-((b&1?-1:1)*(x-1)*(2-x)+(b&2?-1:1)*y*(1-y))-((c&1?-1:1)*x*(1-x)+(c&2?-1:1)*(y-1)*(2-y)))*u*v;}
function pk(a){return a[Math.floor(Math.random()*a.length)]}
function fr(x,y,w,h){cx.fillRect(x,y,w,h)}
function fs(c){cx.fillStyle=c}

// ===== GRID STIPPLE ENGINE =====
// Draw grid-based dots with Perlin-driven size/opacity within a rect
function gs(x,y,w,h,colors,grid,threshold,scale){
  for(var gy=y;gy<y+h;gy+=grid){
    for(var gx=x;gx<x+w;gx+=grid){
      var nv=pn(gx*scale,gy*scale)*0.5+0.5;
      if(nv<threshold)continue;
      cx.fillStyle=pk(colors);cx.globalAlpha=0.25+nv*0.55;
      cx.beginPath();cx.arc(gx,gy,0.4+nv*3.5,0,6.28);cx.fill();
    }
  }cx.globalAlpha=1;
}
// Simpler: fixed size dots, noise just controls draw/don't-draw
function gs2(x,y,w,h,colors,grid,threshold,scale,dotSize){
  dotSize=dotSize||1.5;
  for(var gy=y;gy<y+h;gy+=grid){
    for(var gx=x;gx<x+w;gx+=grid){
      var nv=pn(gx*scale,gy*scale)*0.5+0.5;
      if(nv<threshold)continue;
      cx.fillStyle=pk(colors);cx.globalAlpha=0.3+nv*0.5;
      cx.beginPath();cx.arc(gx,gy,dotSize*0.5+nv*dotSize,0,6.28);cx.fill();
    }
  }cx.globalAlpha=1;
}
// Grid stipple within a circle
function gsCircle(cx2,cy2,r,colors,grid,threshold,scale){
  for(var gy=cy2-r;gy<cy2+r;gy+=grid){
    for(var gx=cx2-r;gx<cx2+r;gx+=grid){
      var dx=gx-cx2,dy=gy-cy2;if(dx*dx+dy*dy>r*r)continue;
      var nv=pn(gx*scale,gy*scale)*0.5+0.5;
      if(nv<threshold)continue;
      cx.fillStyle=pk(colors);cx.globalAlpha=0.3+nv*0.5;
      cx.beginPath();cx.arc(gx,gy,0.4+nv*2.5,0,6.28);cx.fill();
    }
  }cx.globalAlpha=1;
}

  deepBg:'#1A0A30',groundBase:'#180828'
};

var DKGREEN=['#0E1E14','#122418','#0C1A10'];
var LGREEN=['#46885A','#58A070','#4A9060','#509868'];

// ===== LEVEL DATA =====
var LEVELS=[
  {name:'暗夜',eng:'Night',sky:['#0A0418','#120820','#1E0C32','#2A1048','#1A0C28'],fog:'rgba(20,10,40,0.55)',particles:'stars',particleDensity:80,starBoost:1.2,ground1:'#181028',weather:null},
  {name:'拂晓',eng:'Dawn',sky:['#181028','#2A1848','#4A3070','#8A6080','#B89098'],fog:'rgba(180,140,160,0.2)',particles:'mist',particleDensity:30,starBoost:0.2,ground1:'#2A2040',weather:'mist'},
  {name:'迷雾',eng:'Mist',sky:['#1A1830','#282840','#3A3858','#585878','#787898'],fog:'rgba(120,130,160,0.5)',particles:'fog',particleDensity:60,starBoost:0,ground1:'#282840',weather:'fog'},
  {name:'金阳',eng:'Golden',sky:['#1A1030','#3A2050','#8A5070','#C89068','#E8C878'],fog:'rgba(200,160,100,0.2)',particles:'dust',particleDensity:20,starBoost:0,ground1:'#3A2850',weather:'dust'},
  {name:'阴云',eng:'Overcast',sky:['#181828','#282838','#3A3A4A','#585868','#787888'],fog:'rgba(120,120,140,0.4)',particles:'clouds',particleDensity:25,starBoost:0,ground1:'#282838',weather:'overcast'},
  {name:'雷暴',eng:'Storm',sky:['#0A0A18','#181028','#282040','#403060','#584878'],fog:'rgba(40,30,60,0.5)',particles:'lightning',particleDensity:40,starBoost:0.3,ground1:'#181028',weather:'storm'},
  {name:'尘暴',eng:'Dust',sky:['#1A1410','#2A2018','#483828','#685040','#887058'],fog:'rgba(130,100,80,0.45)',particles:'sand',particleDensity:50,starBoost:0,ground1:'#382820',weather:'sand'},
  {name:'暴雨',eng:'Monsoon',sky:['#080C18','#101828','#182440','#283860','#385080'],fog:'rgba(40,50,80,0.4)',particles:'rain',particleDensity:120,starBoost:0,ground1:'#101828',weather:'rain'},
  {name:'流星',eng:'Meteor',sky:['#0A0418','#120820','#1E0C32','#3A1850','#2A1048'],fog:'rgba(30,15,50,0.35)',particles:'meteors',particleDensity:50,starBoost:2.0,ground1:'#181028',weather:'meteor'},

];

// ===== WEATHER =====
var weatherParticles=[];
function initWeather(clv){
  weatherParticles=[];
  var lv=LEVELS[clv-1]||LEVELS[0],n=lv.particleDensity;
  for(var i=0;i<n;i++){
    var p={x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,life:1,maxLife:1,size:0.5+Math.random()*2};
    if(lv.weather==='rain'){p.vy=8+Math.random()*8;p.vx=-1+Math.random()*2;p.size=0.3+Math.random()*0.5;p.color='rgba(140,170,220,0.4)'}
    else if(lv.weather==='mist'||lv.weather==='fog'){p.vy=0.1+Math.random()*0.3;p.vx=-0.2+Math.random()*0.4;p.size=8+Math.random()*20;p.color='rgba(180,180,200,0.06)'}
    else if(lv.weather==='dust'||lv.weather==='sand'){p.vy=0.1+Math.random()*0.2;p.vx=0.5+Math.random()*1.5;p.size=2+Math.random()*5;p.color='rgba(180,140,100,0.08)'}
    else if(lv.weather==='storm'){p.vy=1+Math.random()*3;p.vx=-2+Math.random()*4;p.size=1+Math.random()*3;p.color='rgba(120,100,160,0.06)'}
    else if(lv.weather==='overcast'){p.vy=0.05+Math.random()*0.15;p.vx=-0.3+Math.random()*0.6;p.size=10+Math.random()*25;p.color='rgba(140,140,160,0.05)'}
    else if(lv.weather==='meteor'){p.x=Math.random()*W;p.y=-20-Math.random()*60;p.vy=4+Math.random()*6;p.vx=-1+Math.random()*2;p.size=0.8+Math.random()*1.5;p.color=C.bw;p.maxLife=0.3+Math.random()*0.5}
    else if(lv.weather==='sparkle'){p.vy=0;p.vx=0;p.size=1+Math.random()*2;p.color=C.petraGold;p.maxLife=2+Math.random()*4}
    weatherParticles.push(p);
  }
}
function updateWeather(dt){
  var lv=LEVELS[level-1]||LEVELS[0];
  for(var i=0;i<weatherParticles.length;i++){
    var p=weatherParticles[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.life-=dt;
    if(p.life<=0||p.y>H+50||p.x<-50||p.x>W+50){
      p.life=p.maxLife;p.x=Math.random()*W;
      if(lv.weather==='rain'||lv.weather==='meteor')p.y=-20-Math.random()*40;else p.y=Math.random()*H;
    }
  }
}

// ===== ITEMS (grid stipple) =====
function drawFood(x,y){var s=1.15;cx.save();cx.translate(x-5*s,y-7*s);
  gs2(1*s,2*s,8*s,7*s,['#B89060','#D4B080','#C8A070','#8B6840'],1.5,0.2,0.06,1);
  fs(C.petraGold);fr(0,0,10*s,2*s);fs('#6B5040');fr(0,8*s,10*s,1.8*s);cx.restore()}
function drawCoal(x,y){var s=1.25;cx.save();cx.translate(x-5*s,y-6*s);
  gs2(0,0,10*s,10*s,['#3A3048','#2A2038','#4A3A58'],1.5,0.2,0.06,1);
  cx.restore()}
function drawWater(x,y){var s=1.15;cx.save();cx.translate(x-5*s,y-7*s);
  gsCircle(5*s,5*s,5*s,['#588090','#88B8C8','#70A0B0','#385868'],1.5,0.2,0.06);
  fs('#4A6070');fr(3*s,-1.5*s,4*s,3*s);fs('#608898');fr(3.5*s,-2.8*s,3*s,1.8*s);
  cx.restore()}

  cx.restore()}

// ===== PLAYER (grid stipple silhouette) =====
function drawPlayer(px,py,t){
  var s=2.5;cx.save();cx.translate(px,py-30*s);var wind=Math.sin(t*1.2)*0.3*s,ol='#5A3890',fl='#F5F0F8';
  // Shadow
  cx.fillStyle='rgba(10,3,20,0.1)';cx.beginPath();cx.ellipse(0,30*s,5*s,1*s,0,0,6.28);cx.fill();
  // Balloon string
  for(var si=0;si<12;si++){var st=si/11,ssx=2*s+(5*s+wind-2*s)*st,ssy=-2*s-32*s*st+Math.sin(st*2)*2*s;
    cx.fillStyle='rgba(160,140,200,0.3)';cx.beginPath();cx.arc(ssx,ssy,0.6,0,6.28);cx.fill()}
  // Heart — grid stipple in heart area
  var hx=4*s+wind,hy=-35*s;
  gsCircle(hx,hy,8*s,['#6B3FA0','#5A2890','#7B50B0'],1.5,0.15,0.06);
  // Dress — white grid stipple
  gs(-6*s,0,12*s,22*s,[fl,fl,fl,'#EAE2F0'],2,0.18,0.05);
  // Purple outline along edge
  for(var oi=0;oi<50;oi++){var ot=oi/49,ox,oy;
    if(ot<0.35){ox=-4*s+(-4*s)*ot*3;oy=4*s+18*s*ot*3}
    else if(ot<0.7){var t2=(ot-0.35)*3;ox=-4*s+8*s*t2;oy=18*s-4*s*t2}
    else{var t3=(ot-0.7)*3;ox=4*s-1.5*s*t3;oy=14*s-10*s*t3}
    cx.fillStyle=ol;cx.globalAlpha=0.4;cx.beginPath();cx.arc(ox,oy,1+Math.random()*1.5,0,6.28);cx.fill()}cx.globalAlpha=1;
  // Torso
  gs(-4*s,-6*s,8*s,12*s,[fl,fl,'#EAE2F0'],2,0.2,0.06);
  // Head — circle grid
  gsCircle(1*s,-10.5*s,5.5*s,[fl,fl,'#EAE2F0'],1.8,0.2,0.06);
  // Hair — mixed purple+white
  gs(0,-14*s,10*s,6*s,[ol,fl,ol,fl],2,0.25,0.06);
  // Arms — purple dots
  var armReach=Math.sin(t*2)*0.3*s;
  gs(-3*s-armReach*0.5,-18*s+armReach*0.3,3*s,16*s,[ol],2,0.3,0.07);
  // Legs — purple
  var lp=t*4.5,llx=-2*s+Math.sin(lp)*4*s;
  gs(-2*s+llx*0.3,18*s,4*s,10*s,[ol],2,0.3,0.07);
  cx.restore();
}

  var idx=clv-1;if(idx<0)idx=0;if(idx>9)idx=9;var lv=LEVELS[idx];
  cx.fillStyle='#0A0418';cx.fillRect(0,0,W,H);

  gs(0,0,W,H*0.68,lv.sky.slice(1,4),3,0.2,0.028);
  // Stars
  if(lv.starBoost>0){var t=Date.now()/1000;for(var i=0;i<stars.length;i++){var s=stars[i];cx.fillStyle=s.c||C.bw;cx.globalAlpha=s.a*lv.starBoost*(0.4+0.6*Math.sin(t*s.ts+s.tw));cx.beginPath();cx.arc(s.x-cam*0.02,s.y,s.r,0,6.28);cx.fill()}cx.globalAlpha=1}

// ===== MAIN DRAW =====
function draw(){
  cx.clearRect(0,0,W,H);cx.fillStyle='#0A0418';cx.fillRect(0,0,W,H);
  if(phase===2){drawCamp(Date.now()/1000,level);drawVignette();return}
  drawSky(level);drawGround(level);drawSmoke();
  var t=Date.now()/1000;
  for(var ci=0;ci<cars.length;ci++){cars[ci].ci=ci;drawCar(cars[ci],cam,t)}
  for(var li=0;li<loot.length;li++){var l=loot[li];if(l.got)continue;var lx=l.x-cam;if(lx<-40||lx>W+40)continue;l.d.draw(lx,l.y)}
  drawPlayer(player.x-cam,player.y,t,level);
  for(var pi=0;pi<pts.length;pi++){var p=pts[pi];cx.globalAlpha=p.life/p.ml;fs(p.c);cx.beginPath();cx.moveTo(p.x-cam,p.y-p.s);cx.lineTo(p.x-cam+p.s,p.y);cx.lineTo(p.x-cam,p.y+p.s);cx.lineTo(p.x-cam-p.s,p.y);cx.closePath();cx.fill()}cx.globalAlpha=1;
  drawVignette();
}

function makeCars(){cars=[];for(var i=0;i<NC;i++){var cw=carW(),ch=carH();cars.push({x:i*cw,y:H*0.2,w:cw,h:ch,last:i===NC-1})}}
function spawnLoot(){loot=[];for(var i=0;i<NC;i++){var c=cars[i];var n=4+Math.floor(Math.random()*5);var biased=[ITEMS[0],ITEMS[0],ITEMS[1],ITEMS[2],ITEMS[2],ITEMS[3],ITEMS[4],ITEMS[5],ITEMS[6],ITEMS[7]];for(var j=0;j<n;j++){var d=biased[Math.floor(Math.random()*biased.length)];loot.push({x:c.x+20+Math.random()*(c.w-40),y:c.y+c.h*0.65-Math.random()*12,ci:i,d:d,got:false})}}}
function makeStars(){stars=[];for(var i=0;i<200;i++){var cols=[C.bw,C.bw,C.bw,C.bw,C.bw,C.bw,C.vapourViolet,'#D4B830'];stars.push({x:Math.random()*W,y:Math.random()*H*0.75,r:0.4+Math.random()*1.5,a:0.15+Math.random()*0.45,tw:Math.random()*6.28,ts:1+Math.random()*3,c:cols[Math.floor(Math.random()*cols.length)]})}}

// ===== LOGBOOK UI =====
var lb=document.getElementById('logbook'),lbDay=document.getElementById('lb-day'),lbContent=document.getElementById('lb-content'),lbDots=document.getElementById('lb-dots');
function showLogbook(){lb.classList.add('show');document.getElementById('ctrls').style.display='none';document.getElementById('hud').style.display='none';document.getElementById('inv').style.display='none';showLogPage()}
function hideLogbook(){lb.classList.remove('show')}
function showLogPage(){
  var lv=LEVELS[level-1];lbDay.textContent=lv.name+' · '+lv.eng+' · DAY '+(day-(level-2)*daysPerLevel);
  var dots='';for(var i=1;i<=4;i++)dots+='<div class=\"lb-dot'+(i===logPage?' active':'')+'\"></div>';lbDots.innerHTML=dots;
  if(showLevelIntro){lbContent.innerHTML='<div class=\"lb-title\">'+lv.name+'</div><div class=\"lb-text\" style=\"font-size:14px;color:#C4A8E0;letter-spacing:4px\">'+lv.eng+'</div><div class=\"lb-text\">'+lv.desc+'</div><div class=\"lb-res\"><span class=\"lb-ri\">🍞 '+res.food+'</span><span class=\"lb-ri\">💧 '+res.water+'</span><span class=\"lb-ri\">🔥 '+res.coal+'</span><span class=\"lb-ri\">🪨 '+res.iron+'</span><span class=\"lb-ri\">💊 '+res.meds+'</span></div><button class=\"lb-btn\" onclick=\"showLevelIntro=false;showLogPage()\">开始</button>';return}
  var pages=['配给','探索','引擎','事件'],title=pages[logPage-1],html='<div class=\"lb-title\">'+title+'</div>';
  if(logPage===1){
    var avail=crewHealth-(explorerAway?1:0);if(rationFood===0&&rationWater===0){rationFood=avail;rationWater=avail}
    html+='<div class=\"lb-text\">调配今日配给（'+avail+'人）</div>';
    html+='<div class=\"lb-res\"><span class=\"lb-ri'+(res.food<rationFood?' low':'')+'\">🍞 库存 '+res.food+'</span><span class=\"lb-ri'+(res.water<rationWater?' low':'')+'\">💧 库存 '+res.water+'</span></div>';
    html+='<div style=\"display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0\"><button class=\"lb-btn\" style=\"padding:14px 22px;font-size:22px;min-width:56px\" onclick=\"rationFood=Math.max(0,rationFood-1);showLogPage()\">−1</button><span style=\"color:#C4A8E0;font-size:24px;min-width:80px;text-align:center\">🍞 ×'+rationFood+'</span><button class=\"lb-btn\" style=\"padding:14px 22px;font-size:22px;min-width:56px\" onclick=\"rationFood=Math.min(res.food,rationFood+1);showLogPage()\">+1</button></div>';
    html+='<div style=\"display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0\"><button class=\"lb-btn\" style=\"padding:14px 22px;font-size:22px;min-width:56px\" onclick=\"rationWater=Math.max(0,rationWater-1);showLogPage()\">−1</button><span style=\"color:#C4A8E0;font-size:24px;min-width:80px;text-align:center\">💧 ×'+rationWater+'</span><button class=\"lb-btn\" style=\"padding:14px 22px;font-size:22px;min-width:56px\" onclick=\"rationWater=Math.min(res.water,rationWater+1);showLogPage()\">+1</button></div>';
    html+='<button class=\"lb-btn warn\" onclick=\"skipRation()\">跳过 · 不给吃喝</button>';
    if(res.food<rationFood||res.water<rationWater)html+='<div class=\"lb-text\" style=\"color:#E898A8\">库存不足！</div>';
    html+='<button class=\"lb-btn\" onclick=\"doConsume()\">确认配给</button>';
  }else if(logPage===2){
    if(explorerAway){html+='<div class=\"lb-text\">🚶 有人在外探索中<br/>预计第'+explorerReturnDay+'天归来</div><button class=\"lb-btn\" onclick=\"logPage=3;showLogPage()\">继续</button>'}
    else{html+='<div class=\"lb-text\">派一人外出搜索<br/>离开'+crewHealth+'人，将离开1~6天</div><button class=\"lb-btn\" onclick=\"startExplore()\">出发探索</button>'}
  }else if(logPage===3){
    html+='<div class=\"lb-text\">给火车头供给燃料</div><div class=\"lb-res\"><span class=\"lb-ri'+(res.coal<1?' low':'')+'\">🔥 煤炭 '+res.coal+'</span><span class=\"lb-ri'+(res.water<1?' low':'')+'\">💧 水 '+res.water+'</span></div><button class=\"lb-btn\" onclick=\"tendEngine(1)\">投入 1🔥 + 1💧</button><button class=\"lb-btn\" style=\"opacity:0.4;font-size:10px\" onclick=\"tendEngine(0)\">跳过</button>';
  }else if(logPage===4){
    if(explorerFound.length>0&&!explorerAway){
      if(explorerFound[0].icon==='💀'){html+='<div class=\"lb-text\" style=\"color:#E898A8\">💀 探索者未能归来…</div>'}
      else{html+='<div class=\"lb-text\">🚶 探索者归队！</div><div class=\"lb-res\">';for(var ef=0;ef<explorerFound.length;ef++){var f=explorerFound[ef];html+='<span class=\"lb-ri\">'+f.icon+' '+f.name+' +'+f.amt+'</span>'}html+='</div>'}
      explorerFound=[];html+='<button class=\"lb-btn\" onclick=\"endDay()\">确认</button>';
    }else if(!eventToday){html+='<div class=\"lb-text\">今日平安无事</div><button class=\"lb-btn\" onclick=\"endDay()\">结束这一天</button>'}
    else if(eventToday.type==='breakdown'){html+='<div class=\"lb-text\">⚙️ 火车头故障！<br/>需要铁片修理</div><div class=\"lb-res\"><span class=\"lb-ri'+(res.iron<1?' low':'')+'\">🪨 铁片 '+res.iron+'</span></div><button class=\"lb-btn\" onclick=\"fixB()\">用铁片修理</button><button class=\"lb-btn warn\" onclick=\"skipE()\">没有铁片</button>'}
    else if(eventToday.type==='mice'){var loss=eventToday.loss||2;html+='<div class=\"lb-text\">🐭 仓里进老鼠了！</div><div class=\"lb-res\"><span class=\"lb-ri low\">🍞 -'+loss+'</span></div>';if(res.meds>0)html+='<button class=\"lb-btn\" onclick=\"cureM()\">用药驱鼠 💊</button>';html+='<button class=\"lb-btn\" onclick=\"resolveE()\">知道了…</button>'}
    else if(eventToday.type==='sick'){html+='<div class=\"lb-text\">🤒 有人生病了！</div><button class=\"lb-btn\" onclick=\"healS()\">使用医药箱</button><button class=\"lb-btn warn\" onclick=\"skipE()\">没有药</button>'}
    else if(eventToday.type==='rain'){html+='<div class=\"lb-text\">🌧️ 今天下大雨</div><button class=\"lb-btn\" onclick=\"resolveE()\">在车里休息</button>'}
    else if(eventToday.type==='luck'){html+='<div class=\"lb-text\">🍀 好运降临！</div><div class=\"lb-res\"><span class=\"lb-ri\">🍞 +2</span><span class=\"lb-ri\">💧 +1</span><span class=\"lb-ri\">🔥 +1</span></div><button class=\"lb-btn\" onclick=\"resolveE()\">收下</button>'}
    else if(eventToday.type==='bandit'){var st=eventToday.stolen||{food:Math.min(res.food,2),water:Math.min(res.water,2)};eventToday.stolen=st;html+='<div class=\"lb-text\">🔫 强盗来袭！</div><div class=\"lb-res\"><span class=\"lb-ri low\">🍞 -'+st.food+'</span><span class=\"lb-ri low\">💧 -'+st.water+'</span></div>';if(res.gear>0&&res.ammo>0)html+='<button class=\"lb-btn\" onclick=\"fightB()\">开枪反击！</button>';html+='<button class=\"lb-btn warn\" onclick=\"resolveE()\">无可奈何…</button>'}
    else if(eventToday.type==='choice'){if(eventToday.subtype==='supplies'){html+='<div class=\"lb-text\">📦 发现废弃补给箱</div><button class=\"lb-btn\" onclick=\"doChoice(true)\">打开箱子</button><button class=\"lb-btn warn\" onclick=\"doChoice(false)\">安全绕开</button>'}else{html+='<div class=\"lb-text\">🧑 路边陌生人求救</div><button class=\"lb-btn\" onclick=\"doChoice(true)\">伸出援手</button><button class=\"lb-btn warn\" onclick=\"doChoice(false)\">不理他</button>'}}
  }
  lbContent.innerHTML=html;
}

// ===== PHASE 2 ACTIONS =====
function skipRation(){rationFood=0;rationWater=0;var a=crewHealth-(explorerAway?1:0);if(a>0&&Math.random()<0.3)crewHealth--;if(crewHealth<=0){endP2(false,'全员饥渴而亡');return}logPage=2;showLogPage()}
function doConsume(){var a=crewHealth-(explorerAway?1:0),nf=rationFood||a,nw=rationWater||a,ate=Math.min(res.food,nf),dr=Math.min(res.water,nw);res.food-=ate;res.water-=dr;if(ate<a||dr<a){if(Math.random()<0.3)crewHealth--}if(crewHealth<=0){endP2(false,'配给不足');return}rationFood=0;rationWater=0;logPage=2;showLogPage()}
function startExplore(){explorerAway=true;explorerReturnDay=day+1+Math.floor(Math.random()*6);explorerFound=[];logPage=3;showLogPage()}
function tendEngine(n){if(n>0&&res.coal>=1&&res.water>=1){res.coal-=1;res.water-=1;distance+=22+Math.floor(Math.random()*6)}else if(n>0){if(Math.random()<0.3){crewHealth--;if(crewHealth<=0){endP2(false,'锅炉熄火');return}}distance+=8+Math.floor(Math.random()*5)}else{distance+=8+Math.floor(Math.random()*5)}logPage=4;rollEvent();showLogPage()}
function rollEvent(){var r=Math.random(),lv=level;if(lv===2){if(r<0.15)eventToday={type:'luck'};else if(r<0.25)eventToday={type:'choice',subtype:'supplies'};else if(r<0.32)eventToday={type:'mice',loss:1};else eventToday=null;return}if(lv===3){if(r<0.1)eventToday={type:'luck'};else if(r<0.18)eventToday={type:'mice',loss:1+Math.floor(Math.random()*2)};else if(r<0.22)eventToday={type:'sick'};else eventToday=null;return}if(lv===8){if(r<0.45)eventToday={type:'rain'};else if(r<0.6)eventToday={type:'breakdown'};else if(r<0.72)eventToday={type:'bandit'};else if(r<0.82)eventToday={type:'mice',loss:2+Math.floor(Math.random()*2)};else if(r<0.9)eventToday={type:'sick'};else eventToday=null;return}if(lv===9){if(r<0.2)eventToday={type:'breakdown'};else if(r<0.35)eventToday={type:'bandit'};else if(r<0.5)eventToday={type:'mice',loss:2+Math.floor(Math.random()*3)};else if(r<0.65)eventToday={type:'sick'};else if(r<0.72)eventToday={type:'rain'};else eventToday=null;return}if(lv===10){if(r<0.25)eventToday={type:'breakdown'};else if(r<0.45)eventToday={type:'bandit'};else if(r<0.6)eventToday={type:'sick'};else if(r<0.72)eventToday={type:'mice',loss:3+Math.floor(Math.random()*3)};else if(r<0.8)eventToday={type:'rain'};else eventToday={type:'luck'};return}if(r<0.12)eventToday={type:'breakdown'};else if(r<0.22)eventToday={type:'choice',subtype:Math.random()<0.5?'supplies':'stranger'};else if(r<0.34)eventToday={type:'bandit'};else if(r<0.44)eventToday={type:'mice',loss:1+Math.floor(Math.random()*3)};else if(r<0.52)eventToday={type:'sick'};else if(r<0.6)eventToday={type:'rain'};else if(r<0.7)eventToday={type:'luck'};else eventToday=null}
function fixB(){if(res.iron>=1){res.iron-=1;eventToday=null;endDay()}else skipE()}
function healS(){if(res.meds>=1){res.meds-=1;eventToday=null;endDay()}else skipE()}
function skipE(){if(eventToday&&eventToday.type==='sick'){crewHealth--;if(crewHealth<=0){endP2(false,'病重不治');return}}eventToday=null;endDay()}
function fightB(){res.ammo--;eventToday=null;if(Math.random()<0.7){var loot2=[];if(Math.random()<0.6){res.iron+=2;loot2.push('🪨铁片×2')}if(Math.random()<0.6){res.water+=3;loot2.push('💧水×3')}if(loot2.length===0){res.food+=2;loot2.push('🍞食物×2')}explorerFound=loot2.map(function(s){var p=s.split('×');return{name:p[0].slice(2),icon:p[0].slice(0,2),amt:parseInt(p[1])}});endDay()}else{res.food=Math.max(0,res.food-2);res.water=Math.max(0,res.water-2);endDay()}}
function cureM(){res.meds--;eventToday=null;endDay()}
function doChoice(take){var sub=eventToday?eventToday.subtype:'supplies';eventToday=null;if(take){if(Math.random()<0.65){if(sub==='supplies'){res.food+=3;res.water+=2;res.coal+=2}else{res.food+=2;res.water+=2;res.iron+=1}endDay()}else{res.food=Math.max(0,res.food-3);res.water=Math.max(0,res.water-2);if(Math.random()<0.3)crewHealth--;if(crewHealth<=0){endP2(false,'全员覆没');return}endDay()}}else{endDay()}}
function resolveE(){if(eventToday&&eventToday.type==='mice')res.food=Math.max(0,res.food-eventToday.loss);if(eventToday&&eventToday.type==='luck'){res.food+=2;res.water+=1;res.coal+=1}if(eventToday&&eventToday.type==='bandit'&&eventToday.stolen){res.food=Math.max(0,res.food-eventToday.stolen.food);res.water=Math.max(0,res.water-eventToday.stolen.water)}eventToday=null;endDay()}
function calcScore(){score=Math.floor(distance*0.5+res.food*10+res.water*8+res.coal*5+res.iron*15+res.wood*8+crewHealth*200+res.gear*30+res.ammo*20);return score>800?'S':score>600?'A':score>400?'B':score>200?'C':'D'}
function endDay(){day++;if(explorerAway&&day>=explorerReturnDay){explorerAway=false;if(Math.random()<0.15){crewHealth--;explorerFound=[{name:'未归',icon:'💀',amt:0}]}else{var types=[{n:'铁片',icon:'🪨',k:'iron'},{n:'煤炭',icon:'🔥',k:'coal'},{n:'水',icon:'💧',k:'water'},{n:'木材',icon:'🪵',k:'wood'},{n:'食物',icon:'🍞',k:'food'},{n:'子弹',icon:'🔫',k:'ammo2'},{n:'猎枪',icon:'🔫',k:'gear2'},{n:'收音机',icon:'📻',k:'comm2'},{n:'棋盘',icon:'♟️',k:'chess2'}];explorerFound=[];var fc=2+Math.floor(Math.random()*3);for(var fi=0;fi<fc;fi++){var t=types[Math.floor(Math.random()*types.length)];var amt=1+Math.floor(Math.random()*3);if(!t.k.endsWith('2'))res[t.k]=(res[t.k]||0)+amt;else if(t.k==='gear2')res.gear=(res.gear||0)+amt;else if(t.k==='ammo2')res.ammo=(res.ammo||0)+amt;explorerFound.push({name:t.n,icon:t.icon,amt:amt})}}if(crewHealth<=0){endP2(false,'探索者未归');return}}if(distance>=goalDistance){endP2(true,'提前抵达远方！');return}if(level>=2&&(day-(level-2)*daysPerLevel)>daysPerLevel){level++;initWeather(level);if(level>10){endP2(true,'抵达远方！');return}showLevelIntro=true}logPage=1;eventToday=null;showLogPage()}
function endP2(win,msg){phase=3;hideLogbook();var rating=calcScore();document.getElementById('over').classList.add('show');document.getElementById('ot').textContent=win?'✦ 抵达':'✧ 中断';document.getElementById('os').innerHTML=msg+'<br/>评分: '+rating+' ('+score+'分)<br/>距离: '+Math.floor(distance)+'km · 存活: '+crewHealth+'人';document.getElementById('ctrls').style.display='none'}

// ===== PHASE 1 LOGIC =====
function updInv(){var h='';for(var i=0;i<ITEMS.length;i++)h+='<span class=iv>'+inv[ITEMS[i].k]+' '+ITEMS[i].n+'</span>';document.getElementById('inv').innerHTML=h}
function rst(){phase=1;level=1;showLevelIntro=false;time=60;st='play';inv={food:0,coal:0,water:0,gear:0,ammo:0,comm:0,chess:0,med:0};inLast=false;dc=0;pts=[];loot=[];crewFound=[false,false,false,false,false,false];crewCount=0;makeCars();spawnLoot();makeStars();player.x=carW()/2;cam=0;document.getElementById('over').classList.remove('show');document.getElementById('warn').style.opacity='0';document.getElementById('hint').style.opacity='1';document.getElementById('ctrls').style.display='flex';document.getElementById('hud').style.display='flex';document.getElementById('inv').style.display='flex';hideLogbook();updInv();var lv=LEVELS[0];document.getElementById('lv').textContent=lv.name+' · '+lv.eng}
function gameOverP1(win){st='end';document.getElementById('over').classList.add('show');if(win){startPhase2();return}document.getElementById('ot').textContent='未抵达';document.getElementById('os').textContent='未能抵达最后一节车厢';document.getElementById('ctrls').style.display='none'}
function collect(it){if(it.got)return;it.got=true;inv[it.d.k]++;updInv();for(var i=0;i<8;i++)pts.push({x:it.x,y:it.y,vx:(Math.random()-0.5)*2.5,vy:-2-Math.random()*2.5,life:22,ml:22,c:it.d.c,s:1.5+Math.random()*2})}
function pickup(){for(var i=0;i<loot.length;i++){var l=loot[i];if(l.got)continue;if(Math.abs(player.x-l.x)<38&&Math.abs(player.y-l.y)<44)collect(l)}}
function startPhase2(){phase=2;st='play';level=2;showLevelIntro=true;res.food=inv.food;res.water=inv.water;res.coal=inv.coal;res.meds=inv.med;res.wood=0;res.iron=0;res.gear=inv.gear||0;res.ammo=inv.ammo||0;crewHealth=crewCount;day=1;logPage=1;distance=0;showLogbook()}
function up(dt){if(phase===2){pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return}if(st!=='play'){pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return}time-=dt;if(time<0)time=0;document.getElementById('tm').textContent=Math.ceil(time)+'s';if(time<8)document.getElementById('hint').style.opacity='0';if(time<=0){gameOverP1(false);return}var dx=joyX;if(keys[37]||keys[65])dx=-1;if(keys[39]||keys[68])dx+=1;player.x+=dx*5*60*dt;player.x=Math.max(8,Math.min(cars[NC-1].x+cars[NC-1].w-8,player.x));var ci=Math.floor(player.x/carW());if(ci>=0&&ci<NC)player.y=cars[ci].y+cars[ci].h*0.65;if([0,2,4].indexOf(ci)>=0&&!crewFound[ci]){crewFound[ci]=true;crewCount++;var c2=cars[ci];loot.push({x:c2.x+c2.w*0.3,y:c2.y+c2.h*0.65,ci:ci,d:ITEMS[0],got:false});loot.push({x:c2.x+c2.w*0.6,y:c2.y+c2.h*0.65,ci:ci,d:ITEMS[2],got:false});document.getElementById('warn').style.opacity='1';document.getElementById('warn').innerHTML='找到同伴！（'+crewCount+'/3）';setTimeout(function(){document.getElementById('warn').style.opacity='0'},1500)}cam=player.x-W/2;cam=Math.max(0,Math.min(cars[NC-1].x+cars[NC-1].w-W,cam));var inL=ci===NC-1;if(inL&&!inLast){inLast=true;dc=0;document.getElementById('warn').style.opacity='1'}if(inL&&inLast){dc+=dt;document.getElementById('warn').innerHTML='最后一节<br>停留3秒过关';if(dc>=3)gameOverP1(true)}if(!inL&&inLast){inLast=false;dc=0;document.getElementById('warn').style.opacity='0'}pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0})}

// ===== INPUT =====
var joyX=0,joyActive=false,joyOX=0,joyOY=0,keys={},joy=document.getElementById('joy'),stick=document.getElementById('stick');
function joyMove(cx,cy){var r=joy.getBoundingClientRect();var dx=cx-r.left,dy=cy-r.top;if(!joyActive){joyOX=dx;joyOY=dy;joyActive=true}var mx=dx-joyOX,my=dy-joyOY;var d=Math.sqrt(mx*mx+my*my);if(d>30){mx=mx/d*30;my=my/d*30}stick.style.left=(28+mx)+'px';stick.style.top=(28+my)+'px';joyX=mx/30}
function joyEnd(){joyActive=false;joyX=0;stick.style.left='28px';stick.style.top='28px'}
joy.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY)});
joy.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY)});
joy.addEventListener('touchend',function(e){e.preventDefault();joyEnd()});
joy.addEventListener('touchcancel',function(e){e.preventDefault();joyEnd()});
joy.addEventListener('mousedown',function(e){e.preventDefault();joyMove(e.clientX,e.clientY)});
window.addEventListener('mousemove',function(e){if(joyActive)joyMove(e.clientX,e.clientY)});
window.addEventListener('mouseup',function(){if(joyActive)joyEnd()});
document.getElementById('pick').addEventListener('touchstart',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup()});
document.getElementById('pick').addEventListener('mousedown',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup()});
window.addEventListener('keydown',function(e){keys[e.keyCode]=true;if(e.keyCode===32&&st==='play'&&phase===1){e.preventDefault();pickup()}});
window.addEventListener('keyup',function(e){keys[e.keyCode]=false});

// ===== START =====
makeCars();spawnLoot();makeStars();initWeather(1);updInv();player.x=carW()/2;
var lt=0;
(function loop(ts){var dt=lt?Math.min((ts-lt)/1000,0.1):0.016;lt=ts;if(st==='play'){updateWeather(dt)};up(dt);draw();requestAnimationFrame(loop)})(0);
</script>
