<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NIGHT TRAIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#12061E;overflow:hidden;font-family:system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:fixed}
#wrap{position:relative;width:100vw;height:100vh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;background:#12061E;border-radius:6px;max-width:100vw;max-height:56vh;border:1px solid rgba(107,48,160,0.25)}
#styletog{position:absolute;top:9px;right:14px;z-index:12;background:rgba(18,6,30,0.85);border:1px solid rgba(232,152,168,0.25);border-radius:3px;color:#E898A8;font-size:9px;padding:4px 10px;letter-spacing:1.5px;cursor:pointer;font-weight:300}
#hud{position:absolute;top:10px;left:12px;right:60px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.hb{background:rgba(18,6,30,0.9);border:1px solid rgba(107,48,160,0.2);border-radius:3px;padding:5px 12px;font-size:11px;color:#B496D2;letter-spacing:1.8px;font-weight:300}
#inv{position:absolute;bottom:84px;left:10px;right:10px;display:flex;gap:5px;justify-content:center;pointer-events:none;z-index:10;flex-wrap:wrap}
.iv{background:rgba(18,6,30,0.9);border:1px solid rgba(155,139,176,0.15);border-radius:3px;padding:3px 8px;font-size:8.5px;color:#9B8BB0}
#ctrls{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;z-index:10}
#joy{width:96px;height:96px;background:radial-gradient(circle at 35% 35%,rgba(42,37,53,0.4),rgba(18,6,30,0.6));border:1.5px solid rgba(107,48,160,0.18);border-radius:50%;position:relative;touch-action:none}
#stick{width:40px;height:40px;background:radial-gradient(circle at 40% 40%,rgba(196,168,224,0.3),rgba(110,95,133,0.15));border:1px solid rgba(155,139,176,0.35);border-radius:50%;position:absolute;top:28px;left:28px;pointer-events:none}
#pick{width:60px;height:60px;background:linear-gradient(135deg,rgba(155,184,168,0.12),rgba(90,110,100,0.06));border:1.5px solid rgba(125,155,139,0.25);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(155,184,168,0.6);margin-bottom:18px;touch-action:none}
#pick:active{background:rgba(125,155,139,0.22)}
#hint{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);color:rgba(155,139,176,0.25);font-size:9px;letter-spacing:2.5px;pointer-events:none;z-index:5;font-weight:200}
#warn{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);color:#E898A8;font-size:12px;letter-spacing:2px;pointer-events:none;z-index:5;opacity:0;text-align:center;font-weight:300}
#logbook{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:30;background:linear-gradient(180deg,rgba(10,2,20,0.97),rgba(20,5,35,0.95));border-radius:6px;padding:20px 16px;border:1px solid rgba(58,48,64,0.3)}
#logbook.show{display:flex}
.lb-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lb-day{font-size:12px;color:#C4A8E0;letter-spacing:2px;font-weight:200}
.lb-dots{display:flex;gap:7px}
.lb-dot{width:6px;height:6px;border-radius:50%;background:rgba(155,139,176,0.12)}
.lb-dot.active{background:#C4A8E0}
.lb-content{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.lb-title{font-size:11px;color:#8B7BA0;letter-spacing:3px;margin-bottom:10px;font-weight:300}
.lb-text{font-size:10.5px;color:#9B8BB0;line-height:1.8;margin-bottom:14px;max-width:280px;font-weight:300}
.lb-res{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.lb-ri{font-size:9.5px;color:#7D9B8B;background:rgba(125,155,139,0.06);border:1px solid rgba(125,155,139,0.15);border-radius:3px;padding:4px 10px;letter-spacing:1px}
.lb-ri.low{color:#E898A8;border-color:rgba(232,152,168,0.2)}
.lb-btn{background:linear-gradient(180deg,rgba(125,155,139,0.1),rgba(90,110,100,0.04));border:1px solid rgba(125,155,139,0.22);color:#B496D2;padding:11px 28px;border-radius:4px;font-size:11px;letter-spacing:2px;cursor:pointer;font-weight:300;margin:4px}
.lb-btn:active{background:rgba(125,155,139,0.2)}
.lb-btn.warn{background:linear-gradient(180deg,rgba(232,152,168,0.08),rgba(180,100,120,0.03));border-color:rgba(232,152,168,0.22);color:#E898A8}
#over{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:linear-gradient(180deg,rgba(8,2,18,0.98),rgba(18,6,32,0.96));border-radius:6px}
#over.show{display:flex}
.ot{font-size:16px;color:#C4A8E0;letter-spacing:4px;margin-bottom:6px;font-weight:200}
.os{font-size:10px;color:#9B8BB0;margin-bottom:16px;font-weight:300;line-height:1.7;text-align:center}
.btn{background:linear-gradient(180deg,rgba(125,155,139,0.1),rgba(90,110,100,0.04));border:1px solid rgba(125,155,139,0.2);color:#B496D2;padding:10px 26px;border-radius:4px;font-size:11px;letter-spacing:2px;cursor:pointer}
.btn:active{background:rgba(125,155,139,0.2)}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g"></canvas>
<button id="styletog" onclick="toggleStyle()">◈ 晶层</button>
<div id="hud"><span class="hb" id="tm">60s</span><span class="hb" id="lv">第1关</span></div>
<div id="inv"></div>
<div id="hint">拖动摇杆 · 点击拾取</div>
<div id="warn"></div>
<div id="ctrls"><div id="joy"><div id="stick"></div></div><div id="pick">◈</div></div>
<div id="logbook"><div class="lb-header"><span class="lb-day" id="lb-day"></span><div class="lb-dots" id="lb-dots"></div></div><div class="lb-content" id="lb-content"></div><div class="lb-nav" id="lb-nav"></div></div>
<div id="over"><div class="ot" id="ot"></div><div class="os" id="os"></div><button class="btn" onclick="rst()">重返</button></div>
</div>
<script>
// ===== SETUP =====
var g=document.getElementById('g'), cx=g.getContext('2d');
var W,H;
function resize(){W=Math.min(window.innerWidth-12,500);H=Math.min(window.innerHeight*0.54,600);g.width=W;g.height=H;}
resize();

// ===== CORPUS COLORS =====
var C={
  nightDeep:'#12061E',tucana:'#4E1D73',tucanaLight:'#6B30A0',
  fameGreen:'#7D9B8B',fameDark:'#5C7A6C',fameLight:'#9BB8A8',fameDeep:'#4A6B5A',
  bw:'#F0EBF5',bg:'#9B8BB0',bgDark:'#6E5F85',
  dustyCoral:'#E898A8',petraGold:'#C0A060',vapourViolet:'#C4A8E0',
  coach:'#D4B830',
  pvdDark:'#1A1622',pvdMid:'#2A2535',pvdEdge:'#3A3040',
  deepBg:'#1A0A30',groundBase:'#180828'
};

// ===== HELPERS =====
function fr(x,y,w,h){cx.fillRect(x,y,w,h)}
function fa(x,y,r){cx.beginPath();cx.arc(x,y,r,0,6.28);cx.fill()}
function fs(c){cx.fillStyle=c}
function ss(c,w){cx.strokeStyle=c;cx.lineWidth=w||0.8}

// ===== LEVEL DATA =====
var LEVELS=[
  {name:'夜行',eng:'Night Run',desc:'暗夜列车上奔跑收集物资',
   sky:['#12061E','#1A0830','#2A1048','#4E1D73','#6B30A0','#3A2050','#1A0C28'],ground:'#180828',starBoost:1.0},
  {name:'拂晓',eng:'First Light',desc:'熟悉营地生活·轻松开局',
   sky:['#1A0C28','#2A1840','#4A2868','#7A5088','#B090A0','#C8B0A8','#A09088'],ground:'#2A1830',starBoost:0.25},
  {name:'探索',eng:'Expedition',desc:'外出搜索资源·晨光熹微',
   sky:['#1E1230','#3A2850','#6A5080','#9B7BA0','#B8A0B0','#C8B8B8','#A89890'],ground:'#302038',starBoost:0.15},
  {name:'采集',eng:'Gathering',desc:'储备食物和水·午后暖阳',
   sky:['#2A1A30','#5A3850','#8B6070','#C8A878','#D4B888','#C0A070','#908068'],ground:'#3A2840',starBoost:0},
  {name:'维护',eng:'Maintenance',desc:'火车头需要更多照料·阴云',
   sky:['#1E1428','#3A2848','#5A4070','#7A6088','#8B7898','#7A6888','#504058'],ground:'#221830',starBoost:0.05},
  {name:'危机',eng:'Crisis',desc:'危险事件增加·风暴将至',
   sky:['#100818','#1E1030','#3A2050','#5A3080','#7A40A0','#603878','#301840'],ground:'#1A1028',starBoost:0.1},
  {name:'坚守',eng:'Hold Fast',desc:'资源紧缺·坚持住·尘暴',
   sky:['#1C1420','#382838','#584050','#786058','#908070','#706858','#403830'],ground:'#2A2030',starBoost:0},
  {name:'暴雨',eng:'Monsoon',desc:'雨季来临·难以外出',
   sky:['#0A1020','#122038','#183050','#284868','#305878','#284868','#182838'],ground:'#101828',starBoost:0},
  {name:'冲刺',eng:'Final Push',desc:'最后冲刺·放手一搏',
   sky:['#12061E','#1E0C32','#2A1048','#4E1D73','#6B30A0','#3A2050','#1A0C28'],ground:'#180828',starBoost:1.5},
  {name:'终点',eng:'Arrival',desc:'最后的5天·抵达远方',
   sky:['#1A0C28','#3A1850','#7A4080','#C8A878','#D4B888','#E8D0A0','#B8A878'],ground:'#3A2840',starBoost:0.1}
];

// ===== ITEMS =====
function drawFood(x,y){var s=1.1;cx.save();cx.translate(x-5*s,y-7*s);fs('rgba(30,10,50,0.3)');fa(5*s,10*s,5*s);fs('rgba(160,130,90,0.3)');fr(1*s,1*s,8*s,8*s);ss(C.petraGold,1*s);cx.strokeRect(1*s,1*s,8*s,8*s);fs('rgba(180,150,110,0.5)');fr(0,0,10*s,2*s);fr(0,8*s,10*s,2*s);ss(C.petraGold,0.6*s);cx.strokeRect(0,0,10*s,2*s);cx.strokeRect(0,8*s,10*s,2*s);cx.restore()}
function drawCoal(x,y){var s=1.2;cx.save();cx.translate(x-4*s,y-6*s);fs('rgba(30,10,50,0.3)');fa(5*s,9*s,5*s);fs('rgba(70,60,80,0.4)');cx.beginPath();cx.moveTo(5*s,0);cx.lineTo(9*s,2*s);cx.lineTo(10*s,5*s);cx.lineTo(8*s,9*s);cx.lineTo(4*s,10*s);cx.lineTo(0,7*s);cx.lineTo(1*s,3*s);cx.closePath();cx.fill();ss('rgba(155,139,176,0.5)',1*s);cx.stroke();cx.restore()}
function drawWater(x,y){var s=1.1;cx.save();cx.translate(x-5*s,y-7*s);fs('rgba(30,10,50,0.3)');fa(5*s,10*s,5*s);fs('rgba(100,135,160,0.22)');cx.beginPath();cx.arc(5*s,5*s,5*s,0,6.28);cx.fill();ss(C.fameGreen,1*s);cx.stroke();fs('rgba(125,155,139,0.3)');fr(3.5*s,-1*s,3*s,3*s);fs('rgba(155,180,165,0.45)');fr(3*s,-2.5*s,4*s,2*s);cx.restore()}
function drawGun(x,y){var s=1.2;cx.save();cx.translate(x-6*s,y-5*s);fs('rgba(30,10,50,0.3)');fa(6*s,9*s,5*s);fs('rgba(110,100,130,0.4)');fr(2*s,1*s,8*s,3*s);ss(C.bgDark,0.8*s);cx.strokeRect(2*s,1*s,8*s,3*s);fs('rgba(70,60,90,0.5)');fr(10*s,1.5*s,1.5*s,2*s);fs('rgba(100,90,120,0.38)');fr(1*s,3.5*s,5*s,5*s);fs('rgba(90,80,110,0.32)');fr(2.5*s,7.5*s,4*s,3*s);cx.restore()}
function drawRadio(x,y){var s=1.1;cx.save();cx.translate(x-7*s,y-6*s);fs('rgba(30,10,50,0.3)');fa(7*s,9*s,6*s);fs('rgba(130,115,90,0.28)');fr(1*s,1*s,12*s,9*s);ss('#9B8B70',1*s);cx.strokeRect(1*s,1*s,12*s,9*s);ss('rgba(155,139,112,0.35)',0.4*s);for(var i=0;i<5;i++){cx.beginPath();cx.moveTo(2*s,3*s+i*1.5*s);cx.lineTo(7*s,3*s+i*1.5*s);cx.stroke()}fs('rgba(50,45,35,0.5)');fr(8*s,2.5*s,4*s,4*s);fs('rgba(155,139,112,0.38)');fa(9*s,8*s,1.2*s);fa(11.5*s,8*s,1.2*s);ss('#9B8B70',0.8*s);cx.beginPath();cx.moveTo(7*s,1*s);cx.lineTo(7*s,-3*s);cx.stroke();fs('rgba(155,139,112,0.45)');fa(7*s,-3*s,1*s);cx.restore()}
function drawMed(x,y){var s=1.2;cx.save();cx.translate(x-5*s,y-5*s);fs('rgba(30,10,50,0.3)');fa(5*s,9*s,5*s);fs('rgba(180,105,120,0.22)');fr(0,1*s,10*s,9*s);ss(C.dustyCoral,1*s);cx.strokeRect(0,1*s,10*s,9*s);fs('rgba(190,108,122,0.45)');fr(3.5*s,2.5*s,3*s,6*s);fr(1.5*s,4.5*s,7*s,3*s);cx.restore()}
function drawAmmo(x,y){var s=1.1;cx.save();cx.translate(x-4*s,y-5*s);fs('rgba(30,10,50,0.3)');fa(4*s,8*s,4*s);fs('rgba(180,140,80,0.35)');fr(0,1*s,8*s,6*s);ss(C.petraGold,0.8*s);cx.strokeRect(0,1*s,8*s,6*s);fs('rgba(192,160,96,0.5)');for(var bi=0;bi<3;bi++){fr(1.5*s+bi*2*s,2*s,1*s,4*s)}cx.restore()}
function drawChess(x,y){var s=1.1;cx.save();cx.translate(x-5*s,y-6*s);fs('rgba(30,10,50,0.3)');fa(5*s,9*s,5*s);fs('rgba(120,100,80,0.4)');fr(0,0,10*s,8*s);ss('#8B7060',1*s);cx.strokeRect(0,0,10*s,8*s);ss('rgba(139,112,96,0.25)',0.3*s);for(var gi=1;gi<4;gi++){cx.beginPath();cx.moveTo(gi*2.5*s,0);cx.lineTo(gi*2.5*s,8*s);cx.stroke();cx.beginPath();cx.moveTo(0,gi*2*s);cx.lineTo(10*s,gi*2*s);cx.stroke()}fs('rgba(30,20,25,0.5)');fa(2*s,2*s,1*s);fa(7*s,2*s,1*s);fs('rgba(220,200,180,0.4)');fa(2*s,6*s,1*s);fa(7*s,6*s,1*s);cx.restore()}
var ITEMS=[
  {k:'food',n:'补给',c:C.petraGold,draw:drawFood},{k:'coal',n:'煤炭',c:'#5a4a60',draw:drawCoal},
  {k:'water',n:'净水',c:C.fameGreen,draw:drawWater},{k:'gear',n:'猎枪',c:C.bg,draw:drawGun},
  {k:'ammo',n:'子弹',c:C.petraGold,draw:drawAmmo},{k:'comm',n:'电台',c:'#9B8B70',draw:drawRadio},
  {k:'chess',n:'棋盘',c:'#8B7060',draw:drawChess},{k:'med',n:'医药',c:C.dustyCoral,draw:drawMed}
];

// ===== PLAYER (Banksy stencil sprite) =====
var sprPlayerW=80,sprPlayerH=100;
function drawPlayer(px,py,t){
  var s=2.2;cx.save();cx.translate(px,py-28*s);
  // Shadow
  fs('rgba(20,5,30,0.35)');cx.beginPath();cx.ellipse(0,28*s,7*s,2*s,0,0,6.28);cx.fill();
  // Balloon (always procedural — animated)
  var blowY=28*s-22*s,bstrTop=-30*s;
  ss(C.bg,1.2*s);cx.lineCap='round';
  cx.beginPath();cx.moveTo(5*s,blowY-7*s);cx.quadraticCurveTo(7*s+Math.sin(t*1.7)*0.6*s,blowY-16*s,6*s,bstrTop);cx.stroke();
  var bx2=6*s,by2=bstrTop-6*s;
  cx.save();cx.translate(bx2,by2);
  fs(C.dustyCoral);cx.globalAlpha=0.88;cx.beginPath();
  cx.moveTo(0,2.5*s);cx.bezierCurveTo(-4.5*s,-3.5*s,-9*s,1*s,0,7*s);
  cx.bezierCurveTo(9*s,1*s,4.5*s,-3.5*s,0,2.5*s);cx.fill();
  fs(C.bw);cx.globalAlpha=0.25;cx.beginPath();cx.arc(-2*s,-1.5*s,1.8*s,0,6.28);cx.fill();cx.globalAlpha=1;cx.restore();
  // Body — Banksy stencil sprite or procedural fallback
  if(sprPlayer.complete&&sprPlayer.naturalWidth>0){
    var bw=12*s,bh=20*s,bx=-bw/2,by=-4*s;
    cx.drawImage(sprPlayer,bx,by,bw,bh);
  }else{
    // Procedural fallback
    var skirtWave=Math.sin(t*4)*1*s;
    fs(C.bw);cx.globalAlpha=0.92;cx.beginPath();
    cx.moveTo(-5*s+skirtWave,7*s);cx.lineTo(-6.5*s+skirtWave*1.3,13*s);
    cx.quadraticCurveTo(-7*s,15.5*s,-2.5*s,15.5*s+skirtWave*0.5);
    cx.quadraticCurveTo(7*s,14*s,6*s+skirtWave*0.8,13*s);cx.lineTo(4.5*s+skirtWave*0.5,7*s);cx.closePath();cx.fill();cx.globalAlpha=1;
    ss(C.vapourViolet,0.8*s);cx.globalAlpha=0.6;
    cx.beginPath();cx.moveTo(-6*s+skirtWave*1.2,13*s);cx.quadraticCurveTo(-2.5*s,16*s+skirtWave*0.5,5.8*s+skirtWave*0.7,13*s);cx.stroke();cx.globalAlpha=1;
    fs(C.bw);cx.globalAlpha=0.94;cx.beginPath();cx.moveTo(-3.5*s,-5*s);cx.lineTo(-4.5*s,7*s);cx.lineTo(4.5*s,7*s);cx.lineTo(3.5*s,-5*s);cx.closePath();cx.fill();cx.globalAlpha=1;
    ss(C.bgDark,1.8*s);cx.lineCap='round';
    cx.beginPath();cx.moveTo(-3.5*s,-2*s);cx.quadraticCurveTo(-1.5*s,-9*s,5*s,blowY-8*s);cx.stroke();
    cx.beginPath();cx.moveTo(3.5*s,-2*s);cx.quadraticCurveTo(8*s+Math.sin(t*5)*2*s,-0.5*s,7*s+Math.sin(t*5)*2.5*s,5*s);cx.stroke();
    fs(C.bw);cx.globalAlpha=0.96;cx.beginPath();cx.arc(0,-9*s,4.5*s,0,6.28);cx.fill();cx.globalAlpha=1;
    fs(C.nightDeep);cx.globalAlpha=0.8;cx.beginPath();cx.arc(-1.6*s,-10*s,0.6*s,0,6.28);cx.fill();
    cx.beginPath();cx.arc(1.6*s,-10*s,0.6*s,0,6.28);cx.fill();cx.globalAlpha=1;
  }
  // Legs (always procedural — animated)
  var legPhase=t*6;
  ss(C.bgDark,2.5*s);cx.lineCap='round';
  cx.beginPath();cx.moveTo(-2*s,11*s);cx.lineTo(-3.5*s+Math.sin(legPhase)*5*s,24*s);cx.stroke();
  cx.beginPath();cx.moveTo(2*s,11*s);cx.lineTo(3.5*s+Math.sin(legPhase+Math.PI)*5*s,24*s);cx.stroke();
  cx.restore();
}

// ===== TRAIN CAR =====
function drawCar(ca,c,t){
  var cx2=ca.x-c,cy=ca.y,cw=ca.w,ch=ca.h,uh=ch*0.40;
  fs(C.nightDeep);fr(cx2,cy-7,cw,8);
  // Upper body
  var ug=cx.createLinearGradient(cx2,cy,cx2,cy+uh);
  ug.addColorStop(0,C.fameLight);ug.addColorStop(0.4,C.fameGreen);ug.addColorStop(1,C.fameDark);fs(ug);fr(cx2,cy,cw,uh);
  // Lower body
  var lg=cx.createLinearGradient(cx2,cy+uh,cx2,cy+ch);
  lg.addColorStop(0,C.fameGreen);lg.addColorStop(1,C.fameDeep);fs(lg);fr(cx2,cy+uh,cw,ch-uh);
  // Coachline
  ss(C.coach,1.7);cx.globalAlpha=0.65;cx.beginPath();cx.moveTo(cx2+10,cy+uh);cx.lineTo(cx2+cw-10,cy+uh);cx.stroke();cx.globalAlpha=1;

// ===== ENVIRONMENT =====
function drawSky(clv){
  var idx=clv-1;if(idx<0)idx=0;if(idx>9)idx=9;
  var img=bgImgs[idx];
  // Draw background image if loaded, else fallback to procedural
  if(img&&img.complete&&img.naturalWidth>0&&!img._failed){
    // Scale to fill canvas
    var iw=img.naturalWidth,ih=img.naturalHeight;
    var scale=Math.max(W/iw,H/ih);
    var sw=iw*scale,sh=ih*scale;
    var sx=(W-sw)/2,sy=(H-sh)/2;
    cx.drawImage(img,sx,sy,sw,sh);
  }else{
    // Fallback procedural gradient
    var lv=LEVELS[idx]||LEVELS[0];
    var sky=cx.createLinearGradient(0,0,0,H);
    for(var i=0;i<lv.sky.length;i++)sky.addColorStop(i/(lv.sky.length-1),lv.sky[i]);
    fs(sky);fr(0,0,W,H);
  }
  // Crystal Over veil (always)
  var co=cx.createLinearGradient(0,0,W*0.3,H*0.4);
  co.addColorStop(0,'rgba(180,140,220,0.04)');co.addColorStop(0.5,'rgba(200,160,230,0.02)');co.addColorStop(1,'transparent');fs(co);fr(0,0,W,H);
  // Stars (always on top)
  var t=Date.now()/1000;
  var lv=LEVELS[idx]||LEVELS[0];
  if(lv.starBoost>0){
    for(var i=0;i<stars.length;i++){
      var s=stars[i];fs(s.c||C.bw);cx.globalAlpha=s.a*lv.starBoost*(0.4+0.6*Math.sin(t*s.ts+s.tw));
      cx.beginPath();cx.arc(s.x-cam*0.02,s.y,s.r,0,6.28);cx.fill();
    }cx.globalAlpha=1;
  }
}
function drawGround(clv){

  for(var rx=-(cam%36);rx<W;rx+=36){
    fs(C.deepBg);fr(rx,H*0.78+2,5,8);fs('rgba(192,160,96,0.1)');fr(rx-8,H*0.78+6,21,1.8);
  }
}

  for(var pi=0;pi<pts.length;pi++){var p=pts[pi];cx.globalAlpha=p.life/p.ml;fs(p.c);cx.beginPath();cx.moveTo(p.x-cam,p.y-p.s);cx.lineTo(p.x-cam+p.s,p.y);cx.lineTo(p.x-cam,p.y+p.s);cx.lineTo(p.x-cam-p.s,p.y);cx.closePath();cx.fill()}cx.globalAlpha=1;

}

    html+='<div class=\"lb-text\">调配今日配给（'+avail+'人）</div>';
    html+='<div class=\"lb-res\"><span class=\"lb-ri'+(res.food<rationFood?' low':'')+'\">🍞 库存 '+res.food+'</span><span class=\"lb-ri'+(res.water<rationWater?' low':'')+'\">💧 库存 '+res.water+'</span></div>';
    html+='<div style=\"display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0\"><button class=\"lb-btn\" style=\"padding:10px 20px;font-size:20px;min-width:48px\" onclick=\"rationFood=Math.max(0,rationFood-1);showLogPage()\">−1</button><span style=\"color:#C4A8E0;font-size:22px;min-width:80px;text-align:center\">🍞 ×'+rationFood+'</span><button class=\"lb-btn\" style=\"padding:10px 20px;font-size:20px;min-width:48px\" onclick=\"rationFood=Math.min(res.food,rationFood+1);showLogPage()\">+1</button></div>';
    html+='<div style=\"display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0\"><button class=\"lb-btn\" style=\"padding:10px 20px;font-size:20px;min-width:48px\" onclick=\"rationWater=Math.max(0,rationWater-1);showLogPage()\">−1</button><span style=\"color:#C4A8E0;font-size:22px;min-width:80px;text-align:center\">💧 ×'+rationWater+'</span><button class=\"lb-btn\" style=\"padding:10px 20px;font-size:20px;min-width:48px\" onclick=\"rationWater=Math.min(res.water,rationWater+1);showLogPage()\">+1</button></div>';
    html+='<button class=\"lb-btn warn\" onclick=\"skipRation()\">跳过 · 不给吃喝</button>';
    if(res.food<rationFood||res.water<rationWater)html+='<div class=\"lb-text\" style=\"color:#E898A8\">库存不足！</div>';
    html+='<button class=\"lb-btn\" onclick=\"doConsume()\">确认配给</button>';
  }else if(logPage===2){
    if(explorerAway){html+='<div class=\"lb-text\">🚶 有人在外探索中<br/>预计第'+explorerReturnDay+'天归来</div><button class=\"lb-btn\" onclick=\"logPage=3;showLogPage()\">继续</button>'}
    else{html+='<div class=\"lb-text\">派一人外出搜索<br/>离开'+crewHealth+'人，将离开1~6天</div><button class=\"lb-btn\" onclick=\"startExplore()\">出发探索</button>'}
  }else if(logPage===3){
    html+='<div class=\"lb-text\">给火车头供给燃料</div><div class=\"lb-res\"><span class=\"lb-ri'+(res.coal<1?' low':'')+'\">🔥 煤炭 '+res.coal+'</span><span class=\"lb-ri'+(res.water<1?' low':'')+'\">💧 水 '+res.water+'</span></div><button class=\"lb-btn\" onclick=\"tendEngine(1)\">投入 1🔥 + 1💧</button><button class=\"lb-btn\" style=\"opacity:0.4;font-size:10px\" onclick=\"tendEngine(0)\">跳过</button>';
  }else if(logPage===4){
    if(explorerFound.length>0&&!explorerAway){
      if(explorerFound[0].icon==='💀'){html+='<div class=\"lb-text\" style=\"color:#E898A8\">💀 探索者未能归来…</div>'}
      else{html+='<div class=\"lb-text\">🚶 探索者归队！</div><div class=\"lb-res\">';for(var ef=0;ef<explorerFound.length;ef++){var f=explorerFound[ef];html+='<span class=\"lb-ri\">'+f.icon+' '+f.name+' +'+f.amt+'</span>'}html+='</div>'}
      explorerFound=[];html+='<button class=\"lb-btn\" onclick=\"endDay()\">确认</button>';
    }else if(!eventToday){html+='<div class=\"lb-text\">今日平安无事</div><button class=\"lb-btn\" onclick=\"endDay()\">结束这一天</button>'}
    else if(eventToday.type==='breakdown'){html+='<div class=\"lb-text\">⚙️ 火车头故障！<br/>需要铁片修理</div><div class=\"lb-res\"><span class=\"lb-ri'+(res.iron<1?' low':'')+'\">🪨 铁片 '+res.iron+'</span></div><button class=\"lb-btn\" onclick=\"fixB()\">用铁片修理</button><button class=\"lb-btn warn\" onclick=\"skipE()\">没有铁片</button>'}
    else if(eventToday.type==='mice'){var loss=eventToday.loss||2;html+='<div class=\"lb-text\">🐭 仓里进老鼠了！</div><div class=\"lb-res\"><span class=\"lb-ri low\">🍞 -'+loss+'</span></div>';if(res.meds>0)html+='<button class=\"lb-btn\" onclick=\"cureM()\">用药驱鼠 💊</button>';html+='<button class=\"lb-btn\" onclick=\"resolveE()\">知道了…</button>'}
    else if(eventToday.type==='sick'){html+='<div class=\"lb-text\">🤒 有人生病了！</div><button class=\"lb-btn\" onclick=\"healS()\">使用医药箱</button><button class=\"lb-btn warn\" onclick=\"skipE()\">没有药</button>'}
    else if(eventToday.type==='rain'){html+='<div class=\"lb-text\">🌧️ 今天下大雨</div><button class=\"lb-btn\" onclick=\"resolveE()\">在车里休息</button>'}
    else if(eventToday.type==='luck'){html+='<div class=\"lb-text\">🍀 好运降临！</div><div class=\"lb-res\"><span class=\"lb-ri\">🍞 +2</span><span class=\"lb-ri\">💧 +1</span><span class=\"lb-ri\">🔥 +1</span></div><button class=\"lb-btn\" onclick=\"resolveE()\">收下</button>'}
    else if(eventToday.type==='bandit'){var st=eventToday.stolen||{food:Math.min(res.food,2),water:Math.min(res.water,2)};eventToday.stolen=st;html+='<div class=\"lb-text\">🔫 强盗来袭！</div><div class=\"lb-res\"><span class=\"lb-ri low\">🍞 -'+st.food+'</span><span class=\"lb-ri low\">💧 -'+st.water+'</span></div>';if(res.gear>0&&res.ammo>0)html+='<button class=\"lb-btn\" onclick=\"fightB()\">开枪反击！</button>';html+='<button class=\"lb-btn warn\" onclick=\"resolveE()\">无可奈何…</button>'}
    else if(eventToday.type==='choice'){if(eventToday.subtype==='supplies'){html+='<div class=\"lb-text\">📦 发现废弃补给箱</div><button class=\"lb-btn\" onclick=\"doChoice(true)\">打开箱子</button><button class=\"lb-btn warn\" onclick=\"doChoice(false)\">安全绕开</button>'}else{html+='<div class=\"lb-text\">🧑 路边陌生人求救</div><button class=\"lb-btn\" onclick=\"doChoice(true)\">伸出援手</button><button class=\"lb-btn warn\" onclick=\"doChoice(false)\">不理他</button>'}}
  }
  lbContent.innerHTML=html;
}

// ===== PHASE 2 ACTIONS =====
function skipRation(){rationFood=0;rationWater=0;var a=crewHealth-(explorerAway?1:0);if(a>0&&Math.random()<0.3)crewHealth--;if(crewHealth<=0){endP2(false,'全员饥渴而亡');return}logPage=2;showLogPage()}
function doConsume(){var a=crewHealth-(explorerAway?1:0),nf=rationFood||a,nw=rationWater||a,ate=Math.min(res.food,nf),dr=Math.min(res.water,nw);res.food-=ate;res.water-=dr;if(ate<a||dr<a){if(Math.random()<0.3)crewHealth--}if(crewHealth<=0){endP2(false,'配给不足');return}rationFood=0;rationWater=0;logPage=2;showLogPage()}
function startExplore(){explorerAway=true;explorerReturnDay=day+1+Math.floor(Math.random()*6);explorerFound=[];logPage=3;showLogPage()}
function tendEngine(n){if(n>0&&res.coal>=1&&res.water>=1){res.coal-=1;res.water-=1;distance+=22+Math.floor(Math.random()*6)}else if(n>0){if(Math.random()<0.3){crewHealth--;if(crewHealth<=0){endP2(false,'锅炉熄火');return}}distance+=8+Math.floor(Math.random()*5)}else{distance+=8+Math.floor(Math.random()*5)}logPage=4;rollEvent();showLogPage()}
function rollEvent(){var r=Math.random(),lv=level;if(lv===2){if(r<0.15)eventToday={type:'luck'};else if(r<0.25)eventToday={type:'choice',subtype:'supplies'};else if(r<0.32)eventToday={type:'mice',loss:1};else eventToday=null;return}if(lv===3){if(r<0.1)eventToday={type:'luck'};else if(r<0.18)eventToday={type:'mice',loss:1+Math.floor(Math.random()*2)};else if(r<0.22)eventToday={type:'sick'};else eventToday=null;return}if(lv===8){if(r<0.45)eventToday={type:'rain'};else if(r<0.6)eventToday={type:'breakdown'};else if(r<0.72)eventToday={type:'bandit'};else if(r<0.82)eventToday={type:'mice',loss:2+Math.floor(Math.random()*2)};else if(r<0.9)eventToday={type:'sick'};else eventToday=null;return}if(lv===9){if(r<0.2)eventToday={type:'breakdown'};else if(r<0.35)eventToday={type:'bandit'};else if(r<0.5)eventToday={type:'mice',loss:2+Math.floor(Math.random()*3)};else if(r<0.65)eventToday={type:'sick'};else if(r<0.72)eventToday={type:'rain'};else eventToday=null;return}if(lv===10){if(r<0.25)eventToday={type:'breakdown'};else if(r<0.45)eventToday={type:'bandit'};else if(r<0.6)eventToday={type:'sick'};else if(r<0.72)eventToday={type:'mice',loss:3+Math.floor(Math.random()*3)};else if(r<0.8)eventToday={type:'rain'};else eventToday={type:'luck'};return}if(r<0.12)eventToday={type:'breakdown'};else if(r<0.22)eventToday={type:'choice',subtype:Math.random()<0.5?'supplies':'stranger'};else if(r<0.34)eventToday={type:'bandit'};else if(r<0.44)eventToday={type:'mice',loss:1+Math.floor(Math.random()*3)};else if(r<0.52)eventToday={type:'sick'};else if(r<0.6)eventToday={type:'rain'};else if(r<0.7)eventToday={type:'luck'};else eventToday=null}
function fixB(){if(res.iron>=1){res.iron-=1;eventToday=null;endDay()}else skipE()}
function healS(){if(res.meds>=1){res.meds-=1;eventToday=null;endDay()}else skipE()}
function skipE(){if(eventToday&&eventToday.type==='sick'){crewHealth--;if(crewHealth<=0){endP2(false,'病重不治');return}}eventToday=null;endDay()}
function fightB(){res.ammo--;eventToday=null;if(Math.random()<0.7){var loot2=[];if(Math.random()<0.6){res.iron+=2;loot2.push('🪨铁片×2')}if(Math.random()<0.6){res.water+=3;loot2.push('💧水×3')}if(loot2.length===0){res.food+=2;loot2.push('🍞食物×2')}explorerFound=loot2.map(function(s){var p=s.split('×');return{name:p[0].slice(2),icon:p[0].slice(0,2),amt:parseInt(p[1])}});endDay()}else{res.food=Math.max(0,res.food-2);res.water=Math.max(0,res.water-2);endDay()}}
function cureM(){res.meds--;eventToday=null;endDay()}
function doChoice(take){var sub=eventToday?eventToday.subtype:'supplies';eventToday=null;if(take){if(Math.random()<0.65){if(sub==='supplies'){res.food+=3;res.water+=2;res.coal+=2}else{res.food+=2;res.water+=2;res.iron+=1}endDay()}else{res.food=Math.max(0,res.food-3);res.water=Math.max(0,res.water-2);if(Math.random()<0.3)crewHealth--;endDay()}}else{endDay()}}
function resolveE(){if(eventToday&&eventToday.type==='mice')res.food=Math.max(0,res.food-eventToday.loss);if(eventToday&&eventToday.type==='luck'){res.food+=2;res.water+=1;res.coal+=1}if(eventToday&&eventToday.type==='bandit'&&eventToday.stolen){res.food=Math.max(0,res.food-eventToday.stolen.food);res.water=Math.max(0,res.water-eventToday.stolen.water)}eventToday=null;endDay()}
function calcScore(){score=Math.floor(distance*0.5+res.food*10+res.water*8+res.coal*5+res.iron*15+res.wood*8+crewHealth*200+res.gear*30+res.ammo*20);return score>800?'S':score>600?'A':score>400?'B':score>200?'C':'D'}
function endDay(){day++;if(explorerAway&&day>=explorerReturnDay){explorerAway=false;if(Math.random()<0.15){crewHealth--;explorerFound=[{name:'未归',icon:'💀',amt:0}]}else{var types=[{n:'铁片',icon:'🪨',k:'iron'},{n:'煤炭',icon:'🔥',k:'coal'},{n:'水',icon:'💧',k:'water'},{n:'木材',icon:'🪵',k:'wood'},{n:'食物',icon:'🍞',k:'food'},{n:'子弹',icon:'🔫',k:'ammo2'},{n:'猎枪',icon:'🔫',k:'gear2'},{n:'收音机',icon:'📻',k:'comm2'},{n:'棋盘',icon:'♟️',k:'chess2'}];explorerFound=[];var fc=2+Math.floor(Math.random()*3);for(var fi=0;fi<fc;fi++){var t=types[Math.floor(Math.random()*types.length)];var amt=1+Math.floor(Math.random()*3);if(!t.k.endsWith('2'))res[t.k]=(res[t.k]||0)+amt;else if(t.k==='gear2')res.gear=(res.gear||0)+amt;else if(t.k==='ammo2')res.ammo=(res.ammo||0)+amt;explorerFound.push({name:t.n,icon:t.icon,amt:amt})}}if(crewHealth<=0){endP2(false,'探索者未归');return}}if(distance>=goalDistance){endP2(true,'提前抵达远方！');return}if(level>=2&&(day-(level-2)*daysPerLevel)>daysPerLevel){level++;if(level>10){endP2(true,'抵达远方！');return}showLevelIntro=true}logPage=1;eventToday=null;showLogPage()}
function endP2(win,msg){phase=3;hideLogbook();var rating=calcScore();document.getElementById('over').classList.add('show');document.getElementById('ot').textContent=win?'✦ 抵达':'✧ 中断';document.getElementById('os').innerHTML=msg+'<br/>评分: '+rating+' ('+score+'分)<br/>距离: '+Math.floor(distance)+'km · 存活: '+crewHealth+'人';document.getElementById('ctrls').style.display='none'}

// ===== PHASE 1 LOGIC =====
function updInv(){var h='';for(var i=0;i<ITEMS.length;i++)h+='<span class=iv>'+inv[ITEMS[i].k]+' '+ITEMS[i].n+'</span>';document.getElementById('inv').innerHTML=h}
function rst(){phase=1;level=1;showLevelIntro=false;time=60;st='play';inv={food:0,coal:0,water:0,gear:0,ammo:0,comm:0,chess:0,med:0};inLast=false;dc=0;pts=[];loot=[];crewFound=[false,false,false,false,false,false];crewCount=0;makeCars();spawnLoot();makeStars();player.x=carW()/2;cam=0;document.getElementById('over').classList.remove('show');document.getElementById('warn').style.opacity='0';document.getElementById('hint').style.opacity='1';document.getElementById('ctrls').style.display='flex';document.getElementById('hud').style.display='flex';document.getElementById('inv').style.display='flex';hideLogbook();updInv();var lv=LEVELS[0];document.getElementById('lv').textContent=lv.name+' · '+lv.eng}
function gameOverP1(win){st='end';document.getElementById('over').classList.add('show');if(win){startPhase2();return}document.getElementById('ot').textContent='未抵达';document.getElementById('os').textContent='未能抵达最后一节车厢';document.getElementById('ctrls').style.display='none'}
function collect(it){if(it.got)return;it.got=true;inv[it.d.k]++;updInv();for(var i=0;i<8;i++)pts.push({x:it.x,y:it.y,vx:(Math.random()-0.5)*2.5,vy:-2-Math.random()*2.5,life:22,ml:22,c:it.d.c,s:1.5+Math.random()*2})}
function pickup(){for(var i=0;i<loot.length;i++){var l=loot[i];if(l.got)continue;if(Math.abs(player.x-l.x)<38&&Math.abs(player.y-l.y)<44)collect(l)}}
function startPhase2(){phase=2;st='play';level=2;showLevelIntro=true;res.food=inv.food;res.water=inv.water;res.coal=inv.coal;res.meds=inv.med;res.wood=0;res.iron=0;res.gear=inv.gear||0;res.ammo=inv.ammo||0;crewHealth=crewCount;day=1;logPage=1;distance=0;showLogbook()}
function up(dt){if(phase===2){pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return}if(st!=='play'){pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return}time-=dt;if(time<0)time=0;document.getElementById('tm').textContent=Math.ceil(time)+'s';if(time<8)document.getElementById('hint').style.opacity='0';if(time<=0){gameOverP1(false);return}var dx=joyX;if(keys[37]||keys[65])dx=-1;if(keys[39]||keys[68])dx+=1;player.x+=dx*5*60*dt;player.x=Math.max(8,Math.min(cars[NC-1].x+cars[NC-1].w-8,player.x));var ci=Math.floor(player.x/carW());if(ci>=0&&ci<NC)player.y=cars[ci].y+cars[ci].h-42;if([0,2,4].indexOf(ci)>=0&&!crewFound[ci]){crewFound[ci]=true;crewCount++;var c2=cars[ci];loot.push({x:c2.x+c2.w*0.3,y:c2.y+c2.h-38,ci:ci,d:ITEMS[0],got:false});loot.push({x:c2.x+c2.w*0.6,y:c2.y+c2.h-38,ci:ci,d:ITEMS[2],got:false});document.getElementById('warn').style.opacity='1';document.getElementById('warn').innerHTML='找到同伴！（'+crewCount+'/3）';setTimeout(function(){document.getElementById('warn').style.opacity='0'},1500)}cam=player.x-W/2;cam=Math.max(0,Math.min(cars[NC-1].x+cars[NC-1].w-W,cam));var inL=ci===NC-1;if(inL&&!inLast){inLast=true;dc=0;document.getElementById('warn').style.opacity='1'}if(inL&&inLast){dc+=dt;document.getElementById('warn').innerHTML='最后一节<br>停留3秒过关';if(dc>=3)gameOverP1(true)}if(!inL&&inLast){inLast=false;dc=0;document.getElementById('warn').style.opacity='0'}pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0})}

// ===== INPUT =====
var joyX=0,joyActive=false,joyOX=0,joyOY=0,keys={};
var joy=document.getElementById('joy'),stick=document.getElementById('stick');
function joyMove(cx2,cy){var r=joy.getBoundingClientRect();var dx=cx2-r.left,dy=cy-r.top;if(!joyActive){joyOX=dx;joyOY=dy;joyActive=true}var mx=dx-joyOX,my=dy-joyOY;var d=Math.sqrt(mx*mx+my*my);if(d>30){mx=mx/d*30;my=my/d*30}stick.style.left=(28+mx)+'px';stick.style.top=(28+my)+'px';joyX=mx/30}
function joyEnd(){joyActive=false;joyX=0;stick.style.left='28px';stick.style.top='28px'}
joy.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY)});
joy.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY)});
joy.addEventListener('touchend',function(e){e.preventDefault();joyEnd()});
joy.addEventListener('touchcancel',function(e){e.preventDefault();joyEnd()});
joy.addEventListener('mousedown',function(e){e.preventDefault();joyMove(e.clientX,e.clientY)});
window.addEventListener('mousemove',function(e){if(joyActive)joyMove(e.clientX,e.clientY)});
window.addEventListener('mouseup',function(){if(joyActive)joyEnd()});
document.getElementById('pick').addEventListener('touchstart',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup()});
document.getElementById('pick').addEventListener('mousedown',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup()});
window.addEventListener('keydown',function(e){keys[e.keyCode]=true;if(e.keyCode===32&&st==='play'&&phase===1){e.preventDefault();pickup()}});
window.addEventListener('keyup',function(e){keys[e.keyCode]=false});

// ===== START =====
makeCars();spawnLoot();makeStars();updInv();player.x=carW()/2;
var lt=0;
(function loop(ts){var dt=lt?Math.min((ts-lt)/1000,0.1):0.016;lt=ts;up(dt);draw();requestAnimationFrame(loop)})(0);
</script>
</body>
