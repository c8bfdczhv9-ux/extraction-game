<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NIGHT TRAIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#2a1040;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:fixed}
#wrap{position:relative;width:100vw;height:100vh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;background:#2a1040;border-radius:8px;max-width:100vw;max-height:56vh;border:1px solid rgba(180,150,210,0.25)}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.hb{background:rgba(30,10,50,0.9);border:1px solid rgba(180,150,210,0.25);border-radius:5px;padding:5px 12px;font-size:12px;color:#b496d2;letter-spacing:1.5px;font-weight:300}
#inv{position:absolute;bottom:84px;left:10px;right:10px;display:flex;gap:5px;justify-content:center;pointer-events:none;z-index:10;flex-wrap:wrap}
.iv{background:rgba(30,10,50,0.9);border:1px solid rgba(180,150,210,0.18);border-radius:4px;padding:3px 8px;font-size:9px;color:#b496d2}
#ctrls{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;z-index:10}
#joy{width:96px;height:96px;background:rgba(60,20,80,0.4);border:1.5px solid rgba(180,150,210,0.22);border-radius:50%;position:relative;touch-action:none}
#stick{width:40px;height:40px;background:rgba(180,150,210,0.32);border:1px solid rgba(180,150,210,0.4);border-radius:50%;position:absolute;top:28px;left:28px;pointer-events:none}
#pick{width:60px;height:60px;background:rgba(125,155,139,0.16);border:1.5px solid rgba(125,155,139,0.32);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(125,155,139,0.7);margin-bottom:18px;touch-action:none}
#pick:active{background:rgba(125,155,139,0.32)}
#hint{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);color:rgba(180,150,210,0.3);font-size:10px;letter-spacing:2px;pointer-events:none;z-index:5}
#warn{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);color:#e898a8;font-size:12px;letter-spacing:2px;pointer-events:none;z-index:5;opacity:0;text-align:center;font-weight:300}

/* === LOGBOOK OVERLAY === */
#logbook{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:30;background:rgba(20,5,30,0.92);border-radius:8px;padding:20px 16px}
#logbook.show{display:flex}
.lb-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lb-day{font-size:14px;color:#d4c0e8;letter-spacing:2px;font-weight:200}
.lb-page-dots{display:flex;gap:6px}
.lb-dot{width:7px;height:7px;border-radius:50%;background:rgba(180,150,210,0.18)}
.lb-dot.active{background:#d4c0e8}
.lb-content{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.lb-title{font-size:13px;color:#b496d2;letter-spacing:2px;margin-bottom:10px;font-weight:300}
.lb-text{font-size:11px;color:#9b8bb0;line-height:1.7;margin-bottom:14px;max-width:280px;font-weight:300}
.lb-res{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.lb-ri{font-size:10px;color:#7d9b8b;background:rgba(125,155,139,0.08);border:1px solid rgba(125,155,139,0.2);border-radius:4px;padding:4px 10px}
.lb-ri.low{color:#e898a8;border-color:rgba(232,152,168,0.25)}
.lb-btn{background:rgba(125,155,139,0.12);border:1px solid rgba(125,155,139,0.3);color:#b496d2;padding:12px 30px;border-radius:6px;font-size:12px;letter-spacing:2px;cursor:pointer;font-weight:300;margin:4px}
.lb-btn:active{background:rgba(125,155,139,0.25);color:#d4c0e8}
.lb-btn.warn{background:rgba(232,152,168,0.1);border-color:rgba(232,152,168,0.3);color:#e898a8}
.lb-btn.warn:active{background:rgba(232,152,168,0.22)}
.lb-nav{display:flex;justify-content:center;gap:12px;margin-top:8px}
.lb-small{font-size:9px;color:rgba(180,150,210,0.3);text-align:center;margin-top:8px}
#explore-hint{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:#d4c0e8;font-size:13px;letter-spacing:2px;pointer-events:none;z-index:5;display:none}
#over{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(20,5,35,0.96);border-radius:8px}
#over.show{display:flex}
.ot{font-size:18px;color:#d4c0e8;letter-spacing:3px;margin-bottom:6px;font-weight:200}
.os{font-size:11px;color:#b496d2;margin-bottom:16px;font-weight:300}
.btn{background:rgba(125,155,139,0.12);border:1px solid rgba(125,155,139,0.28);color:#b496d2;padding:10px 26px;border-radius:6px;font-size:12px;letter-spacing:2px;cursor:pointer;margin:4px;font-weight:300}
.btn:active{background:rgba(125,155,139,0.22);color:#d4c0e8}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g"></canvas>
<div id="hud"><span class="hb" id="tm">60s</span><span class="hb" id="lv">第1关 · 收集</span></div>
<div id="inv"></div>
<div id="hint">拖动摇杆 · 点击拾取</div>
<div id="warn"></div>
<div id="explore-hint">探索中…</div>
<div id="ctrls">
  <div id="joy"><div id="stick"></div></div>
  <div id="pick">✦</div>
</div>
<!-- LOGBOOK -->
<div id="logbook">
  <div class="lb-header">
    <span class="lb-day" id="lb-day">DAY 1</span>
    <div class="lb-page-dots" id="lb-dots"></div>
  </div>
  <div class="lb-content" id="lb-content"></div>
  <div class="lb-nav" id="lb-nav"></div>
  <div class="lb-small">10关·50天·抵达远方</div>
</div>
<div id="over"><div class="ot" id="ot"></div><div class="os" id="os"></div><button class="btn" onclick="rst()">RETRY</button></div>
</div>
<script>
// ===================================================================
// SETUP
// ===================================================================
var g=document.getElementById('g'), cx=g.getContext('2d');
var W,H;
function resize(){W=Math.min(window.innerWidth-12,500);H=Math.min(window.innerHeight*0.54,600);g.width=W;g.height=H;}

// ===================================================================
// COLORS
// ===================================================================
var C={
  tp:'#4E1D73',tp2:'#3A1055',tp3:'#2A0845',tp4:'#6B30A0',
  fg:'#7D9B8B',fg2:'#5C7A6C',fg3:'#9BB8A8',
  bw:'#F0EBF5',bg:'#9B8BB0',bg2:'#6E5F85',
  dc:'#E898A8',go:'#C0A060',bk:'#1A0A30'
};

// ===================================================================
// SHARED HELPERS
// ===================================================================
function fr(x,y,w,h){cx.fillRect(x,y,w,h);}
function fa(x,y,r){cx.beginPath();cx.arc(x,y,r,0,6.28);cx.fill();}
function fs(c){cx.fillStyle=c;}
function ss(c,w){cx.strokeStyle=c;cx.lineWidth=w||0.8;}

// ===================================================================
// ITEM SPRITES
// ===================================================================
function drawFood(x,y){
  var s=1.2;cx.save();cx.translate(x-5*s,y-7*s);
  fs('rgba(30,10,50,0.35)');fa(5*s,10*s,5*s);
  fs('rgba(160,130,90,0.3)');fr(1*s,1*s,8*s,8*s);
  ss(C.go,1*s);cx.strokeRect(1*s,1*s,8*s,8*s);
  fs('rgba(180,150,110,0.5)');fr(0,0,10*s,2*s);fr(0,8*s,10*s,2*s);
  ss(C.go,0.6*s);cx.strokeRect(0,0,10*s,2*s);cx.strokeRect(0,8*s,10*s,2*s);
  fs('rgba(180,150,110,0.2)');fr(1.5*s,3*s,7*s,4*s);
  fs('rgba(240,230,245,0.15)');fr(2*s,1.5*s,1.5*s,7*s);
  fs('rgba(160,130,90,0.4)');fr(3*s,-1*s,4*s,2.5*s);
  ss(C.go,0.5*s);cx.strokeRect(3*s,-1*s,4*s,2.5*s);cx.restore();
}
function drawCoal(x,y){
  var s=1.3;cx.save();cx.translate(x-4*s,y-6*s);
  fs('rgba(30,10,50,0.3)');fa(5*s,9*s,5*s);
  fs('rgba(70,60,80,0.4)');cx.beginPath();
  cx.moveTo(5*s,0);cx.lineTo(9*s,2*s);cx.lineTo(10*s,5*s);
  cx.lineTo(8*s,9*s);cx.lineTo(4*s,10*s);cx.lineTo(0,7*s);
  cx.lineTo(1*s,3*s);cx.closePath();cx.fill();
  ss('rgba(155,139,176,0.5)',1*s);cx.stroke();
  ss('rgba(170,150,195,0.3)',0.6*s);
  cx.beginPath();cx.moveTo(5*s,1*s);cx.lineTo(8*s,3*s);cx.lineTo(5*s,6*s);cx.closePath();cx.stroke();
  ss('rgba(190,170,215,0.2)',0.4*s);
  cx.beginPath();cx.moveTo(3*s,2*s);cx.lineTo(5*s,1*s);cx.lineTo(5*s,4*s);cx.closePath();cx.stroke();cx.restore();
}
function drawWater(x,y){
  var s=1.2;cx.save();cx.translate(x-5*s,y-7*s);
  fs('rgba(30,10,50,0.3)');fa(5*s,10*s,5*s);
  fs('rgba(100,135,160,0.22)');cx.beginPath();cx.arc(5*s,5*s,5*s,0,6.28);cx.fill();
  ss('#7D9B8B',1*s);cx.stroke();
  fs('rgba(125,155,139,0.18)');cx.beginPath();cx.arc(5*s,5.5*s,4*s,0,Math.PI);cx.fill();
  fs('rgba(125,155,139,0.3)');fr(3.5*s,-1*s,3*s,3*s);
  ss('#7D9B8B',0.6*s);cx.strokeRect(3.5*s,-1*s,3*s,3*s);
  fs('rgba(155,180,165,0.45)');fr(3*s,-2.5*s,4*s,2*s);
  ss('#7D9B8B',0.5*s);cx.strokeRect(3*s,-2.5*s,4*s,2*s);
  fs('rgba(240,230,245,0.1)');fa(3.5*s,3.5*s,2*s);
  ss('#7D9B8B',0.5*s);cx.beginPath();cx.arc(8*s,0,1.5*s,0,6.28);cx.stroke();cx.restore();
}
function drawGun(x,y){
  var s=1.3;cx.save();cx.translate(x-6*s,y-5*s);
  fs('rgba(30,10,50,0.3)');fa(6*s,9*s,5*s);
  fs('rgba(110,100,130,0.4)');fr(2*s,1*s,8*s,3*s);
  ss(C.bg2,0.8*s);cx.strokeRect(2*s,1*s,8*s,3*s);
  fs('rgba(70,60,90,0.5)');fr(10*s,1.5*s,1.5*s,2*s);
  fs('rgba(100,90,120,0.38)');fr(1*s,3.5*s,5*s,5*s);
  ss(C.bg2,0.8*s);cx.strokeRect(1*s,3.5*s,5*s,5*s);
  fs('rgba(90,80,110,0.32)');fr(2.5*s,7.5*s,4*s,3*s);
  ss(C.bg2,0.6*s);cx.strokeRect(2.5*s,7.5*s,4*s,3*s);
  fs('rgba(155,139,176,0.38)');fr(3.5*s,7*s,1.5*s,1.5*s);
  fs('rgba(80,70,100,0.38)');fr(1*s,7*s,3.5*s,4*s);
  ss(C.bg2,0.6*s);cx.strokeRect(1*s,7*s,3.5*s,4*s);
  fs('rgba(40,20,60,0.4)');fr(5*s,1.5*s,2.5*s,1.5*s);
  fs('rgba(170,160,195,0.35)');fr(8*s,0.5*s,2*s,0.8*s);cx.restore();
}
function drawRadio(x,y){
  var s=1.2;cx.save();cx.translate(x-7*s,y-6*s);
  fs('rgba(30,10,50,0.3)');fa(7*s,9*s,6*s);
  fs('rgba(130,115,90,0.28)');fr(1*s,1*s,12*s,9*s);
  ss('#9B8B70',1*s);cx.strokeRect(1*s,1*s,12*s,9*s);
  ss('rgba(155,139,112,0.35)',0.4*s);
  for(var i=0;i<5;i++){cx.beginPath();cx.moveTo(2*s,3*s+i*1.5*s);cx.lineTo(7*s,3*s+i*1.5*s);cx.stroke();}
  fs('rgba(50,45,35,0.5)');fr(8*s,2.5*s,4*s,4*s);
  ss('#9B8B70',0.6*s);cx.strokeRect(8*s,2.5*s,4*s,4*s);
  ss('#9B8B70',0.4*s);cx.beginPath();cx.moveTo(10*s,3*s);cx.lineTo(9.5*s,5.5*s);cx.stroke();
  fs('rgba(155,139,112,0.38)');fa(9*s,8*s,1.2*s);fa(11.5*s,8*s,1.2*s);
  ss('#9B8B70',0.8*s);cx.beginPath();cx.moveTo(7*s,1*s);cx.lineTo(7*s,-3*s);cx.stroke();
  fs('rgba(155,139,112,0.45)');fa(7*s,-3*s,1*s);
  fs('rgba(90,75,60,0.28)');fr(2*s,10*s,3*s,1.5*s);fr(9*s,10*s,3*s,1.5*s);cx.restore();
}
function drawMed(x,y){
  var s=1.3;cx.save();cx.translate(x-5*s,y-5*s);
  fs('rgba(30,10,50,0.3)');fa(5*s,9*s,5*s);
  fs('rgba(180,105,120,0.22)');fr(0,1*s,10*s,9*s);
  ss(C.dc,1*s);cx.strokeRect(0,1*s,10*s,9*s);
  fs('rgba(190,108,122,0.45)');fr(3.5*s,2.5*s,3*s,6*s);fr(1.5*s,4.5*s,7*s,3*s);
  ss(C.dc,0.5*s);cx.strokeRect(3.5*s,2.5*s,3*s,6*s);cx.strokeRect(1.5*s,4.5*s,7*s,3*s);
  fs('rgba(190,108,122,0.28)');fr(4*s,9*s,2*s,1.5*s);
  fs('rgba(255,200,210,0.08)');fr(0.5*s,1.5*s,1.5*s,8*s);cx.restore();
}
var ITEMS=[
  {k:'food',n:'FOOD',c:C.go, draw:drawFood},
  {k:'coal',n:'COAL',c:'#5a4a60', draw:drawCoal},
  {k:'water',n:'WATER',c:C.fg, draw:drawWater},
  {k:'gear',n:'RIFLE',c:C.bg, draw:drawGun},
  {k:'ammo',n:'AMMO',c:'#c0a060', draw:drawAmmo},
  {k:'comm',n:'RADIO',c:'#9B8B70', draw:drawRadio},
  {k:'chess',n:'CHESS',c:'#8B7060', draw:drawChess},
  {k:'med',n:'MED',c:C.dc, draw:drawMed}
];

// === AMMO — Bullet box ===
function drawAmmo(x,y){
  var s=1.1;cx.save();cx.translate(x-4*s,y-5*s);
  fs('rgba(30,10,50,0.3)');fa(4*s,8*s,4*s);
  // Box
  fs('rgba(180,140,80,0.35)');fr(0,1*s,8*s,6*s);
  ss('#C0A060',0.8*s);cx.strokeRect(0,1*s,8*s,6*s);
  // Bullets inside
  fs('rgba(192,160,96,0.5)');
  for(var bi2=0;bi2<3;bi2++){fr(1.5*s+bi2*2*s,2*s,1*s,4*s);}
  ss('#C0A060',0.3*s);
  for(var bi3=0;bi3<3;bi3++){cx.strokeRect(1.5*s+bi3*2*s,2*s,1*s,4*s);}
  cx.restore();
}

// === CHESS — Board game ===
function drawChess(x,y){
  var s=1.1;cx.save();cx.translate(x-5*s,y-6*s);
  fs('rgba(30,10,50,0.3)');fa(5*s,9*s,5*s);
  // Board
  fs('rgba(120,100,80,0.4)');fr(0,0,10*s,8*s);
  ss('#8B7060',1*s);cx.strokeRect(0,0,10*s,8*s);
  // Grid
  ss('rgba(139,112,96,0.25)',0.3*s);
  for(var gi=1;gi<4;gi++){cx.beginPath();cx.moveTo(gi*2.5*s,0);cx.lineTo(gi*2.5*s,8*s);cx.stroke();}
  for(var gj=1;gj<4;gj++){cx.beginPath();cx.moveTo(0,gj*2*s);cx.lineTo(10*s,gj*2*s);cx.stroke();}
  // Pieces
  fs('rgba(30,20,25,0.5)');fa(2*s,2*s,1*s);fa(7*s,2*s,1*s);
  fs('rgba(220,200,180,0.4)');fa(2*s,6*s,1*s);fa(7*s,6*s,1*s);
  cx.restore();
}

// ===================================================================
// PLAYER — Banksy girl with balloon
// ===================================================================
function drawPlayer(px,py,t){
  var s=2.0;cx.save();cx.translate(px,py-26*s);
  fs('rgba(20,5,30,0.4)');cx.beginPath();cx.ellipse(0,26*s,6*s,1.8*s,0,0,6.28);cx.fill();
  var blowY=26*s-22*s,bstrTop=-28*s;
  ss(C.bg,1*s);cx.lineCap='round';
  cx.beginPath();cx.moveTo(4.5*s,blowY-6*s);
  cx.quadraticCurveTo(6*s+Math.sin(t*1.7)*0.5*s,blowY-14*s,5*s,bstrTop);cx.stroke();
  var bx2=5*s,by2=bstrTop-5*s;
  cx.save();cx.translate(bx2,by2);
  fs(C.dc);cx.globalAlpha=0.85;cx.beginPath();
  cx.moveTo(0,2*s);cx.bezierCurveTo(-4*s,-3*s,-8*s,1*s,0,6*s);
  cx.bezierCurveTo(8*s,1*s,4*s,-3*s,0,2*s);cx.fill();
  fs(C.bw);cx.globalAlpha=0.3;cx.beginPath();cx.arc(-2*s,-1*s,1.5*s,0,6.28);cx.fill();
  cx.globalAlpha=1;cx.restore();
  var legPhase=t*6;
  ss(C.bg2,2.2*s);cx.lineCap='round';
  cx.beginPath();cx.moveTo(-1.5*s,10*s);cx.lineTo(-3*s+Math.sin(legPhase)*4*s,22*s);cx.stroke();
  cx.beginPath();cx.moveTo(1.5*s,10*s);cx.lineTo(3*s+Math.sin(legPhase+Math.PI)*4*s,22*s);cx.stroke();
  var skirtWave=Math.sin(t*4)*0.8*s;
  fs(C.bw);cx.globalAlpha=0.9;cx.beginPath();
  cx.moveTo(-4.5*s+skirtWave,6*s);cx.lineTo(-5.5*s+skirtWave*1.3,12*s);
  cx.quadraticCurveTo(-6*s,14*s,-2*s,14*s+skirtWave*0.5);
  cx.quadraticCurveTo(6*s,13*s,5*s+skirtWave*0.8,12*s);
  cx.lineTo(4*s+skirtWave*0.5,6*s);cx.closePath();cx.fill();cx.globalAlpha=1;
  ss(C.bg,0.7*s);cx.beginPath();cx.moveTo(-5*s+skirtWave*1.2,12*s);
  cx.quadraticCurveTo(-2*s,14.5*s+skirtWave*0.5,5*s+skirtWave*0.7,12*s);cx.stroke();
  fs(C.bw);cx.globalAlpha=0.92;cx.beginPath();
  cx.moveTo(-3*s,-4*s);cx.lineTo(-4*s,6*s);cx.lineTo(4*s,6*s);cx.lineTo(3*s,-4*s);cx.closePath();cx.fill();cx.globalAlpha=1;
  ss(C.bg,0.5*s);cx.stroke();
  ss(C.bg2,1.5*s);cx.lineCap='round';
  cx.beginPath();cx.moveTo(-3*s,-2*s);cx.quadraticCurveTo(-1*s,-8*s,4*s,blowY-7*s);cx.stroke();
  cx.beginPath();cx.moveTo(3*s,-2*s);cx.quadraticCurveTo(7*s+Math.sin(t*5)*1.5*s,-1*s,6*s+Math.sin(t*5)*2*s,4*s);cx.stroke();
  fs(C.bw);cx.globalAlpha=0.95;cx.beginPath();cx.arc(0,-8*s,4*s,0,6.28);cx.fill();cx.globalAlpha=1;
  ss(C.bg,0.6*s);cx.beginPath();cx.arc(0,-8*s,4*s,0,6.28);cx.stroke();
  fs(C.bg2);cx.globalAlpha=0.7;cx.beginPath();
  var hf=Math.sin(t*3.5)*1.2*s;
  cx.moveTo(-3.5*s,-10*s);cx.quadraticCurveTo(-5*s+hf,-11*s,-7*s+hf*2,-8*s);
  cx.quadraticCurveTo(-8.5*s+hf*2.5,-5*s,-7*s+hf*3,-2*s);
  cx.lineTo(-4*s+hf,-4*s);cx.quadraticCurveTo(-3.5*s+hf,-7*s,-2*s,-11*s);cx.closePath();cx.fill();cx.globalAlpha=1;
  fs(C.bk);cx.globalAlpha=0.75;
  cx.beginPath();cx.arc(-1.4*s,-9*s,0.5*s,0,6.28);cx.fill();
  cx.beginPath();cx.arc(1.4*s,-9*s,0.5*s,0,6.28);cx.fill();cx.globalAlpha=1;
  cx.restore();
}

// ===================================================================
// TRAIN CAR — Phase 1 (running)
// ===================================================================
function drawCar(ca,c,t){
  var cx2=ca.x-c,cy=ca.y,cw=ca.w,ch=ca.h,uh=ch*0.40;
  fs('#2A0845');fr(cx2,cy-7,cw,8);
  var roof=cx.createLinearGradient(cx2,cy-7,cx2,cy+2);
  roof.addColorStop(0,'rgba(125,155,139,0.08)');roof.addColorStop(1,'transparent');fs(roof);fr(cx2,cy-7,cw,9);
  var ug=cx.createLinearGradient(cx2,cy,cx2,cy+uh);
  ug.addColorStop(0,C.fg3);ug.addColorStop(0.4,C.fg);ug.addColorStop(1,C.fg2);fs(ug);fr(cx2,cy,cw,uh);
  var lg2=cx.createLinearGradient(cx2,cy+uh,cx2,cy+ch);
  // Coachline — YELLOW (绿皮火车 signature)
  ss('#D4B830',1.6);cx.globalAlpha=0.7;
  cx.beginPath();cx.moveTo(cx2+10,cy+uh);cx.lineTo(cx2+cw-10,cy+uh);cx.stroke();
  cx.globalAlpha=1;
  // Thin bottom yellow stripe
  ss('#D4B830',0.7);cx.globalAlpha=0.45;
  cx.beginPath();cx.moveTo(cx2+6,cy+ch-14);cx.lineTo(cx2+cw-6,cy+ch-14);cx.stroke();
  cx.globalAlpha=1;
  // Crystal Over top highlight
  var hl=cx.createLinearGradient(cx2,cy,cx2,cy+12);
  hl.addColorStop(0,'rgba(155,184,168,0.22)');hl.addColorStop(1,'transparent');fs(hl);fr(cx2,cy,cw,12);

  // === CREW MEMBER in this car (cars 1, 3, 5) ===
  var crewCars=[0,2,4]; // cars with people
  if(crewCars.indexOf(ca.ci)>=0&&!crewFound[ca.ci]){
    var ppBaseY2=cy+uh*0.45, ppX2=cx2+cw*0.5;
    // Shadow
    fs('rgba(20,5,25,0.3)');cx.beginPath();cx.ellipse(ppX2,ppBaseY2+14,5,1.5,0,0,6.28);cx.fill();
    // Legs
    ss(C.bg2,2);cx.lineCap='round';
    cx.beginPath();cx.moveTo(ppX2-2,ppBaseY2+3);cx.lineTo(ppX2-3,ppBaseY2+14);cx.stroke();
    cx.beginPath();cx.moveTo(ppX2+2,ppBaseY2+3);cx.lineTo(ppX2+3,ppBaseY2+14);cx.stroke();
    // Body
    fs('rgba(40,30,50,0.6)');fr(ppX2-4,ppBaseY2-6,8,10);
    // Head
    fs('rgba(40,30,50,0.65)');cx.beginPath();cx.arc(ppX2,ppBaseY2-9,4,0,6.28);cx.fill();
    // Eyes
    fs(C.bw);cx.globalAlpha=0.2;cx.beginPath();cx.arc(ppX2-1.2,ppBaseY2-10,0.8,0,6.28);cx.fill();
    cx.beginPath();cx.arc(ppX2+1.2,ppBaseY2-10,0.8,0,6.28);cx.fill();cx.globalAlpha=1;
    // Item on ground
    fs('rgba(192,160,96,0.18)');fr(ppX2-3,cy+ch-46,7,7);
  }

  // 绿皮火车 windows — horizontal rectangle (wider than tall), 3 per car
  var ww=cw*0.28,wh=ww*0.72,wy3=cy+uh*0.12;
  var wGap=(cw-ww*3)/4;
  for(var wi=0;wi<3;wi++){
    var wxi=cx2+wGap+wi*(ww+wGap);
    // Interior wall behind glass
    fs('rgba(40,25,30,0.7)');fr(wxi,wy3,ww,wh);
    // === SEATS visible through window ===
    // Bench seat bottom
    fs('rgba(120,90,60,0.35)');fr(wxi+ww*0.08,wy3+wh*0.55,ww*0.84,wh*0.1);
    // Seat backrest
    fs('rgba(140,100,70,0.28)');fr(wxi+ww*0.08,wy3+wh*0.28,ww*0.84,wh*0.28);
    // Seat cushion highlight
    fs('rgba(180,140,100,0.08)');fr(wxi+ww*0.12,wy3+wh*0.56,ww*0.76,wh*0.06);
    // Passenger silhouettes (simple)
    for(var ps=0;ps<2;ps++){
      var ppx=wxi+ww*0.2+ps*ww*0.3;
      fs('rgba(30,20,25,0.5)');cx.beginPath();cx.arc(ppx+ww*0.05,wy3+wh*0.25,ww*0.07,0,6.28);cx.fill();
      fs('rgba(30,20,25,0.4)');fr(ppx,wy3+wh*0.32,ww*0.1,wh*0.25);
    }
    // White painted window frame (绿皮火车 style — simple rectangle)
    ss(C.bw,1.5);cx.globalAlpha=0.35;cx.strokeRect(wxi,wy3,ww,wh);cx.globalAlpha=1;
    // Glass reflection
    fs('rgba(240,235,245,0.04)');fr(wxi+ww*0.06,wy3+wh*0.05,ww*0.15,wh*0.35);
  }
  fs('#3A2040');fr(cx2,cy+ch-10,cw,12);
  ss('rgba(155,139,176,0.12)',0.5);cx.strokeRect(cx2,cy+ch-10,cw,12);
  for(var bi=0;bi<2;bi++){
    var bx3=cx2+cw*0.2+bi*cw*0.55,by4=cy+ch-4;
    fs('#2A1040');fr(bx3-18,by4-2,36,10);
    ss('rgba(155,139,176,0.18)',0.6);cx.strokeRect(bx3-18,by4-2,36,10);
    ss('rgba(155,139,176,0.15)',1);
    cx.beginPath();cx.moveTo(bx3-15,by4+1);cx.lineTo(bx3-10,by4-3);
    cx.lineTo(bx3-2,by4-3);cx.lineTo(bx3+6,by4-3);cx.lineTo(bx3+10,by4-1);
    cx.lineTo(bx3+15,by4+1);cx.stroke();
    for(var wi2=0;wi2<2;wi2++){
      var wx4=bx3-5+wi2*14,wy4=by4+9;
      fs('#1A0A30');cx.beginPath();cx.arc(wx4,wy4,9,0,6.28);cx.fill();
      ss(C.fg,2.2);cx.beginPath();cx.arc(wx4,wy4,9,0,6.28);cx.stroke();
      ss('rgba(155,139,176,0.3)',0.8);cx.beginPath();cx.arc(wx4,wy4,7,0,6.28);cx.stroke();
      fs(C.fg2);cx.beginPath();cx.arc(wx4,wy4,3,0,6.28);cx.fill();
      ss(C.fg,1);cx.beginPath();cx.arc(wx4,wy4,3,0,6.28);cx.stroke();
      fs(C.go);cx.beginPath();cx.arc(wx4,wy4,1.2,0,6.28);cx.fill();
      ss('rgba(125,155,139,0.35)',1);
      for(var sp=0;sp<6;sp++){
        var ang=sp*Math.PI/3+t*3;
        cx.beginPath();cx.moveTo(wx4+Math.cos(ang)*3.3,wy4+Math.sin(ang)*3.3);
        cx.lineTo(wx4+Math.cos(ang)*7.5,wy4+Math.sin(ang)*7.5);cx.stroke();
      }
    }
  }
  if(!ca.last){
    fs('#1A0A30');fr(cx2+cw-6,cy+ch*0.36,7,ch*0.16);
    ss('rgba(155,139,176,0.22)',0.5);cx.strokeRect(cx2+cw-6,cy+ch*0.36,7,ch*0.16);
    ss('rgba(180,150,210,0.16)',0.5);
    cx.beginPath();cx.moveTo(cx2+cw-2,cy+ch*0.44);cx.lineTo(cx2+cw+10,cy+ch*0.44);cx.stroke();
  }
  fs('rgba(155,139,176,0.25)');cx.font='7px system-ui';cx.textAlign='left';
  cx.fillText('NO.'+(ca.last?'6':String(ca.ci+1)),cx2+9,cy+18);
  if(ca.last){
    var a=0.15+0.1*Math.sin(t*2.5);
    ss('rgba(232,152,168,'+(0.3+a)+')',1.8);cx.strokeRect(cx2+2,cy+2,cw-4,ch-4);
    var dz=cx.createLinearGradient(cx2,cy+ch-28,cx2,cy+ch);
    dz.addColorStop(0,'transparent');dz.addColorStop(1,'rgba(232,152,168,0.1)');
    fs(dz);fr(cx2,cy+ch-28,cw,28);
    ss('rgba(232,152,168,'+(0.4+a*0.5)+')',0.8);
    cx.beginPath();cx.moveTo(cx2+12,cy+ch-20);cx.lineTo(cx2+cw-12,cy+ch-20);cx.stroke();
    fs('rgba(232,152,168,'+(0.5+a*0.3)+')');cx.font='8px system-ui';cx.textAlign='center';
    cx.fillText('DETACH',cx2+cw/2,cy+ch-8);
  }
}

// ===================================================================
// PHASE 2: SMALL LOCO + SURVIVAL CAR
// ===================================================================
function drawCamp(t){
  // Sky + ground
  var sky2=cx.createLinearGradient(0,0,0,H);
  sky2.addColorStop(0,C.tp3);sky2.addColorStop(0.4,C.tp2);sky2.addColorStop(0.7,C.tp);sky2.addColorStop(1,'#2A1030');fs(sky2);fr(0,0,W,H);
  // Stars
  for(var i=0;i<stars.length;i++){
    var s=stars[i];fs(C.bw);cx.globalAlpha=s.a*(0.5+0.5*Math.sin(t*s.ts+s.tw));
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill();
  }cx.globalAlpha=1;
  // Ground
  fs('#180828');fr(0,H*0.72,W,H*0.28);
  for(var bi=0;bi<60;bi++){fs('rgba(60,30,70,0.06)');fr(Math.random()*W,H*0.73+Math.random()*H*0.25,1.5,0.7);}

  // Small locomotive (left)
  var lx2=30,ly2=H*0.28,lw=W*0.30,lh=H*0.44;
  // Loco body
  var lg3=cx.createLinearGradient(lx2,ly2,lx2,ly2+lh);
  lg3.addColorStop(0,'#4A3A3A');lg3.addColorStop(0.5,'#3A2828');lg3.addColorStop(1,'#2A1A1A');
  fs(lg3);fr(lx2,ly2,lw,lh);
  // Boiler (round)
  fs('#3A2828');cx.beginPath();cx.ellipse(lx2+lw*0.25,ly2+lh*0.5,12,lh*0.28,0,0,6.28);cx.fill();
  ss(C.go,0.8);cx.globalAlpha=0.3;cx.beginPath();cx.ellipse(lx2+lw*0.25,ly2+lh*0.5,12,lh*0.28,0,0,6.28);cx.stroke();cx.globalAlpha=1;
  // Chimney
  fs('#2A1A1A');fr(lx2+lw*0.15,ly2-12,10,16);
  ss('rgba(192,160,96,0.2)',0.8);cx.strokeRect(lx2+lw*0.15,ly2-12,10,16);
  // Smoke
  for(var si=0;si<4;si++){
    var sy2=ly2-16-si*14+Math.sin(t*1.5+si)*5;
    fs(C.bw);cx.globalAlpha=0.06+0.02*Math.sin(t*2+si);
    cx.beginPath();cx.arc(lx2+lw*0.2+Math.sin(t+si)*4,sy2,5+si*2.5,0,6.28);cx.fill();
  }cx.globalAlpha=1;
  // Cowcatcher
  fs('#2A1A1A');cx.beginPath();cx.moveTo(lx2-4,ly2+lh);cx.lineTo(lx2-6,ly2+lh-14);cx.lineTo(lx2+8,ly2+lh);cx.closePath();cx.fill();
  // Loco wheels (large)
  for(var wi3=0;wi3<2;wi3++){
    var wx5=lx2+lw*0.22+wi3*lw*0.4,wy5=ly2+lh+4;
    fs('#1A0A30');cx.beginPath();cx.arc(wx5,wy5,7,0,6.28);cx.fill();
    ss(C.fg,2);cx.beginPath();cx.arc(wx5,wy5,7,0,6.28);cx.stroke();
    fs(C.go);cx.beginPath();cx.arc(wx5,wy5,1,0,6.28);cx.fill();
    ss('rgba(125,155,139,0.3)',0.8);
    for(var sp=0;sp<5;sp++){var a2=sp*Math.PI*2/5+t*2;cx.beginPath();cx.moveTo(wx5+Math.cos(a2)*1.5,wy5+Math.sin(a2)*1.5);cx.lineTo(wx5+Math.cos(a2)*6,wy5+Math.sin(a2)*6);cx.stroke();}
  }

  // Passenger car (right)
  var cx3=lx2+lw+12,cy3=ly2,cw2=W*0.45,ch2=lh;
  var ug2=cx.createLinearGradient(cx3,cy3,cx3,cy3+ch2*0.5);
  ug2.addColorStop(0,C.fg3);ug2.addColorStop(0.5,C.fg);ug2.addColorStop(1,C.fg2);fs(ug2);fr(cx3,cy3,cw2,ch2*0.5);
  var lg4=cx.createLinearGradient(cx3,cy3+ch2*0.5,cx3,cy3+ch2);
  lg4.addColorStop(0,C.fg);lg4.addColorStop(1,C.fg2);fs(lg4);fr(cx3,cy3+ch2*0.5,cw2,ch2*0.5);
  // Coachline — YELLOW
  ss('#D4B830',1.4);cx.globalAlpha=0.6;
  cx.beginPath();cx.moveTo(cx3+6,cy3+ch2*0.5);cx.lineTo(cx3+cw2-6,cy3+ch2*0.5);cx.stroke();
  cx.globalAlpha=1;
  // Thin bottom yellow stripe
  ss('#D4B830',0.6);cx.globalAlpha=0.4;
  cx.beginPath();cx.moveTo(cx3+4,cy3+ch2-12);cx.lineTo(cx3+cw2-4,cy3+ch2-12);cx.stroke();
  cx.globalAlpha=1;
  // Windows — 绿皮火车 style, horizontal rectangle, 2 per car
  var ww2=cw2*0.36,wh2=ww2*0.72,wy6=cy3+ch2*0.14;
  var wGap2=(cw2-ww2*2)/3;
  for(var wi5=0;wi5<2;wi5++){
    var wx6=cx3+wGap2+wi5*(ww2+wGap2);
    // Interior
    fs('rgba(40,25,30,0.7)');fr(wx6,wy6,ww2,wh2);
    // Seats
    fs('rgba(120,90,60,0.3)');fr(wx6+ww2*0.08,wy6+wh2*0.55,ww2*0.84,wh2*0.1);
    fs('rgba(140,100,70,0.24)');fr(wx6+ww2*0.08,wy6+wh2*0.28,ww2*0.84,wh2*0.28);
    // Passengers
    for(var ps=0;ps<2;ps++){
      var ppx=wx6+ww2*0.2+ps*ww2*0.3;
      fs('rgba(30,20,25,0.4)');cx.beginPath();cx.arc(ppx+ww2*0.05,wy6+wh2*0.25,ww2*0.06,0,6.28);cx.fill();
      fs('rgba(30,20,25,0.35)');fr(ppx,wy6+wh2*0.32,ww2*0.08,wh2*0.22);
    }
    ss(C.bw,1.4);cx.globalAlpha=0.3;cx.strokeRect(wx6,wy6,ww2,wh2);cx.globalAlpha=1;
    fs('rgba(240,235,245,0.03)');fr(wx6+ww2*0.06,wy6+wh2*0.05,ww2*0.12,wh2*0.3);
  }
  // Car roof
  fs('#2A0845');fr(cx3,cy3-6,cw2,7);
  // Car wheels
  for(var wi4=0;wi4<2;wi4++){
    var wx7=cx3+cw2*0.22+wi4*cw2*0.5,wy7=cy3+ch2+4;
    fs('#1A0A30');cx.beginPath();cx.arc(wx7,wy7,6,0,6.28);cx.fill();
    ss(C.fg,1.6);cx.beginPath();cx.arc(wx7,wy7,6,0,6.28);cx.stroke();
    fs(C.go);cx.beginPath();cx.arc(wx7,wy7,1,0,6.28);cx.fill();
    ss('rgba(125,155,139,0.3)',0.6);
    for(var sp=0;sp<4;sp++){var a3=sp*Math.PI/2+t*2;cx.beginPath();cx.moveTo(wx7+Math.cos(a3)*1.3,wy7+Math.sin(a3)*1.3);cx.lineTo(wx7+Math.cos(a3)*5,wy7+Math.sin(a3)*5);cx.stroke();}
  }

  // Fire by the tracks
  var fx2=lx2+lw+6,fy2=H*0.73;
  for(var fi=0;fi<3;fi++){
    fs('#e898a8');cx.globalAlpha=0.2+0.12*Math.sin(t*8+fi);
    cx.beginPath();cx.arc(fx2+Math.sin(t*6+fi)*3,fy2-5-fi*2,3+fi*1.5,0,6.28);cx.fill();
  }
  fs(C.go);cx.globalAlpha=0.25+0.12*Math.sin(t*10);
  cx.beginPath();cx.arc(fx2,fy2-2,4,0,6.28);cx.fill();cx.globalAlpha=1;

  // === 3 CREW MEMBERS seated in a row (right side of camp) ===
  var crewX=W-130,crewY=H*0.58;
  fs('rgba(20,5,25,0.5)');fr(crewX-10,crewY-5,110,30);
  ss('rgba(125,155,139,0.15)',0.5);cx.strokeRect(crewX-10,crewY-5,110,30);
  var availCrew2=crewHealth-(explorerAway?1:0);
  for(var mi=0;mi<availCrew2;mi++){
    var mx3=crewX+20+mi*32,my3=crewY;
    // Body
    fs('rgba(60,40,50,0.55)');fr(mx3-5,my3+2,10,14);
    // Head
    fs('rgba(60,40,50,0.6)');cx.beginPath();cx.arc(mx3,my3-2,5,0,6.28);cx.fill();
    // Eyes
    fs(C.bw);cx.globalAlpha=0.15;cx.beginPath();cx.arc(mx3-1.5,my3-4,0.8,0,6.28);cx.fill();
    cx.beginPath();cx.arc(mx3+1.5,my3-4,0.8,0,6.28);cx.fill();cx.globalAlpha=1;
    // Arms
    ss('rgba(60,40,50,0.4)',1.5);cx.lineCap='round';
    cx.beginPath();cx.moveTo(mx3-4,my3+4);cx.lineTo(mx3-9,my3+10);cx.stroke();
    cx.beginPath();cx.moveTo(mx3+4,my3+4);cx.lineTo(mx3+9,my3+10);cx.stroke();
  }

  // Wood pile
  if(res.wood>0){
    fs('#6B5A40');fr(W-50,H*0.73-4,30,6);
    ss('rgba(160,130,90,0.2)',0.5);cx.strokeRect(W-50,H*0.73-4,30,6);
  }

  // Girl by the fire (small version)
  var gx2=W-60,gy2=H*0.68;
  fs(C.bw);cx.globalAlpha=0.8;cx.beginPath();cx.arc(gx2,gy2-16,7,0,6.28);cx.fill();
  fs('rgba(20,5,30,0.6)');cx.beginPath();cx.arc(gx2-2,gy2-18,1.2,0,6.28);cx.fill();
  cx.beginPath();cx.arc(gx2+2,gy2-18,1.2,0,6.28);cx.fill();cx.globalAlpha=1;
  // Balloon string
  ss(C.bg,0.6);cx.beginPath();cx.moveTo(gx2+3,gy2-20);cx.quadraticCurveTo(gx2+6,gy2-35,gx2+5,gy2-42);cx.stroke();
  fs(C.dc);cx.globalAlpha=0.7;cx.beginPath();cx.moveTo(gx2+5,gy2-46);cx.bezierCurveTo(gx2+1,gy2-51,gx2-2,gy2-46,gx2+5,gy2-42);cx.bezierCurveTo(gx2+12,gy2-46,gx2+9,gy2-51,gx2+5,gy2-46);cx.fill();cx.globalAlpha=1;
}

// ===================================================================
// ENVIRONMENT (Phase 1)
// ===================================================================
function drawSky(){
  var sky=cx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,C.tp3);sky.addColorStop(0.2,C.tp2);sky.addColorStop(0.4,C.tp);
  sky.addColorStop(0.6,C.tp4);sky.addColorStop(0.8,'#4A2050');sky.addColorStop(1,'#2A1030');
  fs(sky);fr(0,0,W,H);
  var t=Date.now()/1000;
  for(var i=0;i<stars.length;i++){
    var s=stars[i];fs(C.bw);cx.globalAlpha=s.a*(0.5+0.5*Math.sin(t*s.ts+s.tw));
    cx.beginPath();cx.arc(s.x-cam*0.02,s.y,s.r,0,6.28);cx.fill();
  }cx.globalAlpha=1;
}
function drawGround(){
  fs('#180828');fr(0,H*0.78,W,H*0.22);
  for(var bi=0;bi<80;bi++){fs('rgba(60,30,70,'+(0.04+Math.random()*0.06)+')');fr(Math.random()*W,H*0.79+Math.random()*H*0.19,1.5,0.7);}
  for(var rx=-(cam%36);rx<W;rx+=36){
    fs('#1A0A30');fr(rx,H*0.78+2,5,8);
    fs('rgba(155,139,176,0.22)');fr(rx+1.5,H*0.78+2,2,8);
    fs('rgba(192,160,96,0.1)');fr(rx-8,H*0.78+6,21,1.8);
  }
}
function drawSmoke(){
  var t=Date.now()/300,scx=cars[0].x-cam-8;
  for(var si=0;si<5;si++){
    var sy3=55+si*15+Math.sin(t*1.7+si)*7,sr=7+si*3;
    fs(C.bw);cx.globalAlpha=0.04+0.02*Math.sin(t*2+si);
    cx.beginPath();cx.arc(scx-Math.sin(t+si)*5,sy3,sr,0,6.28);cx.fill();
    if(si>1){fs(C.dc);cx.globalAlpha=0.025+0.02*Math.sin(t+si);cx.beginPath();cx.arc(scx-3-Math.sin(t+si)*3,sy3-2,sr*0.5,0,6.28);cx.fill();}
  }cx.globalAlpha=1;
}
function drawVignette(){
  var vig=cx.createRadialGradient(W/2,H*0.4,W*0.2,W/2,H*0.4,W*0.85);
  vig.addColorStop(0,'transparent');vig.addColorStop(0.55,'rgba(20,5,30,0.06)');
  vig.addColorStop(1,'rgba(10,2,20,0.65)');fs(vig);fr(0,0,W,H);
}

// ===================================================================
// MAIN DRAW
// ===================================================================
function draw(){
  cx.clearRect(0,0,W,H);
  if(phase===2){
    drawCamp(Date.now()/1000);
    drawVignette();
    return;
  }
  drawSky();drawGround();drawSmoke();
  var t=Date.now()/1000;
  for(var ci=0;ci<cars.length;ci++){cars[ci].ci=ci;drawCar(cars[ci],cam,t);}
  for(var li=0;li<loot.length;li++){
    var l=loot[li];if(l.got)continue;
    var lx=l.x-cam;if(lx<-40||lx>W+40)continue;
    l.d.draw(lx,l.y);
  }
  drawPlayer(player.x-cam,player.y,t);
  for(var pi=0;pi<pts.length;pi++){
    var p=pts[pi];cx.globalAlpha=p.life/p.ml;fs(p.c);
    cx.beginPath();cx.moveTo(p.x-cam,p.y-p.s);cx.lineTo(p.x-cam+p.s,p.y);
    cx.lineTo(p.x-cam,p.y+p.s);cx.lineTo(p.x-cam-p.s,p.y);cx.closePath();cx.fill();
  }cx.globalAlpha=1;
  drawVignette();

// ===================================================================
// PHASE 2: ACTIONS
// ===================================================================
function skipRation(){
  rationFood=0;rationWater=0;logPage=2;showLogPage();
}
function doConsume(){
  var availCrew=crewHealth-(explorerAway?1:0);
  var needF=rationFood||availCrew,needW=rationWater||availCrew;
  // Consume what was set
  var ate=Math.min(res.food,needF),drank=Math.min(res.water,needW);
  res.food-=ate;res.water-=drank;
  // Shortfall may cause starvation
  if(ate<availCrew||drank<availCrew){
    if(Math.random()<0.3){crewHealth--;}
  }
  if(crewHealth<=0){endGamePhase2(false,'配给不足，全员饥饿而亡');return;}
  rationFood=0;rationWater=0; // reset for next day
  logPage=2;showLogPage();
}

function startExplore(){
  // Send one crew member exploring for 1-6 days
  explorerAway=true;
  explorerReturnDay=day+1+Math.floor(Math.random()*6);
  explorerFound=[];
  document.getElementById('explore-btn')&&(document.getElementById('explore-btn').disabled=true);
  logPage=3;showLogPage();
}

function tendEngine(n){
  if(n>0&&res.coal>=1&&res.water>=1){res.coal-=1;res.water-=1;}
  else if(n>0){
    // Can't fuel — risk injury
    if(Math.random()<0.3){crewHealth--;if(crewHealth<=0){endGamePhase2(false,'锅炉熄火，冻死了');return;}}
  }
  logPage=4;
  // Roll random event
  rollEvent();
  showLogPage();
}

function rollEvent(){
  var r=Math.random();
  var lv=level;
  // Level-dependent event probabilities
  if(lv<=2){eventToday=null;return;}           // Level 2: no bad events
  if(lv===3){                                   // Level 3: light events
    if(r<0.1)eventToday={type:'luck'};
    else eventToday=null;return;
  }
  if(lv===8){                                   // Level 8: rain season
    if(r<0.5)eventToday={type:'rain'};
    else if(r<0.65)eventToday={type:'breakdown'};
    else if(r<0.75)eventToday={type:'mice',loss:1+Math.floor(Math.random()*3)};
    else if(r<0.8)eventToday={type:'sick'};
    else eventToday=null;return;
  }
  if(lv===9){                                   // Level 9: no luck, hard
    if(r<0.25)eventToday={type:'breakdown'};
    else if(r<0.45)eventToday={type:'mice',loss:2+Math.floor(Math.random()*3)};
    else if(r<0.6)eventToday={type:'sick'};
    else if(r<0.7)eventToday={type:'rain'};
    else eventToday=null;return;
  }
  if(lv===10){                                  // Level 10: chaos
    if(r<0.3)eventToday={type:'breakdown'};
    else if(r<0.55)eventToday={type:'sick'};
    else if(r<0.7)eventToday={type:'mice',loss:3+Math.floor(Math.random()*3)};
    else if(r<0.78)eventToday={type:'rain'};
    else eventToday={type:'luck'};return;
  }
  // Levels 4-7: normal distribution
  if(r<0.2)eventToday={type:'breakdown'};
  else if(r<0.35)eventToday={type:'mice',loss:1+Math.floor(Math.random()*3)};
  else if(r<0.45)eventToday={type:'sick'};
  else if(r<0.55)eventToday={type:'rain'};
  else if(r<0.65)eventToday={type:'luck'};
  else eventToday=null;
}

function fixBreakdown(){
  if(res.iron>=1){res.iron-=1;eventToday=null;endDay();}
  else{skipEvent();}
}
function healSick(){
  if(res.meds>=1){res.meds-=1;eventToday=null;endDay();}
  else{skipEvent();}
}
function skipEvent(){
  if(eventToday&&eventToday.type==='sick'){crewHealth--;if(crewHealth<=0){endGamePhase2(false,'病重不治');return;}}
  if(eventToday&&eventToday.type==='breakdown'){/* lose a day but no other penalty */}
  eventToday=null;endDay();
}
function resolveEvent(){
  if(eventToday&&eventToday.type==='mice'){res.food=Math.max(0,res.food-eventToday.loss);}
  if(eventToday&&eventToday.type==='luck'){res.food+=2;res.water+=1;res.coal+=1;}
  eventToday=null;endDay();
}

function endDay(){
  day++;
  // Check explorer return
  if(explorerAway&&day>=explorerReturnDay){
    explorerAway=false;
    // Explorer returns with items (or small chance of loss)
    if(Math.random()<0.15){crewHealth--;explorerFound=[{name:'未归',icon:'💀',amt:0}];}
    else{
      var types2=[{n:'铁片',icon:'🪨',k:'iron'},{n:'煤炭',icon:'🔥',k:'coal'},{n:'水',icon:'💧',k:'water'},{n:'木材',icon:'🪵',k:'wood'},{n:'食物',icon:'🍞',k:'food'},{n:'子弹',icon:'🔫',k:'ammo2'},{n:'猎枪',icon:'🔫',k:'gear2'},{n:'收音机',icon:'📻',k:'comm2'},{n:'棋盘',icon:'♟️',k:'chess2'}];
      explorerFound=[];
      var fcount=2+Math.floor(Math.random()*3);
      for(var fi3=0;fi3<fcount;fi3++){
        var t2=types2[Math.floor(Math.random()*types2.length)];
        var amt2=1+Math.floor(Math.random()*3);
        if(!t2.k.endsWith('2')){res[t2.k]=(res[t2.k]||0)+amt2;}
        explorerFound.push({name:t2.n,icon:t2.icon,amt:amt2});
      }
    }
    if(crewHealth<=0){endGamePhase2(false,'探索者未归，全员覆没');return;}
  }
  // Check level completion (every 5 days in survival levels)
  if(level>=2 && (day-(level-2)*daysPerLevel)>daysPerLevel){
    level++;
    if(level>10){endGamePhase2(true,'抵达远方！50天旅程结束');return;}
    showLevelIntro=true; // Show intro for new level
  }
  logPage=1;eventToday=null;exploreFinds=[];
  showLogPage();
}

function endGamePhase2(win,msg){
  phase=3;hideLogbook();
  document.getElementById('over').classList.add('show');
  document.getElementById('ot').textContent=win?'✦ 旅程完成':'✧ 旅程中断';
  document.getElementById('os').textContent=msg+' (第'+(level>10?10:level)+'关 · Day '+day+')';
}

function updInv(){var h='';for(var i=0;i<ITEMS.length;i++)h+='<span class=iv>'+inv[ITEMS[i].k]+' '+ITEMS[i].n+'</span>';document.getElementById('inv').innerHTML=h;}

function rst(){
  phase=1;level=1;showLevelIntro=false;time=60;st='play';
  document.getElementById('lv').textContent='第1关 · 收集';
  inv={food:0,coal:0,water:0,gear:0,ammo:0,comm:0,chess:0,med:0};
  inLast=false;dc=0;pts=[];loot=[];crewFound=[false,false,false,false,false,false];crewCount=0;
  makeCars();spawnLoot();makeStars();
  player.x=carW()/2;cam=0;
  document.getElementById('over').classList.remove('show');
  document.getElementById('warn').style.opacity='0';
  document.getElementById('hint').style.opacity='1';
  ctrlsDiv.style.display='flex';
  document.getElementById('hud').style.display='flex';
  document.getElementById('inv').style.display='flex';
  document.getElementById('hint').style.display='block';
  hideLogbook();updInv();
}

function gameOverP1(win){st='end';document.getElementById('over').classList.add('show');
  if(win){startPhase2();return;}
  var total=0;for(var k in inv)total+=inv[k];
  document.getElementById('ot').textContent='第1关 失败';
  document.getElementById('os').textContent='未抵达最后一节车厢';
  ctrlsDiv.style.display='none';
}

function collect(it){if(it.got)return;it.got=true;inv[it.d.k]++;updInv();
  for(var i=0;i<8;i++)pts.push({x:it.x,y:it.y,vx:(Math.random()-0.5)*2.5,vy:-2-Math.random()*2.5,life:22,ml:22,c:it.d.c,s:1.5+Math.random()*2});}

function pickup(){for(var i=0;i<loot.length;i++){var l=loot[i];if(l.got)continue;if(Math.abs(player.x-l.x)<38&&Math.abs(player.y-l.y)<44)collect(l);}}

function up(dt){
  if(phase===2){
    pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0;});return;
  }
  if(st!=='play'){pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return;}
  time-=dt;if(time<0)time=0;
  document.getElementById('tm').textContent=Math.ceil(time)+'s';
  document.getElementById('tm').style.color=time<15?C.dc:C.fg;
  if(time<8)document.getElementById('hint').style.opacity='0';
  if(time<=0){gameOverP1(false);return;}
  var dx=joyX;if(keys[37]||keys[65])dx=-1;if(keys[39]||keys[68])dx+=1;
  player.x+=dx*5*60*dt;player.x=Math.max(8,Math.min(cars[NC-1].x+cars[NC-1].w-8,player.x));
  var ci=Math.floor(player.x/carW());if(ci>=0&&ci<NC)player.y=cars[ci].y+cars[ci].h-42;
  // Find crew members in cars 1, 3, 5
  var crewCars2=[0,2,4];
  if(crewCars2.indexOf(ci)>=0&&!crewFound[ci]){
    crewFound[ci]=true;crewCount++;
    var c2=cars[ci];
    var et=[ITEMS[0],ITEMS[2],ITEMS[4]]; // food, water, comm
    loot.push({x:c2.x+c2.w*0.3,y:c2.y+c2.h-38,ci:ci,d:et[0],got:false});
    loot.push({x:c2.x+c2.w*0.6,y:c2.y+c2.h-38,ci:ci,d:et[1],got:false});
    document.getElementById('warn').style.opacity='1';
    document.getElementById('warn').innerHTML='找到同伴！('+crewCount+'/3)';
    setTimeout(function(){document.getElementById('warn').style.opacity='0';},1500);
  }
  cam=player.x-W/2;cam=Math.max(0,Math.min(cars[NC-1].x+cars[NC-1].w-W,cam));
  var inL=ci===NC-1;
  if(inL&&!inLast){inLast=true;dc=0;document.getElementById('warn').style.opacity='1';}
  if(inL&&inLast){dc+=dt;document.getElementById('warn').innerHTML='最后一节<br>停留3秒过关';if(dc>=3)gameOverP1(true);}
  if(!inL&&inLast){inLast=false;dc=0;document.getElementById('warn').style.opacity='0';}
  pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});
}

// Loop
var lt=0;
function loop(ts){var dt=lt?Math.min((ts-lt)/1000,0.1):0.016;lt=ts;try{up(dt);}catch(e){}try{draw();}catch(e){}requestAnimationFrame(loop);}

// Input
var joyX=0,joyActive=false,joyOX=0,joyOY=0,keys={};
var joy=document.getElementById('joy'),stick=document.getElementById('stick');
function joyMove(cx2,cy){var r=joy.getBoundingClientRect();var dx=cx2-r.left,dy=cy-r.top;if(!joyActive){joyOX=dx;joyOY=dy;joyActive=true;}var mx=dx-joyOX,my=dy-joyOY;var d=Math.sqrt(mx*mx+my*my);if(d>30){mx=mx/d*30;my=my/d*30;}stick.style.left=(28+mx)+'px';stick.style.top=(28+my)+'px';joyX=mx/30;}
function joyEnd(){joyActive=false;joyX=0;stick.style.left='28px';stick.style.top='28px';}
joy.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY);});
joy.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY);});
joy.addEventListener('touchend',function(e){e.preventDefault();joyEnd();});
joy.addEventListener('touchcancel',function(e){e.preventDefault();joyEnd();});
joy.addEventListener('mousedown',function(e){e.preventDefault();joyMove(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){if(joyActive)joyMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',function(){if(joyActive)joyEnd();});
document.getElementById('pick').addEventListener('touchstart',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup();});
document.getElementById('pick').addEventListener('mousedown',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup();});
window.addEventListener('keydown',function(e){keys[e.keyCode]=true;if(e.keyCode===32&&st==='play'&&phase===1){e.preventDefault();pickup();}});
window.addEventListener('keyup',function(e){keys[e.keyCode]=false;});

// Start
resize();makeCars();spawnLoot();makeStars();updInv();player.x=carW()/2;requestAnimationFrame(loop);
</script>
</body>
</html>
