<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NIGHT TRAIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#12061E;overflow:hidden;font-family:system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:fixed}
#wrap{position:relative;width:100vw;height:100vh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;background:#12061E;border-radius:6px;max-width:100vw;max-height:56vh;border:1px solid rgba(107,48,160,0.25)}
#styletog{position:absolute;top:9px;right:14px;z-index:12;background:rgba(18,6,30,0.85);border:1px solid rgba(232,152,168,0.25);border-radius:3px;color:#E898A8;font-size:11px;padding:6px 14px;letter-spacing:1.5px;cursor:pointer;font-weight:300}
#loading{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:#12061E;transition:opacity 0.5s}
#loading.done{opacity:0;pointer-events:none}
#loading .bar{width:140px;height:2px;background:rgba(107,48,160,0.2);border-radius:1px;overflow:hidden;margin-top:12px}
#loading .bar div{height:100%;background:linear-gradient(90deg,#6B20A0,#B496D2);transition:width 0.3s;border-radius:1px}
#loading .txt{color:#B496D2;font-size:9px;letter-spacing:2px;font-weight:300}
#hud{position:absolute;top:10px;left:12px;right:60px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.hb{background:transparent;border:1px solid rgba(155,139,176,0.15);border-radius:3px;padding:6px 14px;font-size:13px;color:#D4C4E8;letter-spacing:1.8px;font-weight:300}
#ver{position:absolute;top:10px;right:60px;z-index:12;color:rgba(232,152,168,0.5);font-size:8px;letter-spacing:1px;pointer-events:none}
#inv{position:absolute;bottom:84px;left:10px;right:10px;display:flex;gap:5px;justify-content:center;pointer-events:none;z-index:10;flex-wrap:wrap}
.iv{background:rgba(18,6,30,0.95);border:1px solid rgba(155,139,176,0.25);border-radius:3px;padding:4px 10px;font-size:10px;color:#C8B8D8}
#hint{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);color:rgba(180,160,200,0.45);font-size:9px;letter-spacing:2.5px;pointer-events:none;z-index:5;font-weight:200}
#joy{width:96px;height:96px;background:radial-gradient(circle at 35% 35%,rgba(42,37,53,0.4),rgba(18,6,30,0.6));border:1.5px solid rgba(107,48,160,0.18);border-radius:50%;position:relative;touch-action:none}
#stick{width:40px;height:40px;background:radial-gradient(circle at 40% 40%,rgba(196,168,224,0.3),rgba(110,95,133,0.15));border:1px solid rgba(155,139,176,0.35);border-radius:50%;position:absolute;top:28px;left:28px;pointer-events:none}
#pick{width:60px;height:60px;background:linear-gradient(135deg,rgba(155,184,168,0.12),rgba(90,110,100,0.06));border:1.5px solid rgba(125,155,139,0.25);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(155,184,168,0.6);margin-bottom:18px;touch-action:none}
#pick:active{background:rgba(125,155,139,0.22)}
#ctrls{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;z-index:10}
#warn{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);color:#E898A8;font-size:12px;letter-spacing:2px;pointer-events:none;z-index:5;opacity:0;text-align:center;font-weight:300}
#logbook{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:30;background:#1E1A22;border-radius:6px;padding:20px 16px;border:1px solid rgba(58,48,64,0.3)}
#logbook.show{display:flex}
.lb-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lb-day{font-size:14px;color:#C4A8E0;letter-spacing:2px;font-weight:200}
.lb-dots{display:flex;gap:7px}
.lb-dot{width:7px;height:7px;border-radius:50%;background:rgba(155,139,176,0.12)}
.lb-dot.active{background:#C4A8E0}
.lb-content{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.lb-title{font-size:13px;color:#8B7BA0;letter-spacing:3px;margin-bottom:10px;font-weight:300}
.lb-text{font-size:12px;color:#9B8BB0;line-height:1.8;margin-bottom:14px;max-width:280px;font-weight:300}
.lb-res{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.lb-ri{font-size:11px;color:#7D9B8B;background:rgba(125,155,139,0.06);border:1px solid rgba(125,155,139,0.15);border-radius:3px;padding:5px 12px;letter-spacing:1px}
.lb-ri.low{color:#E898A8;border-color:rgba(232,152,168,0.2)}
.lb-btn{background:linear-gradient(180deg,rgba(125,155,139,0.1),rgba(90,110,100,0.04));border:1px solid rgba(125,155,139,0.22);color:#B496D2;padding:14px 32px;border-radius:5px;font-size:13px;letter-spacing:2px;cursor:pointer;font-weight:300;margin:5px;min-width:80px}
.lb-btn:active{background:rgba(125,155,139,0.2)}
.lb-btn.warn{background:linear-gradient(180deg,rgba(232,152,168,0.08),rgba(180,100,120,0.03));border-color:rgba(232,152,168,0.22);color:#E898A8}
#over{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:linear-gradient(180deg,rgba(8,2,18,0.98),rgba(18,6,32,0.96));border-radius:6px}
#over.show{display:flex}
.ot{font-size:18px;color:#C4A8E0;letter-spacing:4px;margin-bottom:8px;font-weight:200}
.os{font-size:12px;color:#9B8BB0;margin-bottom:18px;font-weight:300;line-height:1.7;text-align:center}
.btn{background:linear-gradient(180deg,rgba(125,155,139,0.1),rgba(90,110,100,0.04));border:1px solid rgba(125,155,139,0.2);color:#B496D2;padding:14px 32px;border-radius:5px;font-size:14px;letter-spacing:2px;cursor:pointer;min-width:100px}
.btn:active{background:rgba(125,155,139,0.2)}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g"></canvas>
<button id="styletog" onclick="toggleStyle()">◈ 晶层</button>
<div id="hud"><span class="hb" id="tm">60s</span><span class="hb" id="lv">第1关</span></div>
<div id="ver">v30</div>
<div id="inv"></div>
<div id="hint">拖动摇杆 · 点击拾取</div>
<div id="warn"></div>
<div id="ctrls"><div id="joy"><div id="stick"></div></div><div id="pick">◈</div></div>
<div id="logbook"><div class="lb-header"><span class="lb-day" id="lb-day"></span><div class="lb-dots" id="lb-dots"></div></div><div class="lb-content" id="lb-content"></div><div class="lb-nav" id="lb-nav"></div></div>
<div id="over"><div class="ot" id="ot"></div><div class="os" id="os"></div><button class="btn" onclick="rst()">重返</button></div>
</div>
<script>
// ===== SETUP =====
var g=document.getElementById('g'), cx=g.getContext('2d');
var W,H;
function resize(){W=Math.min(window.innerWidth-12,500);H=Math.min(window.innerHeight*0.54,600);g.width=W;g.height=H;clearDotCache();}
resize();

// ===== STABLE DOT ENGINE — pre-baked pointillism (RR Starlight) =====
var DOT_SIZES=[0.8,1.2,1.6,2.2,3.0,4.2];
var dotCache={};
// Simple hash-based PRNG for fixed positions
function hash(x,y,s){return((x*374761393+y*668265263+s*1274126177)&0x7fffffff)/0x7fffffff;}
function dsize(seed){return DOT_SIZES[Math.floor(hash(0,seed,0)*6)];}
// Pick a color from array using seed
function pickCol(colors,seed){return colors[Math.floor(hash(1,seed,0)*colors.length)];}
// Bake dots into array: {x,y,s,c} — x,y relative to origin
function bakeRect(key,w,h,colors,density){
  if(dotCache[key])return dotCache[key];
  var dots=[],n=Math.floor(w*h*density),i;
  for(i=0;i<n;i++){
    dots.push({x:hash(2,i,key)*w,y:hash(3,i,key)*h,s:dsize(i+key*100),c:pickCol(colors,i)});
  }
  dotCache[key]=dots;return dots;
}
function bakeGrad(key,w,h,topCols,botCols,density){
  if(dotCache[key])return dotCache[key];
  var dots=[],n=Math.floor(w*h*density),i;
  for(i=0;i<n;i++){
    var dx=hash(2,i,key)*w,dy=hash(3,i,key)*h,t=Math.min(1,dy/h);
    var cols=t<0.4?topCols:(t>0.6?botCols:(hash(4,i,key)<0.5?topCols:botCols));
    dots.push({x:dx,y:dy,s:dsize(i+key*100),c:pickCol(cols,i)});
  }
  dotCache[key]=dots;return dots;
}
// Draw baked dots at offset (ox,oy)
function drawBake(dots,ox,oy){
  for(var i=0;i<dots.length;i++){
    var d=dots[i];cx.fillStyle=d.c;
    cx.beginPath();cx.arc(ox+d.x,oy+d.y,d.s,0,6.28);cx.fill();
  }
}
// Clear dot cache (call on resize)
function clearDotCache(){dotCache={};}

// ===== CORPUS COLORS =====
var C={
  nightDeep:'#12061E',tucana:'#4E1D73',tucanaLight:'#6B30A0',
  fameGreen:'#7D9B8B',fameDark:'#5C7A6C',fameLight:'#9BB8A8',fameDeep:'#4A6B5A',
  bw:'#F0EBF5',bg:'#9B8BB0',bgDark:'#6E5F85',
  dustyCoral:'#E898A8',petraGold:'#C0A060',vapourViolet:'#C4A8E0',
  coach:'#D4B830',
  pvdDark:'#1A1622',pvdMid:'#2A2535',pvdEdge:'#3A3040',
  deepBg:'#1A0A30',groundBase:'#180828'
};

// ===== HELPERS =====
function fr(x,y,w,h){cx.fillRect(x,y,w,h)}
function fa(x,y,r){cx.beginPath();cx.arc(x,y,r,0,6.28);cx.fill()}
function fs(c){cx.fillStyle=c}
function ss(c,w){cx.strokeStyle=c;cx.lineWidth=w||0.8}

// ===== LEVEL DATA =====
var LEVELS=[
  {name:'暗夜',eng:'Night',sky:['#0A0418','#120820','#1E0C32','#2A1048','#1A0C28'],horizon:'#1A0C28',
   fog:'rgba(20,10,40,0.55)',particles:'stars',particleDensity:80,starBoost:1.2,
   ground1:'#181028',ground2:'#221838',accent:'rgba(107,48,160,0.15)',weather:null},
  {name:'拂晓',eng:'Dawn',sky:['#181028','#2A1848','#4A3070','#8A6080','#B89098'],
   fog:'rgba(180,140,160,0.2)',particles:'mist',particleDensity:30,starBoost:0.2,
   horizon:'#4A3060',ground1:'#2A2040',ground2:'#382850',accent:'rgba(180,140,160,0.12)',weather:'mist'},
  {name:'迷雾',eng:'Mist',sky:['#1A1830','#282840','#3A3858','#585878','#787898'],
   fog:'rgba(120,130,160,0.5)',particles:'fog',particleDensity:60,starBoost:0,
   horizon:'#3A3858',ground1:'#282840',ground2:'#383858',accent:'rgba(160,160,180,0.08)',weather:'fog'},
  {name:'金阳',eng:'Golden',sky:['#1A1030','#3A2050','#8A5070','#C89068','#E8C878'],
   fog:'rgba(200,160,100,0.2)',particles:'dust',particleDensity:20,starBoost:0,
   horizon:'#6A4070',ground1:'#3A2850',ground2:'#5A3868',accent:'rgba(200,160,100,0.18)',weather:'dust'},
  {name:'阴云',eng:'Overcast',sky:['#181828','#282838','#3A3A4A','#585868','#787888'],
   fog:'rgba(120,120,140,0.4)',particles:'clouds',particleDensity:25,starBoost:0,
   horizon:'#383848',ground1:'#282838',ground2:'#3A3A48',accent:'rgba(160,160,180,0.1)',weather:'overcast'},
  {name:'雷暴',eng:'Storm',sky:['#0A0A18','#181028','#282040','#403060','#584878'],
   fog:'rgba(40,30,60,0.5)',particles:'lightning',particleDensity:40,starBoost:0.3,
   horizon:'#282040',ground1:'#181028',ground2:'#2A2040',accent:'rgba(120,100,160,0.1)',weather:'storm'},
  {name:'尘暴',eng:'Dust',sky:['#1A1410','#2A2018','#483828','#685040','#887058'],
   fog:'rgba(130,100,80,0.45)',particles:'sand',particleDensity:50,starBoost:0,
   horizon:'#483828',ground1:'#382820',ground2:'#504030',accent:'rgba(180,140,100,0.1)',weather:'sand'},
  {name:'暴雨',eng:'Monsoon',sky:['#080C18','#101828','#182440','#283860','#385080'],
   fog:'rgba(40,50,80,0.4)',particles:'rain',particleDensity:120,starBoost:0,
   horizon:'#182440',ground1:'#101828',ground2:'#202838',accent:'rgba(80,100,140,0.15)',weather:'rain'},
  {name:'流星',eng:'Meteor',sky:['#0A0418','#120820','#1E0C32','#3A1850','#2A1048'],
   fog:'rgba(30,15,50,0.35)',particles:'meteors',particleDensity:50,starBoost:2.0,
   horizon:'#1E0C32',ground1:'#181028',ground2:'#281838',accent:'rgba(140,80,200,0.2)',weather:'meteor'},
  {name:'终点',eng:'Arrival',sky:['#1A0828','#3A1850','#7A4080','#C8A870','#D4C888'],
   fog:'rgba(200,180,140,0.25)',particles:'sparkles',particleDensity:40,starBoost:0.8,
   horizon:'#5A3070',ground1:'#2A1840',ground2:'#4A2860',accent:'rgba(220,200,160,0.2)',weather:'sparkle'}
];

// Weather particle pool
var weatherParticles=[];
function initWeather(clv){
  weatherParticles=[];
  var lv=LEVELS[clv-1]||LEVELS[0],n=lv.particleDensity;
  for(var i=0;i<n;i++){
    var p={x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,life:1,maxLife:1,size:0.5+Math.random()*2};
    if(lv.weather==='rain'){p.vy=8+Math.random()*8;p.vx=-1+Math.random()*2;p.size=0.3+Math.random()*0.5;p.color='rgba(140,170,220,0.4)'}
    else if(lv.weather==='mist'||lv.weather==='fog'){p.vy=0.1+Math.random()*0.3;p.vx=-0.2+Math.random()*0.4;p.size=8+Math.random()*20;p.color='rgba(180,180,200,0.06)'}
    else if(lv.weather==='dust'||lv.weather==='sand'){p.vy=0.1+Math.random()*0.2;p.vx=0.5+Math.random()*1.5;p.size=2+Math.random()*5;p.color='rgba(180,140,100,0.08)'}
    else if(lv.weather==='storm'){p.vy=1+Math.random()*3;p.vx=-2+Math.random()*4;p.size=1+Math.random()*3;p.color='rgba(120,100,160,0.06)'}
    else if(lv.weather==='overcast'){p.vy=0.05+Math.random()*0.15;p.vx=-0.3+Math.random()*0.6;p.size=10+Math.random()*25;p.color='rgba(140,140,160,0.05)'}
    else if(lv.weather==='meteor'){p.x=Math.random()*W;p.y=-20-Math.random()*60;p.vy=4+Math.random()*6;p.vx=-1+Math.random()*2;p.size=0.8+Math.random()*1.5;p.color=C.bw;p.maxLife=0.3+Math.random()*0.5}
    else if(lv.weather==='sparkle'){p.vy=0;p.vx=0;p.size=1+Math.random()*2;p.color=C.petraGold;p.maxLife=2+Math.random()*4}
    weatherParticles.push(p);
  }
}

function updateWeather(dt){
  var lv=LEVELS[level-1]||LEVELS[0];
  for(var i=0;i<weatherParticles.length;i++){
    var p=weatherParticles[i];
    p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.life-=dt;
    if(p.life<=0||p.y>H+50||p.x<-50||p.x>W+50){
      p.life=p.maxLife;p.x=Math.random()*W;
      if(lv.weather==='rain'||lv.weather==='meteor')p.y=-20-Math.random()*40;
      else p.y=Math.random()*H;
    }
  }
}

// ===== ITEMS (shadow + gradient + highlight for pseudo-3D) =====
function drawFood(x,y){var s=1.15;cx.save();cx.translate(x-5*s,y-7*s);
  cx.shadowColor='rgba(10,3,20,0.5)';cx.shadowBlur=3*s;cx.shadowOffsetY=1.5*s;
  // Can body
  var g=cx.createLinearGradient(0,0,10*s,0);g.addColorStop(0,'#B89060');g.addColorStop(0.3,'#D4B080');g.addColorStop(0.6,'#C8A070');g.addColorStop(1,'#8B6840');
  fs(g);fr(1*s,2*s,8*s,7*s);
  // Lid
  var lg=cx.createLinearGradient(0,0,0,2*s);lg.addColorStop(0,C.petraGold);lg.addColorStop(1,'#B89060');fs(lg);fr(0,0,10*s,2*s);
  // Bottom rim
  fs('#6B5040');fr(0,8*s,10*s,1.8*s);
  // Edge strokes
  cx.shadowBlur=0;ss(C.petraGold,0.8*s);cx.strokeRect(1*s,2*s,8*s,7*s);
  // Highlight
  fs('rgba(255,255,255,0.2)');fr(2*s,3*s,2*s,5*s);
  cx.restore()}
function drawCoal(x,y){var s=1.25;cx.save();cx.translate(x-5*s,y-6*s);
  cx.shadowColor='rgba(10,3,20,0.55)';cx.shadowBlur=3*s;cx.shadowOffsetY=1.5*s;
  // Coal chunk
  fs('#3A3048');cx.beginPath();cx.moveTo(5*s,0);cx.lineTo(9*s,2*s);cx.lineTo(10*s,5*s);cx.lineTo(8*s,9*s);cx.lineTo(4*s,10*s);cx.lineTo(0,7*s);cx.lineTo(1*s,3*s);cx.closePath();cx.fill();
  // Facet highlights
  fs('rgba(180,160,200,0.2)');cx.beginPath();cx.moveTo(5*s,0);cx.lineTo(9*s,2*s);cx.lineTo(6*s,4*s);cx.lineTo(3*s,2*s);cx.closePath();cx.fill();
  fs('rgba(255,255,255,0.15)');cx.beginPath();cx.moveTo(1*s,3*s);cx.lineTo(3*s,2*s);cx.lineTo(4*s,6*s);cx.lineTo(2*s,6*s);cx.closePath();cx.fill();
  cx.shadowBlur=0;ss('rgba(155,139,176,0.5)',1*s);cx.stroke();
  cx.restore()}
function drawWater(x,y){var s=1.15;cx.save();cx.translate(x-5*s,y-7*s);
  cx.shadowColor='rgba(10,3,20,0.45)';cx.shadowBlur=3*s;cx.shadowOffsetY=1.5*s;
  // Bottle
  var wg=cx.createLinearGradient(0,0,10*s,0);wg.addColorStop(0,'#588090');wg.addColorStop(0.4,'#88B8C8');wg.addColorStop(0.7,'#70A0B0');wg.addColorStop(1,'#385868');
  fs(wg);cx.beginPath();cx.arc(5*s,5*s,5*s,0,6.28);cx.fill();
  // Cap
  fs('#4A6070');fr(3*s,-1.5*s,4*s,3*s);
  // Neck
  fs('#608898');fr(3.5*s,-2.8*s,3*s,1.8*s);
  // Water fill line
  fs('rgba(140,200,220,0.25)');fr(1.5*s,1.5*s,7*s,3*s);
  // Highlight
  cx.shadowBlur=0;ss(C.fameGreen,1*s);cx.stroke();
  fs('rgba(255,255,255,0.3)');cx.beginPath();cx.arc(3*s,3.5*s,1.5*s,0,6.28);cx.fill();
  cx.restore()}
function drawGun(x,y){var s=1.25;cx.save();cx.translate(x-6*s,y-5*s);
  cx.shadowColor='rgba(10,3,20,0.5)';cx.shadowBlur=3*s;cx.shadowOffsetY=1.5*s;
  // Barrel
  var bg=cx.createLinearGradient(0,0,0,3*s);bg.addColorStop(0,'#706888');bg.addColorStop(0.5,'#9080A8');bg.addColorStop(1,'#504868');
  fs(bg);fr(2*s,1*s,8*s,3*s);
  // Stock
  var sg=cx.createLinearGradient(0,0,5*s,0);sg.addColorStop(0,'#605878');sg.addColorStop(1,'#403858');
  fs(sg);fr(1*s,3.5*s,5*s,5*s);
  // Grip
  fs('#483860');fr(2.5*s,7.5*s,4*s,3*s);
  // Muzzle
  fs('#302840');fr(10*s,1.5*s,2*s,2*s);
  cx.shadowBlur=0;ss(C.bgDark,0.8*s);cx.strokeRect(2*s,1*s,8*s,3*s);
  // Highlight
  fs('rgba(255,255,255,0.15)');fr(3*s,1.5*s,6*s,1*s);
  cx.restore()}
function drawRadio(x,y){var s=1.15;cx.save();cx.translate(x-7*s,y-6*s);
  cx.shadowColor='rgba(10,3,20,0.5)';cx.shadowBlur=3*s;cx.shadowOffsetY=1.5*s;
  // Body
  var rg=cx.createLinearGradient(0,0,12*s,0);rg.addColorStop(0,'#8B7860');rg.addColorStop(0.5,'#B8A088');rg.addColorStop(1,'#685848');
  fs(rg);fr(1*s,1*s,12*s,9*s);
  // Screen

// ===== PLAYER — stable Banksy girl dots =====
function drawPlayer(px,py,t){
  var s=2.5;cx.save();cx.translate(px,py-30*s);
  var wind=Math.sin(t*1.2)*0.3*s,ol='#5A3890',fl='#F5F0F8';

  // Shadow
  cx.fillStyle='rgba(10,3,20,0.1)';cx.beginPath();cx.ellipse(0,30*s,5*s,1*s,0,0,6.28);cx.fill();

  // === BALLOON STRING ===
  for(var si=0;si<12;si++){var st=si/11,ssx=2*s+(5*s+wind-2*s)*st,ssy=-2*s-32*s*st+Math.sin(st*2)*2*s;
    cx.fillStyle='rgba(160,140,200,0.3)';cx.beginPath();cx.arc(ssx,ssy,0.6,0,6.28);cx.fill();
  }

  // === HEART ===
  var hx=4*s+wind,hy=-35*s;var hs=s*6;
  for(var hi=0;hi<40;hi++){var ah=hash(hi,0,'heart'),ahx=hx+(ah-0.5)*hs*3,ahy=hy+(hash(hi,1,'heart')-0.5)*hs*2;
    cx.fillStyle='#6B3FA0';cx.globalAlpha=0.75;
    cx.beginPath();cx.arc(ahx,ahy,0.8+hash(hi,2,'heart')*2.5,0,6.28);cx.fill();
  }cx.globalAlpha=1;

  // === DRESS ===
  for(var di=0;di<250;di++){var dx=(hash(di,0,'dress')-0.35)*12*s,dy=hash(di,1,'dress')*24*s;
    cx.fillStyle=fl;cx.globalAlpha=0.8;
    cx.beginPath();cx.arc(dx,dy,0.8+hash(di,2,'dress')*2.5,0,6.28);cx.fill();
  }cx.globalAlpha=1;
  // Outline
  for(var oi=0;oi<80;oi++){
    var ot=oi/79,ox,oy;
    if(ot<0.25){ox=-4*s+(-5.5*s+4*s)*ot*4;oy=4*s+(15*s-4*s)*ot*4;}
    else if(ot<0.5){var t2=(ot-0.25)*4;ox=-5.5*s+(1*s+5.5*s)*t2;oy=15*s+(22*s-15*s)*t2;}
    else if(ot<0.75){var t3=(ot-0.5)*4;ox=1*s+(7*s-1*s)*t3;oy=22*s+(14*s-22*s)*t3;}
    else{var t4=(ot-0.75)*4;ox=7*s+(4.5*s-7*s)*t4;oy=14*s+(4*s-14*s)*t4;}
    cx.fillStyle=ol;cx.beginPath();cx.arc(ox+hash(oi,0,'ol')*2-1,oy+hash(oi,1,'ol')*2-1,0.8+hash(oi,2,'ol')*2,0,6.28);cx.fill();
  }

  // === TORSO ===
  for(var ti=0;ti<60;ti++){var tx=(hash(ti,0,'torso')-0.5)*9*s,ty=-6*s+hash(ti,1,'torso')*11*s;
    cx.fillStyle=fl;cx.globalAlpha=0.8;
    cx.beginPath();cx.arc(tx,ty,0.8+hash(ti,2,'torso')*2.2,0,6.28);cx.fill();
  }cx.globalAlpha=1;

  // === HEAD ===
  for(var hi2=0;hi2<80;hi2++){var ha=hash(hi2,0,'head')*6.28,hd=Math.sqrt(hash(hi2,1,'head'))*5*s;
    cx.fillStyle=fl;cx.globalAlpha=0.85;
    cx.beginPath();cx.arc(1*s+Math.cos(ha)*hd,-10.5*s+Math.sin(ha)*hd,0.7+hash(hi2,2,'head')*2,0,6.28);cx.fill();
  }cx.globalAlpha=1;
  // Hair
  for(var hi3=0;hi3<50;hi3++){var hx2=1*s+hash(hi3,0,'hair')*10*s,hy2=-14*s+hash(hi3,1,'hair')*6*s;
    cx.fillStyle=hash(hi3,2,'hair')<0.5?ol:fl;
    cx.beginPath();cx.arc(hx2,hy2,0.6+hash(hi3,3,'hair')*2,0,6.28);cx.fill();
  }

  // === ARMS ===
  var armReach=Math.sin(t*2)*0.3*s;
  for(var ai=0;ai<15;ai++){var at=ai/14;
    cx.fillStyle=ol;cx.beginPath();
    cx.arc(-3*s+(-3*s+armReach+3*s)*at+hash(ai,0,'arml')*2,-3*s+(-18*s+3*s)*at+hash(ai,1,'arml')*2,1.2,0,6.28);cx.fill();
  }

  var lp=t*4.5,llx2=-2*s+Math.sin(lp)*4*s,rlx2=3*s+Math.sin(lp+Math.PI)*4*s;

  cx.restore();

function drawSky(clv){

// ===== PHASE 2 ACTIONS =====
function skipRation(){rationFood=0;rationWater=0;var a=crewHealth-(explorerAway?1:0);if(a>0&&Math.random()<0.3)crewHealth--;if(crewHealth<=0){endP2(false,'全员饥渴而亡');return}logPage=2;showLogPage()}
function doConsume(){var a=crewHealth-(explorerAway?1:0),nf=rationFood||a,nw=rationWater||a,ate=Math.min(res.food,nf),dr=Math.min(res.water,nw);res.food-=ate;res.water-=dr;if(ate<a||dr<a){if(Math.random()<0.3)crewHealth--}if(crewHealth<=0){endP2(false,'配给不足');return}rationFood=0;rationWater=0;logPage=2;showLogPage()}
function startExplore(){explorerAway=true;explorerReturnDay=day+1+Math.floor(Math.random()*6);explorerFound=[];logPage=3;showLogPage()}
function tendEngine(n){if(n>0&&res.coal>=1&&res.water>=1){res.coal-=1;res.water-=1;distance+=22+Math.floor(Math.random()*6)}else if(n>0){if(Math.random()<0.3){crewHealth--;if(crewHealth<=0){endP2(false,'锅炉熄火');return}}distance+=8+Math.floor(Math.random()*5)}else{distance+=8+Math.floor(Math.random()*5)}logPage=4;rollEvent();showLogPage()}
function rollEvent(){var r=Math.random(),lv=level;if(lv===2){if(r<0.15)eventToday={type:'luck'};else if(r<0.25)eventToday={type:'choice',subtype:'supplies'};else if(r<0.32)eventToday={type:'mice',loss:1};else eventToday=null;return}if(lv===3){if(r<0.1)eventToday={type:'luck'};else if(r<0.18)eventToday={type:'mice',loss:1+Math.floor(Math.random()*2)};else if(r<0.22)eventToday={type:'sick'};else eventToday=null;return}if(lv===8){if(r<0.45)eventToday={type:'rain'};else if(r<0.6)eventToday={type:'breakdown'};else if(r<0.72)eventToday={type:'bandit'};else if(r<0.82)eventToday={type:'mice',loss:2+Math.floor(Math.random()*2)};else if(r<0.9)eventToday={type:'sick'};else eventToday=null;return}if(lv===9){if(r<0.2)eventToday={type:'breakdown'};else if(r<0.35)eventToday={type:'bandit'};else if(r<0.5)eventToday={type:'mice',loss:2+Math.floor(Math.random()*3)};else if(r<0.65)eventToday={type:'sick'};else if(r<0.72)eventToday={type:'rain'};else eventToday=null;return}if(lv===10){if(r<0.25)eventToday={type:'breakdown'};else if(r<0.45)eventToday={type:'bandit'};else if(r<0.6)eventToday={type:'sick'};else if(r<0.72)eventToday={type:'mice',loss:3+Math.floor(Math.random()*3)};else if(r<0.8)eventToday={type:'rain'};else eventToday={type:'luck'};return}if(r<0.12)eventToday={type:'breakdown'};else if(r<0.22)eventToday={type:'choice',subtype:Math.random()<0.5?'supplies':'stranger'};else if(r<0.34)eventToday={type:'bandit'};else if(r<0.44)eventToday={type:'mice',loss:1+Math.floor(Math.random()*3)};else if(r<0.52)eventToday={type:'sick'};else if(r<0.6)eventToday={type:'rain'};else if(r<0.7)eventToday={type:'luck'};else eventToday=null}
function fixB(){if(res.iron>=1){res.iron-=1;eventToday=null;endDay()}else skipE()}
function healS(){if(res.meds>=1){res.meds-=1;eventToday=null;endDay()}else skipE()}
function skipE(){if(eventToday&&eventToday.type==='sick'){crewHealth--;if(crewHealth<=0){endP2(false,'病重不治');return}}eventToday=null;endDay()}
function fightB(){res.ammo--;eventToday=null;if(Math.random()<0.7){var loot2=[];if(Math.random()<0.6){res.iron+=2;loot2.push('🪨铁片×2')}if(Math.random()<0.6){res.water+=3;loot2.push('💧水×3')}if(loot2.length===0){res.food+=2;loot2.push('🍞食物×2')}explorerFound=loot2.map(function(s){var p=s.split('×');return{name:p[0].slice(2),icon:p[0].slice(0,2),amt:parseInt(p[1])}});endDay()}else{res.food=Math.max(0,res.food-2);res.water=Math.max(0,res.water-2);endDay()}}
function cureM(){res.meds--;eventToday=null;endDay()}
function doChoice(take){var sub=eventToday?eventToday.subtype:'supplies';eventToday=null;if(take){if(Math.random()<0.65){if(sub==='supplies'){res.food+=3;res.water+=2;res.coal+=2}else{res.food+=2;res.water+=2;res.iron+=1}endDay()}else{res.food=Math.max(0,res.food-3);res.water=Math.max(0,res.water-2);if(Math.random()<0.3)crewHealth--;if(crewHealth<=0){endP2(false,'全员覆没');return}endDay()}}else{endDay()}}
function resolveE(){if(eventToday&&eventToday.type==='mice')res.food=Math.max(0,res.food-eventToday.loss);if(eventToday&&eventToday.type==='luck'){res.food+=2;res.water+=1;res.coal+=1}if(eventToday&&eventToday.type==='bandit'&&eventToday.stolen){res.food=Math.max(0,res.food-eventToday.stolen.food);res.water=Math.max(0,res.water-eventToday.stolen.water)}eventToday=null;endDay()}
function calcScore(){score=Math.floor(distance*0.5+res.food*10+res.water*8+res.coal*5+res.iron*15+res.wood*8+crewHealth*200+res.gear*30+res.ammo*20);return score>800?'S':score>600?'A':score>400?'B':score>200?'C':'D'}
function endDay(){day++;if(explorerAway&&day>=explorerReturnDay){explorerAway=false;if(Math.random()<0.15){crewHealth--;explorerFound=[{name:'未归',icon:'💀',amt:0}]}else{var types=[{n:'铁片',icon:'🪨',k:'iron'},{n:'煤炭',icon:'🔥',k:'coal'},{n:'水',icon:'💧',k:'water'},{n:'木材',icon:'🪵',k:'wood'},{n:'食物',icon:'🍞',k:'food'},{n:'子弹',icon:'🔫',k:'ammo2'},{n:'猎枪',icon:'🔫',k:'gear2'},{n:'收音机',icon:'📻',k:'comm2'},{n:'棋盘',icon:'♟️',k:'chess2'}];explorerFound=[];var fc=2+Math.floor(Math.random()*3);for(var fi=0;fi<fc;fi++){var t=types[Math.floor(Math.random()*types.length)];var amt=1+Math.floor(Math.random()*3);if(!t.k.endsWith('2'))res[t.k]=(res[t.k]||0)+amt;else if(t.k==='gear2')res.gear=(res.gear||0)+amt;else if(t.k==='ammo2')res.ammo=(res.ammo||0)+amt;explorerFound.push({name:t.n,icon:t.icon,amt:amt})}}if(crewHealth<=0){endP2(false,'探索者未归');return}}if(distance>=goalDistance){endP2(true,'提前抵达远方！');return}if(level>=2&&(day-(level-2)*daysPerLevel)>daysPerLevel){level++;initWeather(level);if(level>10){endP2(true,'抵达远方！');return}showLevelIntro=true}logPage=1;eventToday=null;showLogPage()}

// ===== PHASE 1 LOGIC =====
function updInv(){var h='';for(var i=0;i<ITEMS.length;i++)h+='<span class=iv>'+inv[ITEMS[i].k]+' '+ITEMS[i].n+'</span>';document.getElementById('inv').innerHTML=h}

function gameOverP1(win){st='end';document.getElementById('over').classList.add('show');if(win){startPhase2();return}document.getElementById('ot').textContent='未抵达';document.getElementById('os').textContent='未能抵达最后一节车厢';document.getElementById('ctrls').style.display='none'}
function collect(it){if(it.got)return;it.got=true;inv[it.d.k]++;updInv();for(var i=0;i<8;i++)pts.push({x:it.x,y:it.y,vx:(Math.random()-0.5)*2.5,vy:-2-Math.random()*2.5,life:22,ml:22,c:it.d.c,s:1.5+Math.random()*2})}
function pickup(){for(var i=0;i<loot.length;i++){var l=loot[i];if(l.got)continue;if(Math.abs(player.x-l.x)<38&&Math.abs(player.y-l.y)<44)collect(l)}}
function startPhase2(){phase=2;st='play';level=2;showLevelIntro=true;res.food=inv.food;res.water=inv.water;res.coal=inv.coal;res.meds=inv.med;res.wood=0;res.iron=0;res.gear=inv.gear||0;res.ammo=inv.ammo||0;crewHealth=crewCount;day=1;logPage=1;distance=0;showLogbook()}
function up(dt){if(phase===2){pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return}if(st!=='play'){pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});return}time-=dt;if(time<0)time=0;document.getElementById('tm').textContent=Math.ceil(time)+'s';if(time<8)document.getElementById('hint').style.opacity='0';if(time<=0){gameOverP1(false);return}var dx=joyX;if(keys[37]||keys[65])dx=-1;if(keys[39]||keys[68])dx+=1;player.x+=dx*5*60*dt;player.x=Math.max(8,Math.min(cars[NC-1].x+cars[NC-1].w-8,player.x));var ci=Math.floor(player.x/carW());if(ci>=0&&ci<NC)player.y=cars[ci].y+cars[ci].h-20;if([0,2,4].indexOf(ci)>=0&&!crewFound[ci]){crewFound[ci]=true;crewCount++;var c2=cars[ci];loot.push({x:c2.x+c2.w*0.3,y:c2.y+c2.h-20,ci:ci,d:ITEMS[0],got:false});loot.push({x:c2.x+c2.w*0.6,y:c2.y+c2.h-20,ci:ci,d:ITEMS[2],got:false});document.getElementById('warn').style.opacity='1';document.getElementById('warn').innerHTML='找到同伴！（'+crewCount+'/3）';setTimeout(function(){document.getElementById('warn').style.opacity='0'},1500)}cam=player.x-W/2;cam=Math.max(0,Math.min(cars[NC-1].x+cars[NC-1].w-W,cam));var inL=ci===NC-1;if(inL&&!inLast){inLast=true;dc=0;document.getElementById('warn').style.opacity='1'}if(inL&&inLast){dc+=dt;document.getElementById('warn').innerHTML='最后一节<br>停留3秒过关';if(dc>=3)gameOverP1(true)}if(!inL&&inLast){inLast=false;dc=0;document.getElementById('warn').style.opacity='0'}pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0})}

// ===== INPUT =====
var joyX=0,joyActive=false,joyOX=0,joyOY=0,keys={};
var joy=document.getElementById('joy'),stick=document.getElementById('stick');
function joyMove(cx2,cy){var r=joy.getBoundingClientRect();var dx=cx2-r.left,dy=cy-r.top;if(!joyActive){joyOX=dx;joyOY=dy;joyActive=true}var mx=dx-joyOX,my=dy-joyOY;var d=Math.sqrt(mx*mx+my*my);if(d>30){mx=mx/d*30;my=my/d*30}stick.style.left=(28+mx)+'px';stick.style.top=(28+my)+'px';joyX=mx/30}
function joyEnd(){joyActive=false;joyX=0;stick.style.left='28px';stick.style.top='28px'}
joy.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY)});
joy.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY)});
joy.addEventListener('touchend',function(e){e.preventDefault();joyEnd()});
joy.addEventListener('touchcancel',function(e){e.preventDefault();joyEnd()});
joy.addEventListener('mousedown',function(e){e.preventDefault();joyMove(e.clientX,e.clientY)});
window.addEventListener('mousemove',function(e){if(joyActive)joyMove(e.clientX,e.clientY)});
window.addEventListener('mouseup',function(){if(joyActive)joyEnd()});
document.getElementById('pick').addEventListener('touchstart',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup()});
document.getElementById('pick').addEventListener('mousedown',function(e){e.preventDefault();if(st==='play'&&phase===1)pickup()});
window.addEventListener('keydown',function(e){keys[e.keyCode]=true;if(e.keyCode===32&&st==='play'&&phase===1){e.preventDefault();pickup()}});
window.addEventListener('keyup',function(e){keys[e.keyCode]=false});

// ===== START =====
makeCars();spawnLoot();makeStars();initWeather(1);updInv();player.x=carW()/2;
var lt=0;
(function loop(ts){var dt=lt?Math.min((ts-lt)/1000,0.1):0.016;lt=ts;if(st==='play'){updateWeather(dt)};up(dt);draw();requestAnimationFrame(loop)})(0);
</script>
</body>
