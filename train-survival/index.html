<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NIGHT TRAIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#140e1a;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:fixed}
#wrap{position:relative;width:100vw;height:100vh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;background:#1a1220;border-radius:8px;max-width:100vw;max-height:56vh;border:1px solid rgba(139,123,160,0.25)}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.hb{background:rgba(20,14,26,0.94);border:1px solid rgba(139,123,160,0.25);border-radius:5px;padding:5px 12px;font-size:12px;color:#8b7ba0;letter-spacing:1.5px;font-weight:300}
#inv{position:absolute;bottom:84px;left:10px;right:10px;display:flex;gap:4px;justify-content:center;pointer-events:none;z-index:10;flex-wrap:wrap}
.iv{background:rgba(20,14,26,0.94);border:1px solid rgba(139,123,160,0.2);border-radius:4px;padding:3px 8px;font-size:9px;color:#8b7ba0}
#ctrls{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;z-index:10}
#joy{width:96px;height:96px;background:rgba(42,26,58,0.45);border:1.5px solid rgba(196,168,224,0.2);border-radius:50%;position:relative;touch-action:none}
#stick{width:40px;height:40px;background:rgba(196,168,224,0.35);border:1px solid rgba(196,168,224,0.45);border-radius:50%;position:absolute;top:28px;left:28px;pointer-events:none}
#pick{width:60px;height:60px;background:rgba(122,144,200,0.18);border:1.5px solid rgba(122,144,200,0.35);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(196,168,224,0.7);margin-bottom:18px;touch-action:none}
#pick:active{background:rgba(122,144,200,0.35)}
#over{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(10,6,14,0.96);border-radius:8px}
#over.show{display:flex}
.ot{font-size:18px;color:#c4a8e0;letter-spacing:3px;margin-bottom:6px;font-weight:200}
.os{font-size:11px;color:#8b7ba0;margin-bottom:16px;font-weight:300}
.btn{background:rgba(122,144,200,0.12);border:1px solid rgba(122,144,200,0.3);color:#8b7ba0;padding:10px 26px;border-radius:6px;font-size:12px;letter-spacing:2px;cursor:pointer;margin:4px;font-weight:300}
.btn:active{background:rgba(122,144,200,0.25);color:#c4a8e0}
#hint{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);color:rgba(139,123,160,0.3);font-size:10px;letter-spacing:2px;pointer-events:none;z-index:5}
#warn{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);color:#c87080;font-size:12px;letter-spacing:2px;pointer-events:none;z-index:5;opacity:0;text-align:center;font-weight:300}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g"></canvas>
<div id="hud"><span class="hb" id="tm">60s</span><span class="hb">NIGHT TRAIN</span></div>
<div id="inv"></div>
<div id="hint">拖动摇杆 · 点击拾取</div>
<div id="warn"></div>
<div id="ctrls">
  <div id="joy"><div id="stick"></div></div>
  <div id="pick">✦</div>
</div>
<div id="over"><div class="ot" id="ot"></div><div class="os" id="os"></div><button class="btn" onclick="rst()">RETRY</button></div>
</div>
<script>
// ===== SETUP =====
var g=document.getElementById('g'), x=g.getContext('2d');
var W,H;
function resize(){
  W=Math.min(window.innerWidth-12,500);
  H=Math.min(window.innerHeight*0.54,600);
  g.width=W; g.height=H;
}

// ===== STATE =====
var cars=[], player={x:0,y:0}, cam=0, time=60, st='play';
var inv={food:0,coal:0,water:0,gear:0,comm:0,med:0};
var loot=[], pts=[], stars=[], inLast=false, dc=0;

// ===== COLORS (neutralized corpus palette) =====
var CL={
  sky1:'#140e1a', sky2:'#2a1a3a', sky3:'#4a3040',
  va:'#c4a8e0', ga:'#7a90c8', pe:'#c8a878',
  lg:'#7ac8a0', dc:'#c87080', la:'#8b7ba0', cw:'#e8d8f0',
  upperCar:'#241a30', lowerCar:'#3a2a50', roofDark:'#1a1220',
  chassis:'#0e0a14', wheel:'#1a1220', wheelRim:'#3a2a50'
};

// ===== CAR DATA =====
var NC=6;
function carW(){return W/3.5}
function carH(){return H*0.65}

function makeCars(){
  cars=[];
  for(var i=0;i<NC;i++){
    var cw=carW(), ch=carH();
    cars.push({x:i*cw, y:H*0.2, w:cw, h:ch, last:i===NC-1});
  }
}

// ===== ITEMS (drawn as recognizable shapes) =====
var IT=[
  {k:'food',n:'FOOD',c:CL.pe,
   draw:function(x,y,s){ // tin can
     var r=7; x.fillStyle='rgba(200,168,120,0.25)'; x.fillRect(x-s-r,y-s-r*0.6,r*2,r*1.2);
     x.strokeStyle=CL.pe; x.lineWidth=1; x.strokeRect(x-s-r,y-s-r*0.6,r*2,r*1.2);
     x.strokeStyle='rgba(200,168,120,0.4)'; x.lineWidth=0.5;
     x.beginPath(); x.moveTo(x-s-r+2,y-s-r*0.6+2); x.lineTo(x-s+r-2,y-s-r*0.6+2); x.stroke();
   }},
  {k:'coal',n:'COAL',c:'#5a4a60',
   draw:function(x,y,s){ // mineral chunk
     x.fillStyle='rgba(90,74,96,0.3)'; x.beginPath();
     x.moveTo(x-s-5,y-s*0.3); x.lineTo(x-s-2,y-s-5); x.lineTo(x-s+4,y-s-3);
     x.lineTo(x-s+6,y-s+2); x.lineTo(x-s+1,y-s+5); x.lineTo(x-s-4,y-s+3);
     x.closePath(); x.fill();
     x.strokeStyle='rgba(139,123,160,0.4)'; x.lineWidth=0.8; x.stroke();
   }},
  {k:'water',n:'WATER',c:CL.ga,
   draw:function(x,y,s){ // canteen
     x.fillStyle='rgba(122,144,200,0.2)'; x.beginPath();
     x.arc(x-s,y-s,7,0,6.28); x.fill();
     x.strokeStyle=CL.ga; x.lineWidth=1; x.stroke();
     x.fillStyle='rgba(122,144,200,0.4)'; x.fillRect(x-s-1.5,y-s-12,3,5); // cap
     x.strokeStyle=CL.ga; x.lineWidth=0.5; x.strokeRect(x-s-1.5,y-s-12,3,5);
   }},
  {k:'gear',n:'ARM',c:CL.la,
   draw:function(x,y,s){ // gun silhouette
     x.fillStyle='rgba(139,123,160,0.35)';
     x.fillRect(x-s-1.5,y-s-6,3,10); // barrel
     x.fillRect(x-s-5,y-s+4,10,5); // body
     x.fillRect(x-s-6,y-s+6,2,4); // grip
     x.strokeStyle=CL.la; x.lineWidth=0.8;
     x.strokeRect(x-s-1.5,y-s-6,3,10);
     x.strokeRect(x-s-5,y-s+4,10,5);
     x.strokeRect(x-s-6,y-s+6,2,4);
   }},
  {k:'comm',n:'COMM',c:'#a89870',
   draw:function(x,y,s){ // vintage radio
     x.fillStyle='rgba(168,152,112,0.25)'; x.fillRect(x-s-6,y-s-5,12,10);
     x.strokeStyle='#a89870'; x.lineWidth=1; x.strokeRect(x-s-6,y-s-5,12,10);
     x.fillStyle='rgba(168,152,112,0.4)'; x.fillRect(x-s-4,y-s-3,8,4); // screen
     x.strokeStyle='#a89870'; x.lineWidth=0.5;
     x.beginPath(); x.moveTo(x-s,y-s-5); x.lineTo(x-s,y-s-10); x.stroke(); // antenna
     x.beginPath(); x.arc(x-s,y-s-10,1.5,0,6.28); x.stroke(); // antenna tip
   }},
  {k:'med',n:'MED',c:CL.dc,
   draw:function(x,y,s){ // medical cross
     x.fillStyle='rgba(200,112,128,0.3)';
     x.fillRect(x-s-2,y-s-6,4,12);
     x.fillRect(x-s-6,y-s-2,12,4);
     x.strokeStyle=CL.dc; x.lineWidth=0.8;
     x.strokeRect(x-s-2,y-s-6,4,12);
     x.strokeRect(x-s-6,y-s-2,12,4);
   }}
];

function spawnLoot(){
  loot=[];
  for(var i=0;i<NC;i++){
    var c=cars[i], n=3+Math.floor(Math.random()*4);
    for(var j=0;j<n;j++){
      var d=IT[Math.floor(Math.random()*IT.length)];
      loot.push({x:c.x+24+Math.random()*(c.w-50), y:c.y+c.h-32-Math.random()*16, ci:i, d:d, got:false});
    }
  }
}

// ===== STARS =====
function makeStars(){
  stars=[];
  for(var i=0;i<200;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H*0.78,
      r:0.4+Math.random()*1.5, a:0.2+Math.random()*0.5,
      tw:Math.random()*6.28, ts:1+Math.random()*3
    });
  }
}

// ===== UI =====
function updInv(){
  var h='';
  for(var i=0;i<IT.length;i++) h+='<span class=iv>'+inv[IT[i].k]+' '+IT[i].n+'</span>';
  document.getElementById('inv').innerHTML=h;
}

// ===== GAME FLOW =====
function rst(){
  time=60; st='play'; inv={food:0,coal:0,water:0,gear:0,comm:0,med:0};
  inLast=false; dc=0; pts=[]; loot=[];
  makeCars(); spawnLoot(); makeStars();
  player.x=carW()/2; cam=0;
  document.getElementById('over').classList.remove('show');
  document.getElementById('warn').style.opacity='0';
  document.getElementById('hint').style.opacity='1';
  document.getElementById('ctrls').style.display='flex';
  updInv();
}

function gameOver(win){
  st='end';
  document.getElementById('over').classList.add('show');
  var total=0; for(var k in inv) total+=inv[k];
  if(win){
    document.getElementById('ot').textContent='✦ DETACHED';
    document.getElementById('os').textContent='Collected '+total+' items';
  }else{
    document.getElementById('ot').textContent='✦ END';
    document.getElementById('os').textContent='Did not reach last car';
  }
  document.getElementById('ctrls').style.display='none';
}

function collect(it){
  if(it.got)return; it.got=true; inv[it.d.k]++; updInv();
  for(var i=0;i<8;i++) pts.push({x:it.x,y:it.y,vx:(Math.random()-0.5)*2.5,vy:-2-Math.random()*2.5,life:22,ml:22,c:it.d.c,s:1.5+Math.random()*2});
}

function pickup(){
  for(var i=0;i<loot.length;i++){
    var l=loot[i]; if(l.got)continue;
    if(Math.abs(player.x-l.x)<32&&Math.abs(player.y-l.y)<36) collect(l);
  }
}

// ===== UPDATE =====
function up(dt){
  if(st!=='play'){
    pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});
    return;
  }
  time-=dt; if(time<0)time=0;
  document.getElementById('tm').textContent=Math.ceil(time)+'s';
  if(time<15)document.getElementById('tm').style.color=CL.dc;
  else document.getElementById('tm').style.color=CL.la;
  if(time<8)document.getElementById('hint').style.opacity='0';
  if(time<=0){gameOver(false);return;}

  var dx=joyX;
  if(keys[37]||keys[65])dx=-1;
  if(keys[39]||keys[68])dx+=1;
  player.x+=dx*5*60*dt;
  player.x=Math.max(8,Math.min(cars[NC-1].x+cars[NC-1].w-8,player.x));
  var ci=Math.floor(player.x/carW());
  if(ci>=0&&ci<NC)player.y=cars[ci].y+cars[ci].h-36;
  cam=player.x-W/2;
  cam=Math.max(0,Math.min(cars[NC-1].x+cars[NC-1].w-W,cam));

  var inL=ci===NC-1;
  if(inL&&!inLast){inLast=true;dc=0;document.getElementById('warn').style.opacity='1';}
  if(inL&&inLast){dc+=dt;document.getElementById('warn').innerHTML='LAST CAR<br>'+Math.ceil(3-dc)+'s';if(dc>=3)gameOver(true);}
  if(!inL&&inLast){inLast=false;dc=0;document.getElementById('warn').style.opacity='0';}

  pts=pts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});
}

// ===== DRAW =====
function drawCar(x,c,ca){
  var cx=ca.x-c, cy=ca.y, cw=ca.w, ch=ca.h, uh=ch*0.48, t=Date.now()/1000;

  // === BODY: Two-tone + panel lines ===
  // Upper body
  var ug=x.createLinearGradient(cx,cy,cx,cy+uh);
  ug.addColorStop(0,'#241a30'); ug.addColorStop(0.5,'#1e1430'); ug.addColorStop(1,'#2a1c38');
  x.fillStyle=ug; x.fillRect(cx,cy,cw,uh);

  // Lower body
  var lg=x.createLinearGradient(cx,cy+uh,cx,cy+ch);
  lg.addColorStop(0,'#3a2a50'); lg.addColorStop(0.5,'#342248'); lg.addColorStop(1,'#2a1a3a');
  x.fillStyle=lg; x.fillRect(cx,cy+uh,cw,ch-uh);

  // Coachline stripe
  x.strokeStyle=CL.va; x.globalAlpha=0.4; x.lineWidth=1;
  x.beginPath(); x.moveTo(cx+6,cy+uh); x.lineTo(cx+cw-6,cy+uh); x.stroke();
  x.globalAlpha=1;

  // Crystal Over highlight — glossy top reflection
  var hl=x.createLinearGradient(cx,cy,cx,cy+9);
  hl.addColorStop(0,'rgba(232,216,240,0.18)'); hl.addColorStop(1,'transparent');
  x.fillStyle=hl; x.fillRect(cx,cy,cw,9);

  // Vertical panel seams (rivet lines)
  for(var ps=cx+cw*0.33;ps<cx+cw;ps+=cw*0.33){
    x.strokeStyle='rgba(196,168,224,0.12)'; x.lineWidth=0.5;
    x.beginPath(); x.moveTo(ps,cy+4); x.lineTo(ps,cy+ch-8); x.stroke();
    // Rivet dots
    x.fillStyle='rgba(196,168,224,0.15)';
    for(var ry=cy+10;ry<cy+ch-10;ry+=18){
      x.beginPath(); x.arc(ps,ry,1.2,0,6.28); x.fill();
    }
  }

  // === WINDOWS ===
  var wx=cx+cw*0.07, ww=cw*0.24, wy=cy+7, wh=uh-14;
  for(var wi=0;wi<3;wi++){
    var wxi=wx+wi*(ww+6);
    // Window glow
    x.fillStyle='rgba(200,168,120,0.12)'; x.fillRect(wxi,wy,ww,wh);
    // Window frame
    x.strokeStyle='rgba(196,168,224,0.22)'; x.lineWidth=0.8;
    x.strokeRect(wxi,wy,ww,wh);
    // Inner reflection
    x.fillStyle='rgba(232,216,240,0.04)'; x.fillRect(wxi+2,wy+2,ww-4,wh*0.4);
  }

  // === ROOF with vents ===
  x.fillStyle=CL.roofDark; x.fillRect(cx,cy-5,cw,6);
  x.strokeStyle='rgba(139,123,160,0.15)'; x.lineWidth=0.5;
  x.strokeRect(cx,cy-5,cw,6);
  // Roof vent
  for(var rv=cx+cw*0.2;rv<cx+cw*0.9;rv+=cw*0.3){
    x.fillStyle='rgba(139,123,160,0.2)'; x.fillRect(rv-3,cy-4,6,3);
  }

  // === CHASSIS ===
  x.fillStyle=CL.chassis; x.fillRect(cx,cy+ch-7,cw,8);
  x.strokeStyle='rgba(139,123,160,0.12)'; x.lineWidth=0.4;
  x.strokeRect(cx,cy+ch-7,cw,8);

  // === BOGIES / WHEELS ===
  for(var bi=0;bi<2;bi++){
    var bx=cx+cw*0.2+bi*cw*0.55;
    // Bogie frame
    x.fillStyle='#1a1220'; x.fillRect(bx-10,cy+ch-5,20,7);
    x.strokeStyle='rgba(139,123,160,0.2)'; x.lineWidth=0.5;
    x.strokeRect(bx-10,cy+ch-5,20,7);
    // Wheels
    for(var wi2=0;wi2<2;wi2++){
      var wx2=bx-5+wi2*11, wy2=cy+ch+1;
      x.fillStyle=CL.wheel; x.beginPath(); x.arc(wx2,wy2,3.5,0,6.28); x.fill();
      x.strokeStyle=CL.wheelRim; x.lineWidth=0.6; x.stroke();
      // Hub
      x.fillStyle='rgba(196,168,224,0.25)'; x.beginPath(); x.arc(wx2,wy2,1,0,6.28); x.fill();
    }
  }

  // === COUPLER ===
  if(!ca.last){
    x.fillStyle='#1a1220'; x.fillRect(cx+cw-6,cy+ch*0.35,7,ch*0.2);
    x.strokeStyle='rgba(139,123,160,0.25)'; x.lineWidth=0.5;
    x.strokeRect(cx+cw-6,cy+ch*0.35,7,ch*0.2);
    // Chain
    x.strokeStyle='rgba(196,168,224,0.15)'; x.lineWidth=0.4;
    x.beginPath(); x.moveTo(cx+cw-2,cy+ch*0.45); x.lineTo(cx+cw+6,cy+ch*0.45); x.stroke();
  }

  // === DETACH ZONE ===
  if(ca.last){
    var a=0.15+0.1*Math.sin(t*2.5);
    x.strokeStyle='rgba(200,112,128,'+(0.3+a)+')'; x.lineWidth=1.8;
    x.strokeRect(cx+2,cy+2,cw-4,ch-4);
    var dz=x.createLinearGradient(cx,cy+ch-26,cx,cy+ch);
    dz.addColorStop(0,'transparent'); dz.addColorStop(1,'rgba(200,112,128,0.12)');
    x.fillStyle=dz; x.fillRect(cx,cy+ch-26,cw,26);
    // Neon pulse line
    x.strokeStyle='rgba(200,112,128,'+(0.4+a*0.5)+')'; x.lineWidth=0.8;
    x.beginPath(); x.moveTo(cx+12,cy+ch-18); x.lineTo(cx+cw-12,cy+ch-18); x.stroke();
    x.fillStyle='rgba(200,112,128,'+(0.5+a*0.3)+')'; x.font='8px system-ui';
    x.textAlign='center'; x.fillText('DETACH',cx+cw/2,cy+ch-6);
  }

  // Car number
  x.fillStyle='rgba(139,123,160,0.25)'; x.font='7px system-ui'; x.textAlign='left';
  x.fillText('NO.'+(ca.last?'6':String(ca.carIdx+1)),cx+8,cy+18);
}

function drawItem(x,lx,ly,d,s){
  // Subtle floor shadow
  x.fillStyle='rgba(10,6,14,0.3)'; x.beginPath(); x.ellipse(lx,ly+2,8,2,0,0,6.28); x.fill();
  // Draw the item
  d.draw(x,lx,ly,s);
  // Label below
  x.fillStyle=d.c; x.globalAlpha=0.5; x.font='5.5px system-ui'; x.textAlign='center';
  x.fillText(d.n,lx,ly+12);
  x.globalAlpha=1;
}

function drawPlayer(x,px,py,t){
  // Shadow
  x.fillStyle='rgba(10,6,14,0.35)'; x.beginPath(); x.ellipse(px,py+16,6,1.5,0,0,6.28); x.fill();

  // === Contemporary art figure — elongated, geometric, romantic ===

  // Legs — long thin lines
  x.strokeStyle='rgba(196,168,224,0.5)'; x.lineWidth=1.8; x.lineCap='round';
  x.beginPath(); x.moveTo(px-2.5,py+4); x.lineTo(px-3,py+15); x.stroke();
  x.beginPath(); x.moveTo(px+2.5,py+4); x.lineTo(px+3,py+15); x.stroke();

  // Body — elongated triangle / coat shape
  x.fillStyle='rgba(58,42,80,0.8)';
  x.beginPath(); x.moveTo(px,py-16); x.lineTo(px-5,py+4); x.lineTo(px+5,py+4); x.closePath(); x.fill();
  x.strokeStyle=CL.va; x.lineWidth=0.6; x.globalAlpha=0.4;
  x.stroke();
  x.globalAlpha=1;

  // Coat stripe — Vapour Violet accent
  x.strokeStyle=CL.va; x.lineWidth=0.8; x.globalAlpha=0.35;
  x.beginPath(); x.moveTo(px-3,py-6); x.lineTo(px+3,py-6); x.stroke();
  x.globalAlpha=1;

  // Head — abstract geometric oval
  x.fillStyle=CL.cw; x.beginPath(); x.ellipse(px,py-16,4.5,5.5,0,0,6.28); x.fill();
  x.strokeStyle='rgba(196,168,224,0.5)'; x.lineWidth=0.7; x.stroke();

  // Eye — single dot, Giacometti-style
  x.fillStyle='rgba(20,14,26,0.7)'; x.beginPath(); x.arc(px-1.5,py-18,1,0,6.28); x.fill();
  x.fillStyle='rgba(20,14,26,0.7)'; x.beginPath(); x.arc(px+1.5,py-18,1,0,6.28); x.fill();

  // Flowing scarf / ribbon — romantic movement
  var scx=px-4, scy=py-12;
  x.strokeStyle=CL.va; x.lineWidth=1.2; x.globalAlpha=0.45; x.lineCap='round';
  x.beginPath(); x.moveTo(scx,scy);
  x.quadraticCurveTo(scx-8+Math.sin(t*3)*3, scy-5, scx-10+Math.sin(t*3.5)*4, scy+2);
  x.stroke();
  x.strokeStyle='rgba(200,112,128,0.3)'; x.lineWidth=0.6;
  x.beginPath(); x.moveTo(scx,scy+1);
  x.quadraticCurveTo(scx-6+Math.sin(t*3.5)*2, scy-3, scx-9+Math.sin(t*4)*3, scy+4);
  x.stroke();
  x.globalAlpha=1;
}

// ===== SKY & ENVIRONMENT =====
function drawSky(x){
  var sky=x.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,CL.sky1); sky.addColorStop(0.25,CL.sky2);
  sky.addColorStop(0.55,'#3a2035'); sky.addColorStop(0.75,CL.sky3);
  sky.addColorStop(0.9,'#1a0c08'); sky.addColorStop(1,'#0e0804');
  x.fillStyle=sky; x.fillRect(0,0,W,H);

  var t=Date.now()/1000;
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    x.fillStyle=CL.va; x.globalAlpha=s.a*(0.5+0.5*Math.sin(t*s.ts+s.tw));
    x.beginPath(); x.arc(s.x-cam*0.02,s.y,s.r,0,6.28); x.fill();
  }
  x.globalAlpha=1;
}

function drawGround(x){
  // Earth
  x.fillStyle='#1a1008'; x.fillRect(0,H*0.8,W,H*0.2);

  // Ballast / gravel texture
  for(var bi=0;bi<60;bi++){
    x.fillStyle='rgba(42,26,24,'+(0.08+Math.random()*0.08)+')';
    x.fillRect(Math.random()*W,H*0.81+Math.random()*H*0.17,1.5+Math.random()*1.5,0.8+Math.random()*0.8);
  }

  // Rails — polished steel
  for(var rx=-(cam%36);rx<W;rx+=36){
    // Rail base
    x.fillStyle='#1a1220'; x.fillRect(rx,H*0.8+2,5,8);
    // Rail head — metallic highlight
    x.fillStyle='rgba(139,123,160,0.25)'; x.fillRect(rx+1.5,H*0.8+2,2,8);
    // Tie / sleeper
    x.fillStyle='rgba(200,168,120,0.1)'; x.fillRect(rx-8,H*0.8+6,21,1.8);
    x.strokeStyle='rgba(200,168,120,0.06)'; x.lineWidth=0.4;
    x.strokeRect(rx-8,H*0.8+6,21,1.8);
  }
}

function drawSmoke(x){
  var t=Date.now()/300;
  var scx=cars[0].x-cam-8;
  for(var si=0;si<5;si++){
    var sy=55+si*15+Math.sin(t*1.7+si)*7;
    var sr=7+si*3;
    x.fillStyle=CL.pe; x.globalAlpha=0.06+0.02*Math.sin(t*2+si);
    x.beginPath(); x.arc(scx-Math.sin(t+si)*5,sy,sr,0,6.28); x.fill();
    if(si>1){
      x.fillStyle=CL.dc; x.globalAlpha=0.03+0.02*Math.sin(t+si);
      x.beginPath(); x.arc(scx-3-Math.sin(t+si)*3,sy-2,sr*0.5,0,6.28); x.fill();
    }
  }
  x.globalAlpha=1;
}

function drawVignette(x){
  var vig=x.createRadialGradient(W/2,H*0.4,W*0.2,W/2,H*0.4,W*0.85);
  vig.addColorStop(0,'transparent'); vig.addColorStop(0.55,'rgba(10,6,14,0.08)');
  vig.addColorStop(1,'rgba(10,6,14,0.6)');
  x.fillStyle=vig; x.fillRect(0,0,W,H);
}

// ===== MAIN DRAW =====
function draw(){
  x.clearRect(0,0,W,H);
  drawSky(x);
  drawGround(x);
  drawSmoke(x);

  // Cars
  for(var ci=0;ci<cars.length;ci++){
    var ca=cars[ci];
    ca.carIdx=ci; // attach index for drawing
    drawCar(x,cam,ca);
  }

  // Loot
  for(var li=0;li<loot.length;li++){
    var l=loot[li]; if(l.got)continue;
    var lx=l.x-cam; if(lx<-30||lx>W+30)continue;
    drawItem(x,lx,l.y,l.d,lx);
  }

  // Player
  drawPlayer(x,player.x-cam,player.y,Date.now()/1000);

  // Particles
  for(var pi=0;pi<pts.length;pi++){
    var p=pts[pi];
    x.globalAlpha=p.life/p.ml; x.fillStyle=p.c;
    x.beginPath(); x.moveTo(p.x-cam,p.y-p.s); x.lineTo(p.x-cam+p.s,p.y);
    x.lineTo(p.x-cam,p.y+p.s); x.lineTo(p.x-cam-p.s,p.y); x.closePath(); x.fill();
  }
  x.globalAlpha=1;

  drawVignette(x);
}

// ===== LOOP =====
var lt=0;
function loop(ts){
  var dt=lt?Math.min((ts-lt)/1000,0.1):0.016; lt=ts;
  try{up(dt);}catch(e){}
  try{draw();}catch(e){}
  requestAnimationFrame(loop);
}

// ===== INPUT =====
var joyX=0, joyActive=false, joyOX=0, joyOY=0;
var keys={};
var joy=document.getElementById('joy'), stick=document.getElementById('stick');

function joyMove(cx,cy){
  var r=joy.getBoundingClientRect();
  var dx=cx-r.left, dy=cy-r.top;
  if(!joyActive){joyOX=dx; joyOY=dy; joyActive=true;}
  var mx=dx-joyOX, my=dy-joyOY;
  var d=Math.sqrt(mx*mx+my*my);
  if(d>30){mx=mx/d*30; my=my/d*30;}
  stick.style.left=(28+mx)+'px'; stick.style.top=(28+my)+'px';
  joyX=mx/30;
}

function joyEnd(){
  joyActive=false; joyX=0;
  stick.style.left='28px'; stick.style.top='28px';
}

joy.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY);});
joy.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];joyMove(t.clientX,t.clientY);});
joy.addEventListener('touchend',function(e){e.preventDefault();joyEnd();});
joy.addEventListener('touchcancel',function(e){e.preventDefault();joyEnd();});
joy.addEventListener('mousedown',function(e){e.preventDefault();joyMove(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){if(joyActive)joyMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',function(){if(joyActive)joyEnd();});

var pick=document.getElementById('pick');
pick.addEventListener('touchstart',function(e){e.preventDefault();if(st==='play')pickup();});
pick.addEventListener('mousedown',function(e){e.preventDefault();if(st==='play')pickup();});

window.addEventListener('keydown',function(e){
  keys[e.keyCode]=true;
  if(e.keyCode===32&&st==='play'){e.preventDefault();pickup();}
});
window.addEventListener('keyup',function(e){keys[e.keyCode]=false;});

// ===== START =====
resize();
makeCars();
spawnLoot();
makeStars();
updInv();
player.x=carW()/2;
requestAnimationFrame(loop);
</script>
